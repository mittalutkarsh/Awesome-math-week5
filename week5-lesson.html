th d=\"M0 0 L10 5 L0 10z\" class=\"ahead\"/><\/marker><\/defs><rect x=\"112\" y=\"25.0\" width=\"120\" height=\"60\" rx=\"14\" class=\"groupbox\"/><text x=\"172.0\" y=\"19.0\" class=\"cap\" text-anchor=\"middle\">one group<\/text><text x=\"172.0\" y=\"62.0\" class=\"groupt\" text-anchor=\"middle\">{ D, P }<\/text><text x=\"172.0\" y=\"103.0\" class=\"cap\" text-anchor=\"middle\">2 lists \u2192 1<\/text><\/svg><svg class=\"pic \" viewBox=\"0 0 280 70\" role=\"img\" aria-label=\"remove the order\" style=\"max-width:406px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"83\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"51.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">5 \u00d7 4<\/text><text x=\"116.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">\u00f7<\/text><rect x=\"140\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"155.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">2<\/text><text x=\"194.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"218\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"240.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">10<\/text><\/svg><\/div><\/div><figcaption><p>The reason it&#x27;s 10 and not 20. Count with order: Ana&#x27;s first job can be any of 5, and her second any of the 4 left: 5 \u00d7 4 = 20. Remove the order: those 20 count every pile twice, because \u201cDishes then Pets\u201d and \u201cPets then Dishes\u201d are the same pile in her hands. 20 \u00f7 2 = 10. That&#x27;s the teacher&#x27;s \u201ccount with order, then remove the order\u201d from Week 4, and 5C2 = 5!/(2! \u00d7 3!) = 10 is the short way to write it.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 416 134\" role=\"img\" aria-label=\"slots\" style=\"max-width:603px\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"47.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">Ben<\/text><rect x=\"10\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"47.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">3<\/text><text x=\"99.0\" y=\"62\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><text x=\"151.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">Cal<\/text><rect x=\"114\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"151.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">2<\/text><text x=\"203.0\" y=\"62\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><text x=\"255.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">Dee<\/text><rect x=\"218\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"255.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">1<\/text><text x=\"307.0\" y=\"62\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"322\" y=\"28\" width=\"84\" height=\"50\" rx=\"8\" class=\"result\"/><text x=\"364.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">6<\/text><text x=\"208.0\" y=\"128\" class=\"cap\" text-anchor=\"middle\">the 3 jobs left, one each<\/text><\/svg><\/div><figcaption><p>And then: the 3 jobs left go to the other 3 kids, one each: 3 \u00d7 2 \u00d7 1 = 6.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><div class=\"vstack\"><svg class=\"pic \" viewBox=\"0 0 406 124\" role=\"img\" aria-label=\"list\" style=\"max-width:589px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"6\" width=\"190\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"103.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">Ben T \u00b7 Cal L \u00b7 Dee G<\/text><rect x=\"204\" y=\"6\" width=\"190\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"299.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">Ben T \u00b7 Cal G \u00b7 Dee L<\/text><rect x=\"8\" y=\"36\" width=\"190\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"103.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">Ben L \u00b7 Cal T \u00b7 Dee G<\/text><rect x=\"204\" y=\"36\" width=\"190\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"299.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">Ben L \u00b7 Cal G \u00b7 Dee T<\/text><rect x=\"8\" y=\"66\" width=\"190\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"103.0\" y=\"83\" class=\"lt\" text-anchor=\"middle\">Ben G \u00b7 Cal T \u00b7 Dee L<\/text><rect x=\"204\" y=\"66\" width=\"190\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"299.0\" y=\"83\" class=\"lt\" text-anchor=\"middle\">Ben G \u00b7 Cal L \u00b7 Dee T<\/text><text x=\"203.0\" y=\"118\" class=\"cap\" text-anchor=\"middle\">Ana = D P; then T, L, G go to Ben, Cal, Dee<\/text><\/svg><table class=\"ptable \"><thead><tr><th><\/th><th>jobs still left<\/th><th>choices<\/th><th>that kid does<\/th><\/tr><\/thead><tbody><tr><td>Ben<\/td><td>T, L, G<\/td><td>3<\/td><td>1 job<\/td><\/tr><tr><td>Cal<\/td><td>the 2 Ben didn&#x27;t take<\/td><td>2<\/td><td>1 job<\/td><\/tr><tr><td>Dee<\/td><td>the last one<\/td><td>1<\/td><td>1 job<\/td><\/tr><\/tbody><\/table><\/div><\/div><figcaption><p>Take one pile, Ana = D P. The 3 jobs left, T, L and G, go to Ben, Cal and Dee. Each of them does exactly 1 job; it&#x27;s the number of choices that shrinks: Ben has 3, Cal has 2, Dee has the last 1. So 3 \u00d7 2 \u00d7 1 = 6 ways, the same 6 for every one of the 10 piles.<\/p><div class=\"ask\"><b>Ask him:<\/b> Does anyone do 3 jobs here?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><div class=\"vstack\"><svg class=\"pic \" viewBox=\"0 0 319 70\" role=\"img\" aria-label=\"Ana is busy\" style=\"max-width:463px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"122\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"71.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">10 piles<\/text><text x=\"155.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><rect x=\"179\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"194.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">6<\/text><text x=\"233.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"257\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"279.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">60<\/text><\/svg><svg class=\"pic \" viewBox=\"0 0 319 70\" role=\"img\" aria-label=\"any kid can be busy\" style=\"max-width:463px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"96\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"58.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">4 kids<\/text><text x=\"129.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><rect x=\"153\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"175.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">60<\/text><text x=\"220.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"244\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"272.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">240<\/text><\/svg><\/div><\/div><figcaption><p>When Ana is the busy kid: 10 piles \u00d7 6 = 60 ways. And any of the 4 kids could be the busy one: 4 \u00d7 60 = 240, the same total the brute-force check found.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 416 112\" role=\"img\" aria-label=\"slots\" style=\"max-width:603px\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"47.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">who gets 2<\/text><rect x=\"10\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"47.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">4<\/text><text x=\"99.0\" y=\"62\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><text x=\"151.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">which 2 jobs<\/text><rect x=\"114\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"151.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">10<\/text><text x=\"203.0\" y=\"62\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><text x=\"255.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">the rest<\/text><rect x=\"218\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"255.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">6<\/text><text x=\"307.0\" y=\"62\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"322\" y=\"28\" width=\"84\" height=\"50\" rx=\"8\" class=\"result\"/><text x=\"364.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">240<\/text><\/svg><\/div><figcaption><p>First ___, and then ___, and then ___: multiply. 4 \u00d7 10 \u00d7 6 = 240.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>case (cases add +)<\/th><th>inside the case: first, and then (steps multiply \u00d7)<\/th><th>count<\/th><\/tr><\/thead><tbody><tr><td>structure 2, 1, 1, 1 (the only case)<\/td><td>4 \u00d7 10 \u00d7 6<\/td><td>240<\/td><\/tr><tr class=\"hl\"><td>total (add the cases)<\/td><td>just one case<\/td><td>240<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>The shape of every Week 5 problem: split it into cases, multiply the steps inside each case (\u201cfirst ___, and then ___\u201d), then add the cases (\u201ceither ___ or ___\u201d). Here there is only one case, so there is nothing to add.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 319 92\" role=\"img\" aria-label=\"tempting\" style=\"max-width:463px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"109\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"64.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">5\u00b74\u00b73\u00b72<\/text><text x=\"142.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><rect x=\"166\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"181.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">4<\/text><text x=\"220.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"244\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"272.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">480<\/text><line x1=\"6\" y1=\"60\" x2=\"313\" y2=\"12\" class=\"strike banned big\"/><text x=\"159.5\" y=\"86\" class=\"cap\" text-anchor=\"middle\">builds each assignment twice<\/text><\/svg><\/div><figcaption><p>Tempting: give each kid one job (5 \u00d7 4 \u00d7 3 \u00d7 2), then the spare job to anyone (\u00d7 4) = 480. But Ana&#x27;s two jobs get counted in both orders (Dishes first or Pets first), so each answer is built twice.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 340 82\" role=\"img\" aria-label=\"either, or\" style=\"max-width:493px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"4\" y=\"4\" width=\"332\" height=\"74\" rx=\"10\" class=\"wcard \"/><text x=\"170.0\" y=\"32\" class=\"cardt\" text-anchor=\"middle\">only one structure: 2, 1, 1, 1<\/text><text x=\"170.0\" y=\"58\" class=\"cardt\" text-anchor=\"middle\">\u2192 one case, nothing to add<\/text><\/svg><\/div><figcaption><p>Either, or? Here every answer has the same structure, so there&#x27;s just one case and nothing to add. (With 6 jobs there would be two structures, 3,1,1,1 or 2,2,1,1, and those cases would add.)<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"4\"><p class=\"ftitle\">4. Check a tiny case<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 326 64\" role=\"img\" aria-label=\"list\" style=\"max-width:473px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"6\" width=\"46\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"31.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">AAB<\/text><rect x=\"60\" y=\"6\" width=\"46\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"83.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">ABA<\/text><rect x=\"112\" y=\"6\" width=\"46\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"135.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">ABB<\/text><rect x=\"164\" y=\"6\" width=\"46\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"187.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">BAA<\/text><rect x=\"216\" y=\"6\" width=\"46\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"239.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">BAB<\/text><rect x=\"268\" y=\"6\" width=\"46\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"291.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">BBA<\/text><text x=\"163.0\" y=\"58\" class=\"cap\" text-anchor=\"middle\">structure 2, 1: 2 kids \u00d7 3C2 \u00d7 1 = 6<\/text><\/svg><\/div><figcaption><p>Tiny case: 3 jobs for kids A and B, both used. Structure: 2 and 1. Who gets 2 (2) \u00d7 which 2 jobs (3) \u00d7 the last job (1) = 6, and the list of job-by-job kid letters has 6.<\/p><\/figcaption><\/figure><\/div><\/div><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><input type=\"checkbox\" class=\"showall\"> Show all steps<\/label><\/div><\/div>", "answer": "240", "check": "Structure 2, 1, 1, 1: 4 \u00d7 5C2 \u00d7 3! = 4 \u00d7 10 \u00d7 6 = 240; brute force over all 1,024 assignments agrees.", "concept": "w5struct", "inclass": null, "above": false, "note": null, "figure": null}, {"id": "w5l4", "label": "Problem 4", "section": "Lesson problems", "text": "(Example 1.3) Suppose there are 7 jobs to be done and 5 people that will do them. If each person is assigned at least one job, how many ways are there to assign the 7 jobs?", "steps": [{"q": "Step 1, structure: what is the most jobs any one person can end up doing?", "type": "num", "ans": 3, "nudges": ["Give everyone one job first. How many jobs are still unassigned?", "Could all the unassigned jobs go to the same person?", "If one person had even more, would someone be left with nothing?"], "hint": "Make cases by structure: find every way the job piles could look. Each structure is a case. Everyone needs one job first. Then ask where the leftover jobs can go.", "reveal": "3: one job of their own plus both leftovers. (Otherwise the leftovers go to two people: 2, 2, 1, 1, 1.)", "check": "Testing all 78,125 assignments finds piles of at most 3.", "ok": "So the structures are 3, 1, 1, 1, 1 and 2, 2, 1, 1, 1.", "named": {"4": "Then there wouldn't be enough jobs left for the other 4 people: someone gets nothing.", "2": "Could the leftover jobs both go to the same person?", "7": "Everyone else needs at least one job too."}, "ph": "number or expression", "special": null, "order": false}, {"q": "Case A (one person does 3 jobs): how many ways?", "type": "num", "ans": 4200, "nudges": ["First: who does the 3 jobs?", "And then: which 3 jobs? Does their order matter?", "And then: the other 4 jobs to the other 4 people, one each."], "hint": "Who does 3 (5) \u00d7 which 3 jobs (7C3) \u00d7 the other 4 jobs one each (4 \u00d7 3 \u00d7 2 \u00d7 1).", "reveal": "5 \u00d7 35 \u00d7 24 = 4,200.", "check": "Checked by testing all 78,125 assignments.", "ok": "Structure A done.", "named": {"21000": "Check the last step: after the busy person, how many people are left for the remaining jobs? 4!, not 5!.", "25200": "That picks the 3 jobs in order. Does the busy person care which came first?", "840": "Don't forget who the busy person is.", "175": "The other 4 jobs still need to go to the other 4 people."}, "ph": "number or expression", "special": null, "order": false}, {"q": "Case B (two people do 2 jobs each): how many ways?", "type": "num", "ans": 12600, "nudges": ["First: which 2 people are busy? Is Ana-and-Dee different from Dee-and-Ana?", "And then: the earlier busy person's 2 jobs, then the other's 2.", "And then: the last 3 jobs to the other 3 people, one each."], "hint": "Which pair of people (5C2) \u00d7 first busy person's jobs (7C2) \u00d7 second busy person's jobs (5C2) \u00d7 the last 3 one each (3!).", "reveal": "10 \u00d7 21 \u00d7 10 \u00d7 6 = 12,600.", "check": "Checked by testing all 78,125 assignments.", "ok": "Structure B done.", "named": {"25200": "That picks the two busy people in order: Ana-then-Dee and Dee-then-Ana are the same pair.", "2100": "The last 3 jobs still need to go to the other 3 people.", "4200": "That's case A's answer."}, "ph": "number or expression", "special": null, "order": false}, {"q": "How many ways are there to assign the 7 jobs?", "type": "num", "ans": 16800, "nudges": ["Can an assignment have both structures?", "Disjoint cases: add or multiply?", "Use steps 2 and 3."], "hint": "The two structures are disjoint cases: add them.", "reveal": "4,200 + 12,600 = 16,800.", "check": "Checked: exactly 16,800 of the 78,125 assignments leave nobody out.", "ok": "Cases add.", "named": {"33600": "Check case A: the remaining 4 jobs go to 4 people, so 4! = 24, not 5! = 120.", "63000": "One job each, then spares anywhere, builds the same answer several times.", "78125": "That lets someone get no job.", "4200": "That's only case A.", "12600": "That's only case B.", "29400": "Check case B: were the two busy people picked in order?"}, "ph": "number or expression", "special": null, "order": false}], "story": "<div class=\"story worked\" id=\"story44\" tabindex=\"0\" aria-label=\"Worked answer: Problem 4\" data-plan='[&quot;What could it look like?&quot;, &quot;Each case: first, and then&quot;, &quot;Either, or: add&quot;, &quot;Check a tiny case&quot;]'><div class=\"wbody\"><div class=\"plan-side\" aria-hidden=\"true\"><ol><li data-s=\"1\">What structures might we consider? Make cases where decisions behave differently (like a first digit, which can&#x27;t be 0).<\/li><li data-s=\"2\">Inside each case, break it into steps: first ___, and then ___. Multiply.<\/li><li data-s=\"3\">If the cases are disjoint (non-overlapping), count them separately and add.<\/li><li data-s=\"4\">Check a tiny case you can list.<\/li><\/ol><\/div><div class=\"wmain\"><div class=\"plan-strip\" aria-hidden=\"true\"><span data-s=\"1\">1<\/span><span data-s=\"2\">2<\/span><span data-s=\"3\">3<\/span><span data-s=\"4\">4<\/span><span class=\"stepname\"><\/span><\/div><figure class=\"frame\" data-step=\"1\"><p class=\"ftitle\">1. What could it look like?<\/p><div class=\"pic-wrap\"><div class=\"vstack\"><svg class=\"pic \" viewBox=\"0 0 472 162\" role=\"img\" aria-label=\"assignment\" style=\"max-width:684px\" preserveAspectRatio=\"xMidYMid meet\"><circle cx=\"50.0\" cy=\"22\" r=\"14\" class=\"person\"/><text x=\"50.0\" y=\"27\" class=\"persont\" text-anchor=\"middle\">A<\/text><text x=\"50.0\" y=\"52\" class=\"cap\" text-anchor=\"middle\">Ana<\/text><rect x=\"12\" y=\"58\" width=\"76\" height=\"20\" rx=\"6\" class=\"chip picked\"/><text x=\"50.0\" y=\"73.0\" class=\"chiptxt picked\" text-anchor=\"middle\">job<\/text><rect x=\"12\" y=\"82\" width=\"76\" height=\"20\" rx=\"6\" class=\"chip picked\"/><text x=\"50.0\" y=\"97.0\" class=\"chiptxt picked\" text-anchor=\"middle\">job<\/text><rect x=\"12\" y=\"106\" width=\"76\" height=\"20\" rx=\"6\" class=\"chip picked\"/><text x=\"50.0\" y=\"121.0\" class=\"chiptxt picked\" text-anchor=\"middle\">job<\/text><circle cx=\"142.0\" cy=\"22\" r=\"14\" class=\"person\"/><text x=\"142.0\" y=\"27\" class=\"persont\" text-anchor=\"middle\">B<\/text><text x=\"142.0\" y=\"52\" class=\"cap\" text-anchor=\"middle\">Ben<\/text><rect x=\"104\" y=\"58\" width=\"76\" height=\"20\" rx=\"6\" class=\"chip picked\"/><text x=\"142.0\" y=\"73.0\" class=\"chiptxt picked\" text-anchor=\"middle\">job<\/text><circle cx=\"234.0\" cy=\"22\" r=\"14\" class=\"person\"/><text x=\"234.0\" y=\"27\" class=\"persont\" text-anchor=\"middle\">C<\/text><text x=\"234.0\" y=\"52\" class=\"cap\" text-anchor=\"middle\">Cal<\/text><rect x=\"196\" y=\"58\" width=\"76\" height=\"20\" rx=\"6\" class=\"chip picked\"/><text x=\"234.0\" y=\"73.0\" class=\"chiptxt picked\" text-anchor=\"middle\">job<\/text><circle cx=\"326.0\" cy=\"22\" r=\"14\" class=\"person\"/><text x=\"326.0\" y=\"27\" class=\"persont\" text-anchor=\"middle\">D<\/text><text x=\"326.0\" y=\"52\" class=\"cap\" text-anchor=\"middle\">Dee<\/text><rect x=\"288\" y=\"58\" width=\"76\" height=\"20\" rx=\"6\" class=\"chip picked\"/><text x=\"326.0\" y=\"73.0\" class=\"chiptxt picked\" text-anchor=\"middle\">job<\/text><circle cx=\"418.0\" cy=\"22\" r=\"14\" class=\"person\"/><text x=\"418.0\" y=\"27\" class=\"persont\" text-anchor=\"middle\">E<\/text><text x=\"418.0\" y=\"52\" class=\"cap\" text-anchor=\"middle\">Eli<\/text><rect x=\"380\" y=\"58\" width=\"76\" height=\"20\" rx=\"6\" class=\"chip picked\"/><text x=\"418.0\" y=\"73.0\" class=\"chiptxt picked\" text-anchor=\"middle\">job<\/text><text x=\"236.0\" y=\"156\" class=\"cap\" text-anchor=\"middle\">structure A: 3, 1, 1, 1, 1<\/text><\/svg><svg class=\"pic \" viewBox=\"0 0 120 56\" role=\"img\" aria-label=\"or\" style=\"max-width:174px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"4\" y=\"4\" width=\"112\" height=\"48\" rx=\"10\" class=\"wcard \"/><text x=\"60.0\" y=\"32\" class=\"cardt\" text-anchor=\"middle\">OR<\/text><\/svg><svg class=\"pic \" viewBox=\"0 0 472 138\" role=\"img\" aria-label=\"assignment\" style=\"max-width:684px\" preserveAspectRatio=\"xMidYMid meet\"><circle cx=\"50.0\" cy=\"22\" r=\"14\" class=\"person\"/><text x=\"50.0\" y=\"27\" class=\"persont\" text-anchor=\"middle\">A<\/text><text x=\"50.0\" y=\"52\" class=\"cap\" text-anchor=\"middle\">Ana<\/text><rect x=\"12\" y=\"58\" width=\"76\" height=\"20\" rx=\"6\" class=\"chip picked\"/><text x=\"50.0\" y=\"73.0\" class=\"chiptxt picked\" text-anchor=\"middle\">job<\/text><rect x=\"12\" y=\"82\" width=\"76\" height=\"20\" rx=\"6\" class=\"chip picked\"/><text x=\"50.0\" y=\"97.0\" class=\"chiptxt picked\" text-anchor=\"middle\">job<\/text><circle cx=\"142.0\" cy=\"22\" r=\"14\" class=\"person\"/><text x=\"142.0\" y=\"27\" class=\"persont\" text-anchor=\"middle\">B<\/text><text x=\"142.0\" y=\"52\" class=\"cap\" text-anchor=\"middle\">Ben<\/text><rect x=\"104\" y=\"58\" width=\"76\" height=\"20\" rx=\"6\" class=\"chip picked\"/><text x=\"142.0\" y=\"73.0\" class=\"chiptxt picked\" text-anchor=\"middle\">job<\/text><circle cx=\"234.0\" cy=\"22\" r=\"14\" class=\"person\"/><text x=\"234.0\" y=\"27\" class=\"persont\" text-anchor=\"middle\">C<\/text><text x=\"234.0\" y=\"52\" class=\"cap\" text-anchor=\"middle\">Cal<\/text><rect x=\"196\" y=\"58\" width=\"76\" height=\"20\" rx=\"6\" class=\"chip picked\"/><text x=\"234.0\" y=\"73.0\" class=\"chiptxt picked\" text-anchor=\"middle\">job<\/text><circle cx=\"326.0\" cy=\"22\" r=\"14\" class=\"person\"/><text x=\"326.0\" y=\"27\" class=\"persont\" text-anchor=\"middle\">D<\/text><text x=\"326.0\" y=\"52\" class=\"cap\" text-anchor=\"middle\">Dee<\/text><rect x=\"288\" y=\"58\" width=\"76\" height=\"20\" rx=\"6\" class=\"chip picked\"/><text x=\"326.0\" y=\"73.0\" class=\"chiptxt picked\" text-anchor=\"middle\">job<\/text><rect x=\"288\" y=\"82\" width=\"76\" height=\"20\" rx=\"6\" class=\"chip picked\"/><text x=\"326.0\" y=\"97.0\" class=\"chiptxt picked\" text-anchor=\"middle\">job<\/text><circle cx=\"418.0\" cy=\"22\" r=\"14\" class=\"person\"/><text x=\"418.0\" y=\"27\" class=\"persont\" text-anchor=\"middle\">E<\/text><text x=\"418.0\" y=\"52\" class=\"cap\" text-anchor=\"middle\">Eli<\/text><rect x=\"380\" y=\"58\" width=\"76\" height=\"20\" rx=\"6\" class=\"chip picked\"/><text x=\"418.0\" y=\"73.0\" class=\"chiptxt picked\" text-anchor=\"middle\">job<\/text><text x=\"236.0\" y=\"132\" class=\"cap\" text-anchor=\"middle\">structure B: 2, 2, 1, 1, 1<\/text><\/svg><\/div><\/div><figcaption><p>The teacher&#x27;s question: are there different structures we need to consider? Yes, and he draws them with OR between: one person does 3 jobs, OR two people do 2 jobs each. Either one or the other, never both, so these will be cases that add.<\/p><div class=\"ask\"><b>Ask him:<\/b> Why can&#x27;t anyone do 4 jobs?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"1\"><p class=\"ftitle\">1. What could it look like?<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 420 134\" role=\"img\" aria-label=\"why two structures\" style=\"max-width:609px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"4\" y=\"4\" width=\"412\" height=\"126\" rx=\"10\" class=\"wcard \"/><text x=\"210.0\" y=\"32\" class=\"cardt\" text-anchor=\"middle\">7 jobs, 5 people, everyone at least 1<\/text><text x=\"210.0\" y=\"58\" class=\"cardt\" text-anchor=\"middle\">one job each uses 5 jobs: 2 are left over<\/text><text x=\"210.0\" y=\"84\" class=\"cardt\" text-anchor=\"middle\">both extras to one person \u2192 3, 1, 1, 1, 1<\/text><text x=\"210.0\" y=\"110\" class=\"cardt\" text-anchor=\"middle\">the extras to two people \u2192 2, 2, 1, 1, 1<\/text><\/svg><\/div><figcaption><p>One job each uses 5 of the 7 jobs. The 2 left over either go to the same person (a pile of 3) or to two different people (two piles of 2). These are disjoint cases: count them separately and add.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"1\"><p class=\"ftitle\">1. What could it look like?<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 472 138\" role=\"img\" aria-label=\"assignment\" style=\"max-width:684px\" preserveAspectRatio=\"xMidYMid meet\"><circle cx=\"50.0\" cy=\"22\" r=\"14\" class=\"person\"/><text x=\"50.0\" y=\"27\" class=\"persont\" text-anchor=\"middle\">A<\/text><text x=\"50.0\" y=\"52\" class=\"cap\" text-anchor=\"middle\">Ana<\/text><rect x=\"12\" y=\"58\" width=\"76\" height=\"20\" rx=\"6\" class=\"chip picked\"/><text x=\"50.0\" y=\"73.0\" class=\"chiptxt picked\" text-anchor=\"middle\">C<\/text><rect x=\"12\" y=\"82\" width=\"76\" height=\"20\" rx=\"6\" class=\"chip picked\"/><text x=\"50.0\" y=\"97.0\" class=\"chiptxt picked\" text-anchor=\"middle\">A<\/text><circle cx=\"142.0\" cy=\"22\" r=\"14\" class=\"person\"/><text x=\"142.0\" y=\"27\" class=\"persont\" text-anchor=\"middle\">B<\/text><text x=\"142.0\" y=\"52\" class=\"cap\" text-anchor=\"middle\">Ben<\/text><rect x=\"104\" y=\"58\" width=\"76\" height=\"20\" rx=\"6\" class=\"chip picked\"/><text x=\"142.0\" y=\"73.0\" class=\"chiptxt picked\" text-anchor=\"middle\">B<\/text><circle cx=\"234.0\" cy=\"22\" r=\"14\" class=\"person\"/><text x=\"234.0\" y=\"27\" class=\"persont\" text-anchor=\"middle\">C<\/text><text x=\"234.0\" y=\"52\" class=\"cap\" text-anchor=\"middle\">Cal<\/text><rect x=\"196\" y=\"58\" width=\"76\" height=\"20\" rx=\"6\" class=\"chip picked\"/><text x=\"234.0\" y=\"73.0\" class=\"chiptxt picked\" text-anchor=\"middle\">D<\/text><circle cx=\"326.0\" cy=\"22\" r=\"14\" class=\"person\"/><text x=\"326.0\" y=\"27\" class=\"persont\" text-anchor=\"middle\">D<\/text><text x=\"326.0\" y=\"52\" class=\"cap\" text-anchor=\"middle\">Dee<\/text><rect x=\"288\" y=\"58\" width=\"76\" height=\"20\" rx=\"6\" class=\"chip picked\"/><text x=\"326.0\" y=\"73.0\" class=\"chiptxt picked\" text-anchor=\"middle\">G<\/text><rect x=\"288\" y=\"82\" width=\"76\" height=\"20\" rx=\"6\" class=\"chip picked\"/><text x=\"326.0\" y=\"97.0\" class=\"chiptxt picked\" text-anchor=\"middle\">E<\/text><circle cx=\"418.0\" cy=\"22\" r=\"14\" class=\"person\"/><text x=\"418.0\" y=\"27\" class=\"persont\" text-anchor=\"middle\">E<\/text><text x=\"418.0\" y=\"52\" class=\"cap\" text-anchor=\"middle\">Eli<\/text><rect x=\"380\" y=\"58\" width=\"76\" height=\"20\" rx=\"6\" class=\"chip picked\"/><text x=\"418.0\" y=\"73.0\" class=\"chiptxt picked\" text-anchor=\"middle\">F<\/text><text x=\"236.0\" y=\"132\" class=\"cap\" text-anchor=\"middle\">the teacher&#x27;s picture: a 2, 2, 1, 1, 1 answer<\/text><\/svg><\/div><figcaption><p>The teacher&#x27;s picture, jobs A to G: C and A go to the first person, G and E to the fourth, and B, D, F one each. That&#x27;s structure B.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 419 134\" role=\"img\" aria-label=\"slots\" style=\"max-width:608px\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"47.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">who<\/text><rect x=\"10\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"47.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">5<\/text><text x=\"99.0\" y=\"62\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><text x=\"151.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">which 3<\/text><rect x=\"114\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"151.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">35<\/text><text x=\"203.0\" y=\"62\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><text x=\"255.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">the rest<\/text><rect x=\"218\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"255.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">24<\/text><text x=\"307.0\" y=\"62\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"322\" y=\"28\" width=\"87\" height=\"50\" rx=\"8\" class=\"result\"/><text x=\"365.5\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">4,200<\/text><text x=\"209.5\" y=\"128\" class=\"cap\" text-anchor=\"middle\">7C3 = 35;  4 \u00d7 3 \u00d7 2 \u00d7 1 = 24<\/text><\/svg><\/div><figcaption><p>Case 1, one person has 3 jobs (the teacher&#x27;s words): 5 options for who. 7C3 = 7\u00b76\u00b75/3! = 35 options to assign those 3 jobs. 4! options for assigning the remaining jobs: 4 \u00d7 3 \u00d7 2 \u00d7 1 = 24. 5 \u00d7 35 \u00d7 24 = 4,200.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><div class=\"vstack\"><svg class=\"pic \" viewBox=\"0 0 380 108\" role=\"img\" aria-label=\"watch out\" style=\"max-width:551px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"4\" y=\"4\" width=\"372\" height=\"100\" rx=\"10\" class=\"wcard \"/><text x=\"190.0\" y=\"32\" class=\"cardt\" text-anchor=\"middle\">4 jobs left, 4 people left, one each<\/text><text x=\"190.0\" y=\"58\" class=\"cardt\" text-anchor=\"middle\">4! = 4 \u00d7 3 \u00d7 2 \u00d7 1 = 24<\/text><text x=\"190.0\" y=\"84\" class=\"cardt\" text-anchor=\"middle\">not 5! = 120<\/text><\/svg><svg class=\"pic \" viewBox=\"0 0 345 92\" role=\"img\" aria-label=\"the slip\" style=\"max-width:500px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"174\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"97.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">5 \u00b7 35 \u00b7 120<\/text><text x=\"207.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"231\" y=\"16\" width=\"96\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"279.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">21,000<\/text><line x1=\"6\" y1=\"60\" x2=\"339\" y2=\"12\" class=\"strike banned big\"/><text x=\"172.5\" y=\"86\" class=\"cap\" text-anchor=\"middle\">uses 5! instead of 4!<\/text><\/svg><\/div><\/div><figcaption><p>Watch out: it&#x27;s easy to write 120 here (the class board shows 5 \u00b7 35 \u00b7 120 = 21,000). But after the busy person, only 4 people are left for the 4 remaining jobs, so it&#x27;s 4! = 24, not 5! = 120. Testing all 78,125 assignments confirms 4,200 for this case.<\/p><div class=\"ask\"><b>Ask him:<\/b> Why 4! and not 5! for the remaining jobs?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 536 134\" role=\"img\" aria-label=\"slots\" style=\"max-width:777px\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"47.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">which pair<\/text><rect x=\"10\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"47.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">10<\/text><text x=\"99.0\" y=\"62\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><text x=\"151.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">1st&#x27;s 2<\/text><rect x=\"114\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"151.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">21<\/text><text x=\"203.0\" y=\"62\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><text x=\"255.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">2nd&#x27;s 2<\/text><rect x=\"218\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"255.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">10<\/text><text x=\"307.0\" y=\"62\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><text x=\"359.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">the rest<\/text><rect x=\"322\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"359.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">6<\/text><text x=\"411.0\" y=\"62\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"426\" y=\"28\" width=\"100\" height=\"50\" rx=\"8\" class=\"result\"/><text x=\"476.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">12,600<\/text><text x=\"268.0\" y=\"128\" class=\"cap\" text-anchor=\"middle\">5C2 = 10;  7C2 = 21;  5C2 = 10;  3! = 6<\/text><\/svg><\/div><figcaption><p>Case 2, two people have 2 jobs each (the teacher&#x27;s words): 5C2 options for which two people. The first of them gets 7C2 = 7\u00b76/2 = 21 options, the second gets 5C2 = 5\u00b74/2 = 10 from the jobs left, and 3! for the other 3 people, one job each. 10 \u00d7 21 \u00d7 10 \u00d7 6 = 12,600.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 470 82\" role=\"img\" aria-label=\"why 5C2 for the people\" style=\"max-width:682px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"4\" y=\"4\" width=\"462\" height=\"74\" rx=\"10\" class=\"wcard \"/><text x=\"235.0\" y=\"32\" class=\"cardt\" text-anchor=\"middle\">Ana and Dee  =  Dee and Ana<\/text><text x=\"235.0\" y=\"58\" class=\"cardt\" text-anchor=\"middle\">choose the pair of busy people with 5C2, not 5 \u00d7 4<\/text><\/svg><\/div><figcaption><p>Why 5C2 for the people and not 5 \u00d7 4? Ana-and-Dee is the same pair as Dee-and-Ana. Each of them then gets her own named pile of jobs, so nothing else is counted twice.<\/p><div class=\"ask\"><b>Ask him:<\/b> What answer would 5 \u00d7 4 give for case B, and why is it too big?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>case (cases add +)<\/th><th>inside the case: first, and then (steps multiply \u00d7)<\/th><th>count<\/th><\/tr><\/thead><tbody><tr><td>structure 3, 1, 1, 1, 1<\/td><td>5 \u00d7 35 \u00d7 24<\/td><td>4,200<\/td><\/tr><tr><td>structure 2, 2, 1, 1, 1<\/td><td>10 \u00d7 21 \u00d7 10 \u00d7 6<\/td><td>12,600<\/td><\/tr><tr class=\"hl\"><td>total (add the cases)<\/td><td>4,200 + 12,600<\/td><td>16,800<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>The shape of every Week 5 problem: split it into cases, multiply the steps inside each case (\u201cfirst ___, and then ___\u201d), then add the cases (\u201ceither ___ or ___\u201d). Here: 2 cases, each one a multiplication, added together.<\/p><div class=\"ask\"><b>Ask him:<\/b> Which numbers here are multiplied, and which are added? Why?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 436 92\" role=\"img\" aria-label=\"tempting\" style=\"max-width:632px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"135\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"77.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">7\u00b76\u00b75\u00b74\u00b73<\/text><text x=\"168.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><rect x=\"192\" y=\"16\" width=\"83\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"233.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">5 \u00d7 5<\/text><text x=\"298.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"322\" y=\"16\" width=\"96\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"370.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">63,000<\/text><line x1=\"6\" y1=\"60\" x2=\"430\" y2=\"12\" class=\"strike banned big\"/><text x=\"218.0\" y=\"86\" class=\"cap\" text-anchor=\"middle\">one job each, then the 2 spares anywhere<\/text><\/svg><\/div><figcaption><p>Tempting: give everyone one job (7 \u00d7 6 \u00d7 5 \u00d7 4 \u00d7 3), then the 2 spare jobs to anyone (5 \u00d7 5). That builds the same answer several times, because nothing says which of a person&#x27;s jobs were the &#x27;spares&#x27;.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 397 70\" role=\"img\" aria-label=\"add the cases\" style=\"max-width:576px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"83\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"51.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">4,200<\/text><text x=\"116.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">+<\/text><rect x=\"140\" y=\"16\" width=\"96\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"188.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">12,600<\/text><text x=\"259.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"283\" y=\"16\" width=\"96\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"331.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">16,800<\/text><\/svg><\/div><figcaption><p>The two structures are disjoint cases, so add: 4,200 + 12,600 = 16,800.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"4\"><p class=\"ftitle\">4. Check a tiny case<\/p><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>5 jobs, 3 people<\/th><th>count<\/th><th>by testing all 3\u2075 = 243 ways<\/th><\/tr><\/thead><tbody><tr><td>structure 3, 1, 1<\/td><td>3 \u00d7 5C3 \u00d7 2 = 60<\/td><td>60<\/td><\/tr><tr><td>structure 2, 2, 1<\/td><td>3C2 \u00d7 5C2 \u00d7 3C2 \u00d7 1 = 90<\/td><td>90<\/td><\/tr><tr><td>total<\/td><td>60 + 90<\/td><td>150<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Tiny case with two structures too: 5 jobs for 3 people, each at least one. Testing all 243 ways finds exactly 60 + 90 = 150.<\/p><\/figcaption><\/figure><\/div><\/div><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><input type=\"checkbox\" class=\"showall\"> Show all steps<\/label><\/div><\/div>", "answer": "16,800", "check": "Structures 3,1,1,1,1 (4,200) + 2,2,1,1,1 (12,600) = 16,800; brute force over all 5\u2077 = 78,125 assignments agrees.", "concept": "w5struct", "inclass": null, "above": true, "note": null, "figure": null}, {"id": "w5x1", "label": "Practice 1", "section": "Practice!", "text": "A bag contains four tiles, numbered 1, 2, 3, and 4. Olaf takes two tiles from the bag without replacement and notes that the second tile pulled is an even number. How many ways are there for this to happen?", "steps": [{"q": "How many ways are there for this to happen?", "type": "num", "ans": 6, "nudges": ["Does the first tile change how many even tiles are left for the second?", "Make cases: the first tile is even, or the first tile is odd.", "Or decide the more restricted tile first: the second one."], "hint": "Make cases: the first tile is even, or the first tile is odd. The first tile matters: if it's even, only one even tile is left. Split into cases on the first tile, or choose the second tile first. Inside each case, multiply; then add the cases.", "reveal": "Case 1, first tile even: 2 \u00b7 1 = 2. Case 2, first tile odd: 2 \u00b7 2 = 4. Total 2 + 4 = 6.", "check": "Listing all ordered pairs gives 6.", "ok": "Decisions that behave differently make cases.", "named": {"12": "That's every ordered pair of tiles. The second one must be even.", "8": "Can the second tile be the same tile as the first?", "2": "That's only case 1, where the first tile is even.", "4": "That's only case 2, where the first tile is odd."}, "ph": "number or expression", "special": null, "order": false}], "story": "<div class=\"story worked\" id=\"story45\" tabindex=\"0\" aria-label=\"Worked answer: Practice 1\" data-plan='[&quot;What could it look like?&quot;, &quot;Each case: first, and then&quot;, &quot;Either, or: add&quot;, &quot;Check a tiny case&quot;]'><div class=\"wbody\"><div class=\"plan-side\" aria-hidden=\"true\"><ol><li data-s=\"1\">What structures might we consider? Make cases where decisions behave differently (like a first digit, which can&#x27;t be 0).<\/li><li data-s=\"2\">Inside each case, break it into steps: first ___, and then ___. Multiply.<\/li><li data-s=\"3\">If the cases are disjoint (non-overlapping), count them separately and add.<\/li><li data-s=\"4\">Check a tiny case you can list.<\/li><\/ol><\/div><div class=\"wmain\"><div class=\"plan-strip\" aria-hidden=\"true\"><span data-s=\"1\">1<\/span><span data-s=\"2\">2<\/span><span data-s=\"3\">3<\/span><span data-s=\"4\">4<\/span><span class=\"stepname\"><\/span><\/div><figure class=\"frame\" data-step=\"1\"><p class=\"ftitle\">1. What could it look like?<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 156 72\" role=\"img\" aria-label=\"tiles\" style=\"max-width:226px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p1\"/><text x=\"25.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">1<\/text><rect x=\"44\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p2\"/><text x=\"59.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">2<\/text><rect x=\"78\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p1\"/><text x=\"93.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">3<\/text><rect x=\"112\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p2\"/><text x=\"127.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">4<\/text><text x=\"78.0\" y=\"66\" class=\"cap\" text-anchor=\"middle\">odd tiles blue, even tiles orange<\/text><\/svg><\/div><figcaption><p>Olaf takes a first tile and then a second, and the second must be even. Does the first tile affect the count? Yes: if he takes an even tile first, there&#x27;s one fewer even tile left. Decisions that behave differently make the cases: the first tile is odd, or the first tile is even.<\/p><div class=\"ask\"><b>Ask him:<\/b> Why does the first tile matter for the second?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 312 134\" role=\"img\" aria-label=\"slots\" style=\"max-width:452px\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"47.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">first tile: even<\/text><rect x=\"10\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"47.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">2<\/text><text x=\"99.0\" y=\"62\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><text x=\"151.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">second tile<\/text><rect x=\"114\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"151.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">1<\/text><text x=\"203.0\" y=\"62\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"218\" y=\"28\" width=\"84\" height=\"50\" rx=\"8\" class=\"result\"/><text x=\"260.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">2<\/text><text x=\"156.0\" y=\"128\" class=\"cap\" text-anchor=\"middle\">first 2 or 4; second: the other even tile<\/text><\/svg><\/div><figcaption><p>Case 1, the first tile is even: 2 options (2 or 4). Second tile: 1 option, the other even tile. 2 \u00b7 1 = 2.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 312 134\" role=\"img\" aria-label=\"slots\" style=\"max-width:452px\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"47.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">first tile: odd<\/text><rect x=\"10\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"47.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">2<\/text><text x=\"99.0\" y=\"62\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><text x=\"151.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">second: even<\/text><rect x=\"114\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"151.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">2<\/text><text x=\"203.0\" y=\"62\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"218\" y=\"28\" width=\"84\" height=\"50\" rx=\"8\" class=\"result\"/><text x=\"260.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">4<\/text><text x=\"156.0\" y=\"128\" class=\"cap\" text-anchor=\"middle\">first 1 or 3; second 2 or 4<\/text><\/svg><\/div><figcaption><p>Case 2, the first tile is odd: 2 options (1 or 3). Second tile even: 2 options, because both even tiles are still in the bag. 2 \u00b7 2 = 4.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>case (cases add +)<\/th><th>inside the case: first, and then (steps multiply \u00d7)<\/th><th>count<\/th><\/tr><\/thead><tbody><tr><td>first tile even<\/td><td>2 \u00d7 1<\/td><td>2<\/td><\/tr><tr><td>first tile odd<\/td><td>2 \u00d7 2<\/td><td>4<\/td><\/tr><tr class=\"hl\"><td>total (add the cases)<\/td><td>2 + 4<\/td><td>6<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>The shape of every Week 5 problem: split it into cases, multiply the steps inside each case (\u201cfirst ___, and then ___\u201d), then add the cases (\u201ceither ___ or ___\u201d). Here: 2 cases, each one a multiplication, added together.<\/p><div class=\"ask\"><b>Ask him:<\/b> Which numbers here are multiplied, and which are added? Why?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 215 70\" role=\"img\" aria-label=\"total\" style=\"max-width:312px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"25.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">2<\/text><text x=\"64.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">+<\/text><rect x=\"88\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"103.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">4<\/text><text x=\"142.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"166\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"181.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">6<\/text><\/svg><\/div><figcaption><p>Total: 2 + 4 = 6. The cases are disjoint (the first tile is even or odd, never both), so they add.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 312 134\" role=\"img\" aria-label=\"slots\" style=\"max-width:452px\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"47.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">or: 2nd tile<\/text><rect x=\"10\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"47.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">2<\/text><text x=\"99.0\" y=\"62\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><text x=\"151.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">1st tile<\/text><rect x=\"114\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"151.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">3<\/text><text x=\"203.0\" y=\"62\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"218\" y=\"28\" width=\"84\" height=\"50\" rx=\"8\" class=\"result\"/><text x=\"260.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">6<\/text><text x=\"156.0\" y=\"128\" class=\"cap\" text-anchor=\"middle\">2 options for the second tile, 3 for the first<\/text><\/svg><\/div><figcaption><p>Or (the teacher&#x27;s second way): 2 options for the second tile (2 or 4), and then 3 options for the first tile (any of the other 3). 2 \u00b7 3 = 6, the same answer. Choosing the more restricted tile first makes the counts the same every time, so one multiplication is enough, with no cases.<\/p><div class=\"ask\"><b>Ask him:<\/b> Why does choosing the second tile first mean we don&#x27;t need cases?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"4\"><p class=\"ftitle\">4. Check a tiny case<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 272 72\" role=\"img\" aria-label=\"list\" style=\"max-width:394px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"6\" width=\"80\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"48.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">1 then 2<\/text><rect x=\"94\" y=\"6\" width=\"80\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"134.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">1 then 4<\/text><rect x=\"180\" y=\"6\" width=\"80\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"220.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">2 then 4<\/text><rect x=\"8\" y=\"36\" width=\"80\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"48.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">3 then 2<\/text><rect x=\"94\" y=\"36\" width=\"80\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"134.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">3 then 4<\/text><rect x=\"180\" y=\"36\" width=\"80\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"220.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">4 then 2<\/text><\/svg><\/div><figcaption><p>The whole list is small enough to check: 6 ways, (first tile, then second tile).<\/p><\/figcaption><\/figure><\/div><\/div><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><input type=\"checkbox\" class=\"showall\"> Show all steps<\/label><\/div><\/div>", "answer": "6", "check": "2 + 4 = 6 (first tile even: 2 \u00b7 1; first tile odd: 2 \u00b7 2); also 2 \u00d7 3 = 6 choosing the second tile first. Listed in full.", "concept": "w5rules", "inclass": null, "above": false, "note": null, "figure": null}, {"id": "w5x2", "label": "Practice 2", "section": "Practice!", "text": "How many three-digit numbers contain exactly one 5?", "steps": [{"q": "How many have the 5 in the hundreds place?", "type": "num", "ans": 81, "nudges": ["Which digits can the tens and ones places be?", "Can they be 5?", "First the tens digit, and then the ones digit."], "hint": "Make cases: the 5 is first, or it's somewhere else. The other two digits can be anything but 5.", "reveal": "9 \u00d7 9 = 81.", "check": "Checked by testing 500 to 599.", "ok": "Case A done.", "named": {"100": "The other digits can't be 5.", "18": "First ___, and then ___ multiplies."}, "ph": "number or expression", "special": null, "order": false}, {"q": "How many three-digit numbers contain exactly one 5?", "type": "num", "ans": 225, "nudges": ["Where else can the 5 be?", "If the 5 isn't first, what are the first digit's options?", "Like Problem 1: case A + case B."], "hint": "Case B: the 5 is in one of the other 2 places; the first digit is not 5 and not 0; the remaining digit is not 5. Inside each case, multiply; then add the cases.", "reveal": "81 + 2 \u00d7 8 \u00d7 9 = 81 + 144 = 225.", "check": "Checked by testing all 900 three-digit numbers.", "ok": "Same structure as Problem 1.", "named": {"243": "When the 5 isn't first, the first digit also can't be 0.", "81": "That's only case A.", "144": "That's only case B.", "162": "Case B's first digit can't be 0."}, "ph": "number or expression", "special": null, "order": false}], "story": "<div class=\"story worked\" id=\"story46\" tabindex=\"0\" aria-label=\"Worked answer: Practice 2\" data-plan='[&quot;What could it look like?&quot;, &quot;Each case: first, and then&quot;, &quot;Either, or: add&quot;, &quot;Check a tiny case&quot;]'><div class=\"wbody\"><div class=\"plan-side\" aria-hidden=\"true\"><ol><li data-s=\"1\">What structures might we consider? Make cases where decisions behave differently (like a first digit, which can&#x27;t be 0).<\/li><li data-s=\"2\">Inside each case, break it into steps: first ___, and then ___. Multiply.<\/li><li data-s=\"3\">If the cases are disjoint (non-overlapping), count them separately and add.<\/li><li data-s=\"4\">Check a tiny case you can list.<\/li><\/ol><\/div><div class=\"wmain\"><div class=\"plan-strip\" aria-hidden=\"true\"><span data-s=\"1\">1<\/span><span data-s=\"2\">2<\/span><span data-s=\"3\">3<\/span><span data-s=\"4\">4<\/span><span class=\"stepname\"><\/span><\/div><figure class=\"frame\" data-step=\"1\"><p class=\"ftitle\">1. What could it look like?<\/p><div class=\"pic-wrap\"><div class=\"vstack\"><svg class=\"pic \" viewBox=\"0 0 122 72\" role=\"img\" aria-label=\"tiles\" style=\"max-width:177px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p2\"/><text x=\"25.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">5<\/text><rect x=\"44\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"59.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">_<\/text><rect x=\"78\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"93.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">_<\/text><text x=\"61.0\" y=\"66\" class=\"cap\" text-anchor=\"middle\">case A: the 5 is first<\/text><\/svg><svg class=\"pic \" viewBox=\"0 0 122 112\" role=\"img\" aria-label=\"tiles\" style=\"max-width:177px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"25.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">_<\/text><rect x=\"44\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p2\"/><text x=\"59.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">5<\/text><rect x=\"78\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"93.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">_<\/text><rect x=\"10\" y=\"48\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"25.0\" y=\"69.0\" class=\"tilet\" text-anchor=\"middle\">_<\/text><rect x=\"44\" y=\"48\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"59.0\" y=\"69.0\" class=\"tilet\" text-anchor=\"middle\">_<\/text><rect x=\"78\" y=\"48\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p2\"/><text x=\"93.0\" y=\"69.0\" class=\"tilet\" text-anchor=\"middle\">5<\/text><text x=\"61.0\" y=\"106\" class=\"cap\" text-anchor=\"middle\">case B: the 5 is in another place<\/text><\/svg><\/div><\/div><figcaption><p>The same structure as Problem 1, with a 5 instead of a 2. Only the first digit behaves differently (it can&#x27;t be 0), so two cases: the 5 is first, or it&#x27;s in one of the other 2 places.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 228 70\" role=\"img\" aria-label=\"case A\" style=\"max-width:331px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"25.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">9<\/text><text x=\"64.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><rect x=\"88\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"103.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">9<\/text><text x=\"142.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"166\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"188.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">81<\/text><\/svg><\/div><figcaption><p>Case A, 5 _ _: the tens and ones digits can be anything but 5: 9 \u00d7 9 = 81.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 319 70\" role=\"img\" aria-label=\"case B\" style=\"max-width:463px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"25.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">2<\/text><text x=\"64.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><rect x=\"88\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"103.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">8<\/text><text x=\"142.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><rect x=\"166\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"181.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">9<\/text><text x=\"220.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"244\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"272.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">144<\/text><\/svg><\/div><figcaption><p>Case B: first, which of the 2 other places holds the 5 (2). And then the first digit: not 5 and not 0 (8). And then the remaining digit: not 5 (9). 2 \u00d7 8 \u00d7 9 = 144.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>case (cases add +)<\/th><th>inside the case: first, and then (steps multiply \u00d7)<\/th><th>count<\/th><\/tr><\/thead><tbody><tr><td>the 5 is first<\/td><td>9 \u00d7 9<\/td><td>81<\/td><\/tr><tr><td>the 5 is somewhere else<\/td><td>2 \u00d7 8 \u00d7 9<\/td><td>144<\/td><\/tr><tr class=\"hl\"><td>total (add the cases)<\/td><td>81 + 144<\/td><td>225<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>The shape of every Week 5 problem: split it into cases, multiply the steps inside each case (\u201cfirst ___, and then ___\u201d), then add the cases (\u201ceither ___ or ___\u201d). Here: 2 cases, each one a multiplication, added together.<\/p><div class=\"ask\"><b>Ask him:<\/b> Which numbers here are multiplied, and which are added? Why?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 280 70\" role=\"img\" aria-label=\"add\" style=\"max-width:406px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"32.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">81<\/text><text x=\"77.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">+<\/text><rect x=\"101\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"129.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">144<\/text><text x=\"181.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"205\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"233.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">225<\/text><\/svg><\/div><figcaption><p>Disjoint cases, so add: 81 + 144 = 225.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"4\"><p class=\"ftitle\">4. Check a tiny case<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 314 102\" role=\"img\" aria-label=\"list\" style=\"max-width:455px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"6\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"30.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">15<\/text><rect x=\"58\" y=\"6\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"80.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">25<\/text><rect x=\"108\" y=\"6\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"130.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">35<\/text><rect x=\"158\" y=\"6\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"180.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">45<\/text><rect x=\"208\" y=\"6\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"230.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">50<\/text><rect x=\"258\" y=\"6\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"280.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">51<\/text><rect x=\"8\" y=\"36\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"30.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">52<\/text><rect x=\"58\" y=\"36\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"80.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">53<\/text><rect x=\"108\" y=\"36\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"130.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">54<\/text><rect x=\"158\" y=\"36\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"180.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">56<\/text><rect x=\"208\" y=\"36\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"230.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">57<\/text><rect x=\"258\" y=\"36\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"280.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">58<\/text><rect x=\"8\" y=\"66\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"30.0\" y=\"83\" class=\"lt\" text-anchor=\"middle\">59<\/text><rect x=\"58\" y=\"66\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"80.0\" y=\"83\" class=\"lt\" text-anchor=\"middle\">65<\/text><rect x=\"108\" y=\"66\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"130.0\" y=\"83\" class=\"lt\" text-anchor=\"middle\">75<\/text><rect x=\"158\" y=\"66\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"180.0\" y=\"83\" class=\"lt\" text-anchor=\"middle\">85<\/text><rect x=\"208\" y=\"66\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"230.0\" y=\"83\" class=\"lt\" text-anchor=\"middle\">95<\/text><\/svg><\/div><figcaption><p>Tiny case: two-digit numbers with exactly one 5: 9 with the 5 first, 8 with the 5 second. 17, and the list has 17.<\/p><\/figcaption><\/figure><\/div><\/div><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><input type=\"checkbox\" class=\"showall\"> Show all steps
