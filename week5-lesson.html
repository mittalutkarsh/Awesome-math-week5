<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Week 5 lesson · Week 5: and, or</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Kalam:wght@400;700&display=swap" rel="stylesheet"><style>
/* Math notebook: graph-paper ground, navy fountain-pen ink, a yellow highlighter, a red correction pen.
   Two typefaces: Atkinson Hyperlegible (text, built for young readers) and Kalam (the handwritten voice). */
:root{
  --paper:#FBFCFE; --sheet:#FFFFFF; --rule:#DCE5F2; --rule2:#C9D6EA;
  --ink:#1C2A4A; --pencil:#5E6A82; --faint:#8E99AE;
  --hl:#FFE45E; --hl-soft:#FFF4B8; --red:#C23A2E; --green:#1E7A50; --blue:#2D6BD0;
  --p1:#2D6BD0; --p2:#D98A00; --p3:#7B4CC0; --p4:#1E7A50; --p5:#138A8A; --p6:#C2407A;
  --console:#14223F; --console-ink:#DDE6F6;
  --hand:"Kalam","Comic Neue","Segoe Print",cursive;
  --text:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-sm:5px; --r-md:9px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.55}
body.reading{background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);
  background-size:26px 26px;background-attachment:local}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:3px}
h1,h2,h3{font-family:var(--hand);font-weight:700;line-height:1.15;color:var(--ink);margin:0 0 .4em}
h1{font-size:2.5rem}
h2{font-size:1.9rem}
h3{font-size:1.4rem}
.hl{background:linear-gradient(transparent 55%,var(--hl) 55%,var(--hl) 92%,transparent 92%)}
button{font:inherit;cursor:pointer}
.btn{border:1.5px solid var(--ink);background:var(--sheet);color:var(--ink);border-radius:var(--r-sm);padding:.35em .8em;font-size:.95rem}
.btn:hover{background:var(--hl-soft)}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover{background:#2B3E68}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.warn{border-color:var(--red);color:var(--red)}
kbd{font-family:var(--text);border:1px solid var(--rule2);border-bottom-width:2px;border-radius:4px;padding:0 .3em;font-size:.85em}

/* ---------- equations ---------- */
.eq{font-size:1.35rem;text-align:center;padding:.7em .6em;margin:.2em 0 1em;border-left:4px solid var(--ink);
  background:var(--sheet);display:flex;flex-wrap:wrap;gap:.35em;align-items:center;justify-content:center}
.frac{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 .15em}
.frac>span:first-child{border-bottom:1.5px solid var(--ink);padding:0 .25em}
.frac>span:last-child{padding:0 .25em}
.binom{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;padding:0 .35em;position:relative;line-height:1.1}
.binom::before,.binom::after{content:"";position:absolute;top:0;bottom:0;width:.35em;border:1.5px solid var(--ink)}
.binom::before{left:0;border-right:none;border-radius:.6em 0 0 .6em}
.binom::after{right:0;border-left:none;border-radius:0 .6em .6em 0}
.eqnote{font-size:.85rem;color:var(--pencil)}

/* ---------- SVG pictures ---------- */
svg.pic{width:100%;height:auto;max-height:340px;display:block;margin:0 auto;font-family:var(--text);overflow:visible}
.pic .t,.pic .cap{fill:var(--pencil);font-size:12px}
.pic .vert{writing-mode:tb}
.pic .chip{fill:#fff;stroke:var(--ink);stroke-width:1.3}
.pic .chip.picked{fill:var(--hl);stroke:var(--ink)}
.pic .chip.used{fill:#EEF1F6;stroke:#B6BECC}
.pic .chip.banned{fill:#FBE9E7;stroke:var(--red)}
.pic .chiptxt{fill:var(--ink);font-size:13px;font-weight:700}
.pic .chiptxt.used{fill:#9AA4B5}
.pic .strike{stroke-width:2;stroke-linecap:round}
.pic .strike.used{stroke:#9AA4B5}
.pic .strike.banned{stroke:var(--red)}
.pic .strike.big{stroke-width:3.5;opacity:.85}
.pic .sub{font-size:9px}
.pic .chip.p1,.pic .tile.p1{fill:#E1ECFC;stroke:var(--p1)}
.pic .chip.p2,.pic .tile.p2{fill:#FCEFD6;stroke:var(--p2)}
.pic .chip.p3,.pic .tile.p3{fill:#ECE3F8;stroke:var(--p3)}
.pic .chip.p4,.pic .tile.p4{fill:#DEF1E7;stroke:var(--p4)}
.pic .chip.p5,.pic .tile.p5{fill:#DAF0F0;stroke:var(--p5)}
.pic .chip.p6,.pic .tile.p6{fill:#F8E1EB;stroke:var(--p6)}
.pic .tile{fill:#fff;stroke:var(--ink);stroke-width:1.4}
.pic .tile.real{fill:var(--hl)}
.pic .tile.pl{fill:#F1F3F7;stroke:#9AA4B5}
.pic .tilet{fill:var(--ink);font-size:16px;font-weight:700}
.pic .tilet.sm{font-size:13px}
.pic .slot{fill:#fff;stroke:var(--ink);stroke-width:1.6}
.pic .slot.fixed{fill:#FCEFD6;stroke:var(--p2);stroke-width:2}
.pic .result{fill:var(--hl);stroke:var(--ink);stroke-width:1.6}
.pic .fracline{stroke:var(--ink);stroke-width:1.6}
.pic .numbox{fill:#fff;stroke:var(--ink);stroke-width:1.2}
.pic .slotlab{fill:var(--pencil);font-size:12px}
.pic .slotn,.pic .calcn{fill:var(--ink);font-size:20px;font-weight:700}
.pic .op{fill:var(--ink);font-size:22px;font-weight:700}
.pic .op.big{font-size:30px}
.pic .card{fill:#fff;stroke:var(--rule2)}
.pic .arrow{stroke:var(--ink);stroke-width:2;fill:none}
.pic .ahead{fill:var(--ink)}
.pic .groupbox{fill:var(--hl-soft);stroke:var(--ink);stroke-width:1.6}
.pic .groupt{fill:var(--ink);font-size:17px;font-weight:700}
.pic .pg-cell{fill:#fff;stroke:var(--rule2);stroke-width:1}
.pic .pg-cell.diag{fill:#FBE9E7}
.pic .pg-cell.lower{fill:#EEF1F6}
.pic .pg-cell.hl,.pic .pg-cell.twin-lit{fill:var(--hl);stroke:var(--ink)}
.pic .pg-cell:hover{stroke:var(--ink);stroke-width:2}
.pic .pgt{fill:var(--ink);pointer-events:none}
.pic .pgt.dim{fill:#9AA4B5}
.pic .gridlab{fill:var(--ink);font-size:13px;font-weight:700}
.pic .edge{stroke:var(--pencil);stroke-width:1.3}
.pic .tnode{fill:#fff;stroke:var(--rule2)}
.pic .nodet{fill:var(--ink);font-size:12px;font-weight:700}
.pic .node.root{fill:var(--ink)}
.pic .rowhl{fill:var(--hl-soft)}
.pic .brace{fill:none;stroke:var(--ink);stroke-width:1.6}
.pic .seg{stroke:var(--faint);stroke-width:1.6}
.pic .seg.hl{stroke:var(--blue);stroke-width:4;stroke-linecap:round;opacity:.85}
.pic .seg.hl2{stroke:var(--p2);stroke-width:4;stroke-linecap:round;opacity:.8}
.pic .dot{fill:var(--ink)}
.pic .dotlab{fill:var(--ink);font-size:13px;font-weight:700}
.pic .gl{stroke:var(--rule2);stroke-width:1.3}
.pic .gl.hlv{stroke:var(--blue);stroke-width:3.5}
.pic .gl.hlh{stroke:var(--green);stroke-width:3.5}
.pic .numv{fill:var(--blue);font-weight:700}
.pic .numh{fill:var(--green);font-weight:700}
.pic .shade{fill:var(--hl);opacity:.6}
.pic .path{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.pic .path.leg1{stroke:var(--blue)}
.pic .path.leg2{stroke:var(--p2);stroke-dasharray:7 4}
.pic .bag{fill:#F4F7FC;stroke:var(--ink);stroke-width:1.5}
.pic .oval{fill:none;stroke:var(--hl);stroke-width:8;opacity:.9}
.pic .oval.diff{stroke:#F2C2BC}
.pic .lcell{fill:#fff;stroke:var(--rule2)}
.pic .lcell.hl{fill:var(--hl)}
.pic .lt{fill:var(--ink);font-size:13px;font-weight:700}
.pic .wcard{fill:#fff;stroke:var(--ink);stroke-width:1.4}
.pic .wcard.skip{fill:#F3F5F9;stroke:#B6BECC;stroke-dasharray:5 4}
.pic .cardt{fill:var(--ink);font-size:15px}
.pic .coin.gold{fill:#F7D774;stroke:#9A7400}
.pic .coin.silver{fill:#E3E7EE;stroke:#7D8696}
.pic .coint{fill:var(--ink);font-size:11px;font-weight:700}
.pic .badring{fill:none;stroke:var(--red);stroke-width:2.5}
.pic .state{fill:#fff;stroke:var(--rule2)}
.pic .state.picked{fill:var(--hl-soft);stroke:var(--ink)}
.pic .person{fill:var(--hl-soft);stroke:var(--ink)}
.pic .persont{fill:var(--ink);font-weight:700;font-size:13px}
.hstack{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%}
.hstack>svg.pic{width:100%;flex:1 1 200px;min-width:0}
.vstack{display:flex;flex-direction:column;gap:8px;align-items:center;width:100%}
.vstack>svg.pic{width:100%}
.ptable{border-collapse:collapse;margin:0 auto;font-size:.92rem;background:#fff}
.ptable th,.ptable td{border:1px solid var(--rule2);padding:.25em .6em;text-align:center}
.ptable th{background:#EEF3FA;font-weight:700}
.ptable tr.hl td{background:var(--hl-soft);font-weight:700}

/* ---------- story component ---------- */
.story{container-type:inline-size;background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--r-md);padding:.8rem;margin:.6rem 0 1.2rem}
.story:focus-visible{outline:3px solid var(--blue)}
.story .frame{display:none;margin:0}
.story .frame.on{display:block}
.story.all .frame{display:block;border-bottom:1px dashed var(--rule2);padding-bottom:.8rem;margin-bottom:.8rem}
.frame .pic-wrap{min-height:80px;display:flex;align-items:center;justify-content:center;overflow-x:auto}
.frame figcaption{margin-top:.5rem}
.frame figcaption p{margin:.2em 0}
.frame .ftitle{font-family:var(--hand);font-size:1.15rem;margin:0 0 .3rem}
.frame.skip .ftitle{text-decoration:line-through;color:var(--faint)}
.frame.skip figcaption p{color:var(--pencil)}
.ask{margin-top:.5rem;padding:.4rem .7rem;border-left:4px solid var(--hl);background:#FFFBE6;font-size:.95rem}
.ask b{font-family:var(--hand)}
.story-ctl{display:flex;align-items:center;gap:.6rem;margin-top:.6rem;flex-wrap:wrap}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots button{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--ink);background:#fff;padding:0}
.dots button.on{background:var(--ink)}
.dots button.seen{background:var(--rule2)}
.story-ctl label{font-size:.9rem;color:var(--pencil);margin-left:auto}
.story.all .story-ctl .nav{visibility:hidden}

/* plan-guided: flowchart beside picture on wide containers, step strip on narrow */
.wbody{display:block}
.plan-side{display:none}
.plan-strip{display:flex;gap:4px;align-items:center;margin-bottom:.6rem;flex-wrap:wrap}
.plan-strip span{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--rule2);display:inline-flex;align-items:center;justify-content:center;
  font-weight:700;font-size:.85rem;color:var(--pencil)}
.plan-strip span.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.plan-strip span.skipd{text-decoration:line-through}
.plan-strip .stepname{font-family:var(--hand);font-size:1.1rem;color:var(--ink);margin-left:.4rem;width:auto;height:auto;border:none;justify-content:flex-start}
@container (min-width:680px){
  .wbody{display:grid;grid-template-columns:215px 1fr;gap:1rem}
  .plan-side{display:block}
  .plan-strip{display:none}
}
.plan-side ol{list-style:none;margin:0;padding:0;counter-reset:pl}
.plan-side li{counter-increment:pl;padding:.35rem .5rem .35rem 2.1rem;position:relative;font-size:.9rem;color:var(--pencil);border-radius:6px;margin-bottom:3px}
.plan-side li::before{content:counter(pl);position:absolute;left:.4rem;top:.3rem;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--rule2);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem}
.plan-side li.on{background:var(--hl);color:var(--ink);font-weight:700}
.plan-side li.on::before{background:var(--ink);color:#fff;border-color:var(--ink)}
.plan-side li.skipd{text-decoration:line-through}
.plan-side li+li::after{content:"";position:absolute;left:1.05rem;top:-4px;height:5px;border-left:1.5px solid var(--rule2)}

/* ---------- reading pages ---------- */
.page{max-width:1180px;margin:0 auto;padding:1.4rem 1.2rem 4rem;display:grid;grid-template-columns:230px minmax(0,1fr);gap:2rem}
.toc{position:sticky;top:1rem;align-self:start;max-height:calc(100vh - 2rem);overflow:auto;font-size:.92rem;background:var(--sheet);
  border:1.5px solid var(--ink);border-radius:var(--r-md);padding:.8rem}
.toc a{display:block;text-decoration:none;color:var(--ink);padding:.15rem .3rem;border-radius:4px}
.toc a:hover{background:var(--hl-soft)}
.toc .sub{padding-left:1rem;font-size:.86rem;color:var(--pencil)}
main.reading-main{min-width:0}
.sheet{background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--r-md);padding:1.3rem 1.4rem;margin-bottom:1.6rem}
.sheet>p,.sheet li{max-width:72ch}
.idea{font-size:1.1rem;font-weight:700}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin:.6rem 0}
.chips a{border:1.5px solid var(--ink);border-radius:999px;padding:.1rem .7rem;text-decoration:none;color:var(--ink);font-size:.9rem;background:#fff}
.chips a:hover{background:var(--hl)}
.prop{border:2px solid #8F84E0;background:#EEEBFC;border-radius:var(--r-md);padding:.6rem .9rem;margin:.4rem 0 1rem}
.prop p{margin:.2rem 0}
.prop-h{font-family:var(--hand);font-weight:700;color:#4B3FA8}
.fromclass{border-left:4px solid var(--blue);background:#F1F6FE;padding:.6rem .8rem;margin:.8rem 0;font-size:.95rem}
.fromclass b{font-family:var(--hand)}
.traps{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem;padding:0;list-style:none}
.traps li{background:#fff;border:1.5px solid var(--ink);border-radius:var(--r-md);padding:.7rem .9rem;max-width:none}
.traps .wrong{color:var(--red);font-weight:700;text-decoration:line-through;text-decoration-thickness:2px}
.cheat{width:100%;border-collapse:collapse}
.cheat td,.cheat th{border:1px solid var(--rule2);padding:.4rem .6rem;vertical-align:top;text-align:left}
.cheat th{background:#EEF3FA}
dl.gloss dt{font-weight:700;margin-top:.6rem}
dl.gloss dd{margin:0 0 0 1rem;max-width:70ch}
.site-head{display:flex;align-items:baseline;gap:1.2rem;flex-wrap:wrap;padding:1rem 1.2rem 0;max-width:1180px;margin:0 auto}
.site-head nav a{margin-right:1rem}
.lede{font-size:1.15rem;max-width:62ch}

/* ---------- workbench ---------- */
body.bench{height:100vh;overflow:hidden;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:.6rem;padding:.45rem .8rem;border-bottom:1.5px solid var(--ink);background:var(--sheet);flex-wrap:wrap}
.topbar .brand{font-family:var(--hand);font-weight:700;font-size:1.25rem;margin-right:.4rem}
.topbar select{font:inherit;font-size:.92rem;padding:.25rem;border:1.5px solid var(--ink);border-radius:var(--r-sm);max-width:280px}
.topbar .meta{font-size:.9rem;color:var(--pencil);display:flex;gap:1rem;align-items:center}
.topbar .links{margin-left:auto;display:flex;gap:.8rem;font-size:.92rem}
.benchgrid{flex:1;min-height:0;display:grid;grid-template-columns:200px minmax(0,1fr) minmax(360px,430px)}
.rail{border-right:1.5px solid var(--ink);overflow:auto;padding:.5rem;background:var(--paper)}
.rail h4{font-family:var(--hand);font-size:1.05rem;margin:.6rem 0 .2rem}
.rail button{display:flex;align-items:center;gap:.5rem;width:100%;text-align:left;border:none;background:none;padding:.25rem .4rem;border-radius:5px;font-size:.92rem;color:var(--ink)}
.rail button:hover{background:var(--hl-soft)}
.rail button.cur{background:var(--hl);font-weight:700}
.sdot{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--pencil);flex:none}
.sdot.prog{background:linear-gradient(90deg,var(--blue) 50%,#fff 50%);border-color:var(--blue)}
.sdot.closed{background:var(--green);border-color:var(--green)}
.middle{overflow:auto;padding:0 1rem 1rem;background:var(--paper)}
.tabs{display:flex;gap:.2rem;position:sticky;top:0;background:var(--paper);padding-top:.5rem;z-index:2;border-bottom:1.5px solid var(--ink)}
.tabs button{border:1.5px solid var(--ink);border-bottom:none;border-radius:7px 7px 0 0;background:#EEF3FA;padding:.3rem .9rem;margin-bottom:-1.5px;font-size:.95rem}
.tabs button[aria-selected="true"]{background:var(--sheet);font-weight:700}
.tabpanel{padding-top:.8rem}
.ptext{font-size:1.08rem;background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--r-md);padding:.8rem 1rem}
.pfig{max-width:380px;margin:.8rem auto 0}
.pfig svg.pic{max-height:300px}
.pfig .pic .gl{stroke:var(--ink);stroke-width:1.2}
.pnote{font-size:.9rem;color:var(--pencil);margin:.5rem 0}
.inclass{display:inline-block;font-size:.85rem;border:1px solid var(--blue);color:var(--blue);border-radius:999px;padding:0 .6rem;margin-right:.4rem}
.above{display:inline-block;font-size:.85rem;border:1px solid var(--p3);color:var(--p3);border-radius:999px;padding:0 .6rem}
.verified{margin-top:1rem;border:2px solid var(--green);border-radius:var(--r-md);background:#F2FAF5;padding:.8rem 1rem}
.verified h3{color:var(--green)}
.right{border-left:1.5px solid var(--ink);display:flex;flex-direction:column;min-height:0;background:var(--sheet)}
.rscroll{overflow:auto;padding:.7rem .8rem;flex:1;min-height:0}
.pills{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:.5rem}
.pills button{border:1.5px solid var(--ink);border-radius:999px;background:#fff;padding:.05rem .65rem;font-size:.88rem}
.pills button.cur{outline:3px solid var(--hl);outline-offset:1px;font-weight:700}
.pills button.ok{background:#DDF1E5;border-color:var(--green)}
.pills button.handed{background:#FBE9E7;border-color:var(--red)}
.pills button.tried{background:#EEF3FA}
.stepq{font-weight:700;margin:.2rem 0 .5rem}
.editor{display:flex;border:1.5px solid var(--ink);border-radius:var(--r-sm);height:140px;background:#fff;
  background-image:linear-gradient(transparent 23px,var(--rule) 23px);background-size:100% 24px;background-position:0 6px}
.gutter{width:2.2rem;text-align:right;padding:6px .35rem 0 0;color:var(--faint);font-size:.85rem;line-height:24px;overflow:hidden;border-right:1px solid var(--rule2);user-select:none}
.editor textarea{flex:1;border:none;resize:none;padding:6px .5rem 0;font:inherit;font-size:.95rem;line-height:24px;background:transparent;color:var(--ink);font-family:var(--hand)}
.editor textarea:focus{outline:none}
.editor:focus-within{outline:3px solid var(--blue);outline-offset:1px}
.ansrow{display:flex;gap:.4rem;margin:.6rem 0}
.ansrow input{flex:1;font:inherit;padding:.35rem .5rem;border:1.5px solid var(--ink);border-radius:var(--r-sm);min-width:0}
.btnrow{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.5rem}
.console{background:var(--console);color:var(--console-ink);font-size:.86rem;padding:.6rem .7rem;height:170px;overflow:auto;border-top:1.5px solid var(--ink);flex:none}
.console div{margin-bottom:.3rem;line-height:1.4}
.console .ok{color:#8BE0AC}
.console .bad{color:#FFB3A8}
.console .info{color:#A9C3F0}
.console .hand{color:#FFE45E}
.console .ts{color:#6F84AD;margin-right:.4rem}
.dialog-back{position:fixed;inset:0;background:rgba(28,42,74,.35);display:none;align-items:center;justify-content:center;z-index:50}
.dialog-back.open{display:flex}
.dialog{background:var(--sheet);border:2px solid var(--ink);border-radius:var(--r-md);max-width:460px;padding:1rem 1.2rem;margin:1rem}
.dialog h3{margin-top:0}
.confirm-note{font-size:.88rem;color:var(--red);margin:.3rem 0}
.rules{background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--r-md);padding:.8rem 1rem}
.rules ol{padding-left:1.3rem;margin:.3rem 0}
.mysteps .ms{background:var(--sheet);border:1px solid var(--rule2);border-radius:var(--r-sm);padding:.5rem .7rem;margin-bottom:.5rem}
.mysteps pre{white-space:pre-wrap;font-family:var(--hand);margin:.3rem 0;font-size:.95rem}
.railtoggle{display:none}

/* ---------- pen ---------- */
.pen-canvas{position:fixed;inset:0;pointer-events:none;z-index:40}
.pen-canvas.active{pointer-events:auto;cursor:crosshair}
.pen-canvas.active.touchpass{touch-action:pan-x pan-y pinch-zoom}
.pen-canvas.active.swallow{touch-action:none}
.pen-bar{position:fixed;right:12px;bottom:12px;z-index:45;background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--r-md);
  padding:.35rem;display:flex;gap:.25rem;align-items:center;flex-wrap:wrap;max-width:calc(100vw - 24px);box-shadow:0 2px 0 var(--ink)}

<figure class=\"frame\" data-step=\"1\"><p class=\"ftitle\">1. What could it look like?<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 122 152\" role=\"img\" aria-label=\"tiles\" style=\"max-width:177px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p2\"/><text x=\"25.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">2<\/text><rect x=\"44\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"59.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">_<\/text><rect x=\"78\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"93.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">_<\/text><rect x=\"10\" y=\"48\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"25.0\" y=\"69.0\" class=\"tilet\" text-anchor=\"middle\">_<\/text><rect x=\"44\" y=\"48\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p2\"/><text x=\"59.0\" y=\"69.0\" class=\"tilet\" text-anchor=\"middle\">2<\/text><rect x=\"78\" y=\"48\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"93.0\" y=\"69.0\" class=\"tilet\" text-anchor=\"middle\">_<\/text><rect x=\"10\" y=\"88\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"25.0\" y=\"109.0\" class=\"tilet\" text-anchor=\"middle\">_<\/text><rect x=\"44\" y=\"88\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"59.0\" y=\"109.0\" class=\"tilet\" text-anchor=\"middle\">_<\/text><rect x=\"78\" y=\"88\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p2\"/><text x=\"93.0\" y=\"109.0\" class=\"tilet\" text-anchor=\"middle\">2<\/text><text x=\"61.0\" y=\"146\" class=\"cap\" text-anchor=\"middle\">the 2 is in the hundreds, tens or ones place<\/text><\/svg><\/div><figcaption><p>What structures might we consider? (What could the numbers look like?) The one 2 can sit in the hundreds place, the tens place or the ones place: three cases.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"1\"><p class=\"ftitle\">1. What could it look like?<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 384 108\" role=\"img\" aria-label=\"the rule\" style=\"max-width:557px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"4\" y=\"4\" width=\"376\" height=\"100\" rx=\"10\" class=\"wcard \"/><text x=\"192.0\" y=\"32\" class=\"cardt\" text-anchor=\"middle\">\u201cexactly one 2\u201d:<\/text><text x=\"192.0\" y=\"58\" class=\"cardt\" text-anchor=\"middle\">the other two digits are not 2<\/text><text x=\"192.0\" y=\"84\" class=\"cardt\" text-anchor=\"middle\">a number can&#x27;t be in two cases: disjoint<\/text><\/svg><\/div><figcaption><p>Exactly one 2 means the other two digits are not 2. And a number has its single 2 in only one place, so the cases are disjoint (non-overlapping). That&#x27;s what lets us count them separately and add.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><div class=\"vstack\"><svg class=\"pic \" viewBox=\"0 0 302 134\" role=\"img\" aria-label=\"slots\" style=\"max-width:438px\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"47.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">hundreds<\/text><rect x=\"10\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot fixed\"/><text x=\"47.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">2<\/text><text x=\"99.0\" y=\"62\" class=\"op\" text-anchor=\"middle\"><\/text><text x=\"151.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">tens<\/text><rect x=\"114\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"151.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">9<\/text><text x=\"203.0\" y=\"62\" class=\"op\" text-anchor=\"middle\"><\/text><text x=\"255.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">ones<\/text><rect x=\"218\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"255.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">9<\/text><text x=\"151.0\" y=\"128\" class=\"cap\" text-anchor=\"middle\">the 2 is fixed; 9 options (not 2) for tens and ones<\/text><\/svg><svg class=\"pic \" viewBox=\"0 0 228 70\" role=\"img\" aria-label=\"multiply\" style=\"max-width:331px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"25.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">9<\/text><text x=\"64.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><rect x=\"88\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"103.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">9<\/text><text x=\"142.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"166\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"188.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">81<\/text><\/svg><\/div><\/div><figcaption><p>Case 1, the 2 in the hundreds place: 2 _ _. First the tens digit, 9 options (anything but 2), and then the ones digit, 9 options: 9 \u00d7 9 = 81.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><div class=\"vstack\"><svg class=\"pic \" viewBox=\"0 0 302 134\" role=\"img\" aria-label=\"slots\" style=\"max-width:438px\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"47.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">hundreds<\/text><rect x=\"10\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"47.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">8<\/text><text x=\"99.0\" y=\"62\" class=\"op\" text-anchor=\"middle\"><\/text><text x=\"151.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">tens<\/text><rect x=\"114\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot fixed\"/><text x=\"151.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">2<\/text><text x=\"203.0\" y=\"62\" class=\"op\" text-anchor=\"middle\"><\/text><text x=\"255.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">ones<\/text><rect x=\"218\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"255.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">9<\/text><text x=\"151.0\" y=\"128\" class=\"cap\" text-anchor=\"middle\">hundreds: not 2 and not 0, so 8 options<\/text><\/svg><svg class=\"pic \" viewBox=\"0 0 228 70\" role=\"img\" aria-label=\"multiply\" style=\"max-width:331px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"25.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">8<\/text><text x=\"64.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><rect x=\"88\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"103.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">9<\/text><text x=\"142.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"166\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"188.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">72<\/text><\/svg><\/div><\/div><figcaption><p>Case 2, the 2 in the tens place: _ 2 _. The hundreds digit can&#x27;t be 2, and it can&#x27;t be 0 either (then it wouldn&#x27;t be a three-digit number): 8 options. The ones digit: 9. So 8 \u00d7 9 = 72.<\/p><div class=\"ask\"><b>Ask him:<\/b> Why does the hundreds place have only 8 options here, but the tens place had 9 in case 1?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><div class=\"vstack\"><svg class=\"pic \" viewBox=\"0 0 302 134\" role=\"img\" aria-label=\"slots\" style=\"max-width:438px\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"47.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">hundreds<\/text><rect x=\"10\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"47.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">8<\/text><text x=\"99.0\" y=\"62\" class=\"op\" text-anchor=\"middle\"><\/text><text x=\"151.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">tens<\/text><rect x=\"114\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"151.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">9<\/text><text x=\"203.0\" y=\"62\" class=\"op\" text-anchor=\"middle\"><\/text><text x=\"255.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">ones<\/text><rect x=\"218\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot fixed\"/><text x=\"255.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">2<\/text><text x=\"151.0\" y=\"128\" class=\"cap\" text-anchor=\"middle\">hundreds: 8 options, tens: 9 options<\/text><\/svg><svg class=\"pic \" viewBox=\"0 0 228 70\" role=\"img\" aria-label=\"multiply\" style=\"max-width:331px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"25.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">8<\/text><text x=\"64.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><rect x=\"88\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"103.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">9<\/text><text x=\"142.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"166\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"188.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">72<\/text><\/svg><\/div><\/div><figcaption><p>Case 3, the 2 in the ones place: _ _ 2. Hundreds: 8 options (not 2, not 0). Tens: 9 options (not 2). 8 \u00d7 9 = 72.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>case (cases add +)<\/th><th>inside the case: first, and then (steps multiply \u00d7)<\/th><th>count<\/th><\/tr><\/thead><tbody><tr><td>2 in the hundreds place: 2 _ _<\/td><td>9 \u00d7 9<\/td><td>81<\/td><\/tr><tr><td>2 in the tens place: _ 2 _<\/td><td>8 \u00d7 9<\/td><td>72<\/td><\/tr><tr><td>2 in the ones place: _ _ 2<\/td><td>8 \u00d7 9<\/td><td>72<\/td><\/tr><tr class=\"hl\"><td>total (add the cases)<\/td><td>81 + 72 + 72<\/td><td>225<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>The shape of every Week 5 problem: split it into cases, multiply the steps inside each case (\u201cfirst ___, and then ___\u201d), then add the cases (\u201ceither ___ or ___\u201d). Here: 3 cases, each one a multiplication, added together.<\/p><div class=\"ask\"><b>Ask him:<\/b> Which numbers here are multiplied, and which are added? Why?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 228 92\" role=\"img\" aria-label=\"tempting\" style=\"max-width:331px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"96\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"58.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">81 \u00d7 3<\/text><text x=\"129.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"153\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"181.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">243<\/text><line x1=\"6\" y1=\"60\" x2=\"222\" y2=\"12\" class=\"strike banned big\"/><text x=\"114.0\" y=\"86\" class=\"cap\" text-anchor=\"middle\">the cases aren&#x27;t all the same size<\/text><\/svg><\/div><figcaption><p>Tempting: 81 \u00d7 3. But only case 1 has 81; when the 2 isn&#x27;t in front, the hundreds digit also can&#x27;t be 0.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 358 70\" role=\"img\" aria-label=\"add the cases\" style=\"max-width:519px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"32.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">81<\/text><text x=\"77.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">+<\/text><rect x=\"101\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"123.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">72<\/text><text x=\"168.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">+<\/text><rect x=\"192\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"214.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">72<\/text><text x=\"259.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"283\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"311.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">225<\/text><\/svg><\/div><figcaption><p>Either case 1, or case 2, or case 3, never two at once, so add: 81 + 72 + 72 = 225.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"1\"><p class=\"ftitle\">1. What could it look like?<\/p><div class=\"pic-wrap\"><div class=\"vstack\"><svg class=\"pic \" viewBox=\"0 0 122 72\" role=\"img\" aria-label=\"tiles\" style=\"max-width:177px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p2\"/><text x=\"25.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">2<\/text><rect x=\"44\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"59.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">_<\/text><rect x=\"78\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"93.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">_<\/text><text x=\"61.0\" y=\"66\" class=\"cap\" text-anchor=\"middle\">case A: the 2 is first<\/text><\/svg><svg class=\"pic \" viewBox=\"0 0 122 112\" role=\"img\" aria-label=\"tiles\" style=\"max-width:177px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"25.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">_<\/text><rect x=\"44\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p2\"/><text x=\"59.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">2<\/text><rect x=\"78\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"93.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">_<\/text><rect x=\"10\" y=\"48\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"25.0\" y=\"69.0\" class=\"tilet\" text-anchor=\"middle\">_<\/text><rect x=\"44\" y=\"48\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"59.0\" y=\"69.0\" class=\"tilet\" text-anchor=\"middle\">_<\/text><rect x=\"78\" y=\"48\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p2\"/><text x=\"93.0\" y=\"69.0\" class=\"tilet\" text-anchor=\"middle\">2<\/text><text x=\"61.0\" y=\"106\" class=\"cap\" text-anchor=\"middle\">case B: the 2 is in another place<\/text><\/svg><\/div><\/div><figcaption><p>Look again with the rule \u201cmake cases where decisions behave differently\u201d. Cases 2 and 3 behave the same: the first digit has 8 options and the other digit 9. Only the first digit is special, because it can&#x27;t be 0. So two cases are enough.<\/p><div class=\"ask\"><b>Ask him:<\/b> Why do the tens place and the ones place behave the same?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><div class=\"vstack\"><svg class=\"pic \" viewBox=\"0 0 319 70\" role=\"img\" aria-label=\"case A\" style=\"max-width:463px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"109\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"64.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">case A:<\/text><rect x=\"127\" y=\"16\" width=\"83\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"168.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">9 \u00d7 9<\/text><text x=\"233.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"257\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"279.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">81<\/text><\/svg><svg class=\"pic \" viewBox=\"0 0 384 70\" role=\"img\" aria-label=\"case B\" style=\"max-width:557px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"109\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"64.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">case B:<\/text><rect x=\"127\" y=\"16\" width=\"135\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"194.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">2 \u00d7 8 \u00d7 9<\/text><text x=\"285.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"309\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"337.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">144<\/text><\/svg><svg class=\"pic \" viewBox=\"0 0 280 70\" role=\"img\" aria-label=\"same answer\" style=\"max-width:406px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"32.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">81<\/text><text x=\"77.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">+<\/text><rect x=\"101\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"129.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">144<\/text><text x=\"181.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"205\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"233.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">225<\/text><\/svg><\/div><\/div><figcaption><p>Case A: 9 \u00d7 9 = 81. Case B: first choose which of the 2 other places holds the 2, and then the first digit (8) and the remaining digit (9): 2 \u00d7 8 \u00d7 9 = 144. 81 + 144 = 225, the same answer with fewer cases.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"4\"><p class=\"ftitle\">4. Check a tiny case<\/p><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>digits<\/th><th>count by testing<\/th><th>two-case formula<\/th><th>formula gives<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>1<\/td><td>1<\/td><td>1<\/td><\/tr><tr><td>2<\/td><td>17<\/td><td>9 + 1\u00b78<\/td><td>17<\/td><\/tr><tr><td>3<\/td><td>225<\/td><td>9\u00b2 + 2\u00b78\u00b79\u00b9<\/td><td>225<\/td><\/tr><tr><td>4<\/td><td>2,673<\/td><td>9\u00b3 + 3\u00b78\u00b79\u00b2<\/td><td>2,673<\/td><\/tr><tr><td>5<\/td><td>29,889<\/td><td>9\u2074 + 4\u00b78\u00b79\u00b3<\/td><td>29,889<\/td><\/tr><tr><td>6<\/td><td>321,489<\/td><td>9\u2075 + 5\u00b78\u00b79\u2074<\/td><td>321,489<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Two cases work for any length: first digit is the 2 (9 options for every other place), or the 2 is in one of the other places (which place, then 8 for the first digit, then 9 for the rest). Testing every number with 1 to 6 digits matches. So a 100-digit number with exactly one 2 has 9\u2079\u2079 + 99 \u00d7 8 \u00d7 9\u2079\u2078 possibilities, without making 100 cases.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"4\"><p class=\"ftitle\">4. Check a tiny case<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 314 124\" role=\"img\" aria-label=\"list\" style=\"max-width:455px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"6\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"30.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">12<\/text><rect x=\"58\" y=\"6\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"80.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">20<\/text><rect x=\"108\" y=\"6\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"130.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">21<\/text><rect x=\"158\" y=\"6\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"180.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">23<\/text><rect x=\"208\" y=\"6\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"230.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">24<\/text><rect x=\"258\" y=\"6\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"280.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">25<\/text><rect x=\"8\" y=\"36\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"30.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">26<\/text><rect x=\"58\" y=\"36\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"80.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">27<\/text><rect x=\"108\" y=\"36\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"130.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">28<\/text><rect x=\"158\" y=\"36\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"180.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">29<\/text><rect x=\"208\" y=\"36\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"230.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">32<\/text><rect x=\"258\" y=\"36\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"280.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">42<\/text><rect x=\"8\" y=\"66\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"30.0\" y=\"83\" class=\"lt\" text-anchor=\"middle\">52<\/text><rect x=\"58\" y=\"66\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"80.0\" y=\"83\" class=\"lt\" text-anchor=\"middle\">62<\/text><rect x=\"108\" y=\"66\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"130.0\" y=\"83\" class=\"lt\" text-anchor=\"middle\">72<\/text><rect x=\"158\" y=\"66\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"180.0\" y=\"83\" class=\"lt\" text-anchor=\"middle\">82<\/text><rect x=\"208\" y=\"66\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"230.0\" y=\"83\" class=\"lt\" text-anchor=\"middle\">92<\/text><text x=\"157.0\" y=\"118\" class=\"cap\" text-anchor=\"middle\">2 in front: 9;  2 at the end: 8;  total 17<\/text><\/svg><\/div><figcaption><p>Tiny case: two-digit numbers with exactly one 2. 2 in the tens place: 9 (not 22). 2 in the ones place: 8 (the tens digit can&#x27;t be 0 or 2). 9 + 8 = 17, and the list has 17.<\/p><\/figcaption><\/figure><\/div><\/div><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><input type=\"checkbox\" class=\"showall\"> Show all steps<\/label><\/div><\/div>", "answer": "225", "check": "81 + 72 + 72 = 225; checked by testing all 900 three-digit numbers.", "concept": "w5both", "inclass": null, "above": false, "note": null, "figure": null}, {"id": "w5l2", "label": "Problem 2", "section": "Lesson problems", "text": "How many 100-digit numbers contain exactly one even digit?", "steps": [{"q": "Case 1: the first digit is the even one. How many such 100-digit numbers? (A power like 7 \u00d7 3^12 is fine.)", "type": "num", "ans": "6310887241768094443293828522262289837385651480872184038162231445312500", "nudges": ["Can a 100-digit number start with 0?", "First the first digit, and then each of the other 99 digits. What must they be?", "How many odd digits are there? How many digits must be odd here?"], "hint": "Make cases: the even digit is first, or it's somewhere else. First digit: an even digit that isn't 0. Each of the other 99 digits: odd. Steps multiply.", "reveal": "4 \u00d7 5\u2079\u2079.", "check": "Checked: the same formula matches every 1- to 6-digit number.", "ok": "The first digit behaves differently: no 0.", "named": {"7888609052210118054117285652827862296732064351090230047702789306640625": "That gives the first digit 5 choices. Can a number start with 0?", "31554436208840472216469142611311449186928257404360920190811157226562500": "Count the other digits again: 100 \u2212 1.", "1577721810442023610823457130565572459346412870218046009540557861328125": "Don't forget the first digit's choices.", "1980": "First, and then, multiplies at every one of the 99 places: 5 \u00d7 5 \u00d7 \u2026 \u00d7 5."}, "ph": "number or expression", "special": null, "order": false}, {"q": "Case 2: the even digit is not the first digit. How many places could it be in?", "type": "num", "ans": 99, "nudges": ["Which places are left if the first digit is odd?", "How many digits does the number have?", "All but the first."], "hint": "Every place except the first.", "reveal": "99.", "check": "100 \u2212 1 = 99.", "ok": "One case per place would be 99 cases: count them together instead.", "named": {"100": "In this case the first digit is odd.", "98": "Count again: every place except the first."}, "ph": "number or expression", "special": null, "order": false}, {"q": "Case 2: how many 100-digit numbers have their one even digit somewhere after the first place?", "type": "num", "ans": "780972296168801687357611279629958367376474370757932774722576141357421875", "nudges": ["First choose the place, and then the even digit, and then all the odd digits.", "Can the even digit be 0 here?", "How many odd digits are there in this case, counting the first digit?"], "hint": "Place (99) \u00d7 even digit (5, 0 allowed) \u00d7 the 99 odd digits (5 each).", "reveal": "99 \u00d7 5 \u00d7 5\u2079\u2079 = 99 \u00d7 5\u00b9\u2070\u2070.", "check": "Checked: the same formula matches every 1- to 6-digit number.", "ok": "0 is fine when it isn't first.", "named": {"624777836935041349886089023703966693901179496606346219778060913085937500": "The even digit isn't first here, so 0 is allowed: 5 choices.", "156194459233760337471522255925991673475294874151586554944515228271484375": "Don't forget the even digit's 5 choices.", "7888609052210118054117285652827862296732064351090230047702789306640625": "Which place is even? 99 choices.", "3904861480844008436788056398149791836882371853789663873612880706787109375": "Count the odd digits: the first digit plus 98 others."}, "ph": "number or expression", "special": null, "order": false}, {"q": "How many 100-digit numbers contain exactly one even digit? (An expression like 2 \u00d7 3^7 + 5 \u00d7 3^8 is fine.)", "type": "num", "ans": "787283183410569781800905108152220657213860022238804958760738372802734375", "nudges": ["Can a number be in both cases?", "Disjoint cases: add or multiply?", "Use steps 1 and 3."], "hint": "The two cases are disjoint, so add them.", "reveal": "4 \u00d7 5\u2079\u2079 + 99 \u00d7 5\u00b9\u2070\u2070.", "check": "Checked: the same formula matches every 1- to 6-digit number.", "ok": "Cases add.", "named": {"788860905221011805411728565282786229673206435109023004770278930664062500": "That treats all 100 places alike, but the first digit can't be 0.", "4928628100066024232058098730593858398547479717627164369416084358913441476556023685417684299915565184629917538927657005842775106430053710937500": "Disjoint cases add; they don't multiply.", "6310887241768094443293828522262289837385651480872184038162231445312500": "That's only case 1.", "780972296168801687357611279629958367376474370757932774722576141357421875": "That's only case 2."}, "ph": "number or expression", "special": null, "order": false}], "story": "<div class=\"story worked\" id=\"story42\" tabindex=\"0\" aria-label=\"Worked answer: Problem 2\" data-plan='[&quot;What could it look like?&quot;, &quot;Each case: first, and then&quot;, &quot;Either, or: add&quot;, &quot;Check a tiny case&quot;]'><div class=\"wbody\"><div class=\"plan-side\" aria-hidden=\"true\"><ol><li data-s=\"1\">What structures might we consider? Make cases where decisions behave differently (like a first digit, which can&#x27;t be 0).<\/li><li data-s=\"2\">Inside each case, break it into steps: first ___, and then ___. Multiply.<\/li><li data-s=\"3\">If the cases are disjoint (non-overlapping), count them separately and add.<\/li><li data-s=\"4\">Check a tiny case you can list.<\/li><\/ol><\/div><div class=\"wmain\"><div class=\"plan-strip\" aria-hidden=\"true\"><span data-s=\"1\">1<\/span><span data-s=\"2\">2<\/span><span data-s=\"3\">3<\/span><span data-s=\"4\">4<\/span><span class=\"stepname\"><\/span><\/div><figure class=\"frame\" data-step=\"1\"><p class=\"ftitle\">1. What could it look like?<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 460 134\" role=\"img\" aria-label=\"the teacher&#x27;s rule\" style=\"max-width:667px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"4\" y=\"4\" width=\"452\" height=\"126\" rx=\"10\" class=\"wcard \"/><text x=\"230.0\" y=\"32\" class=\"cardt\" text-anchor=\"middle\">100 cases?  too many<\/text><text x=\"230.0\" y=\"58\" class=\"cardt\" text-anchor=\"middle\">Cases should be made based on the idea that some<\/text><text x=\"230.0\" y=\"84\" class=\"cardt\" text-anchor=\"middle\">cases behave differently: some decisions affect<\/text><text x=\"230.0\" y=\"110\" class=\"cardt\" text-anchor=\"middle\">the count differently than others.<\/text><\/svg><\/div><figcaption><p>The even digit could be in any of 100 places: 100 cases? Too many. The teacher&#x27;s rule: make cases where a decision behaves differently from the others.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"1\"><p class=\"ftitle\">1. What could it look like?<\/p><div class=\"pic-wrap\"><div class=\"vstack\"><svg class=\"pic \" viewBox=\"0 0 190 72\" role=\"img\" aria-label=\"tiles\" style=\"max-width:276px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p2\"/><text x=\"25.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">E<\/text><rect x=\"44\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p1\"/><text x=\"59.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">o<\/text><rect x=\"78\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p1\"/><text x=\"93.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">o<\/text><rect x=\"112\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"127.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">\u2026<\/text><rect x=\"146\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p1\"/><text x=\"161.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">o<\/text><text x=\"95.0\" y=\"66\" class=\"cap\" text-anchor=\"middle\">case 1: the first digit is the even one<\/text><\/svg><svg class=\"pic \" viewBox=\"0 0 190 72\" role=\"img\" aria-label=\"tiles\" style=\"max-width:276px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p1\"/><text x=\"25.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">o<\/text><rect x=\"44\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p1\"/><text x=\"59.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">o<\/text><rect x=\"78\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p2\"/><text x=\"93.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">E<\/text><rect x=\"112\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"127.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">\u2026<\/text><rect x=\"146\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p1\"/><text x=\"161.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">o<\/text><text x=\"95.0\" y=\"66\" class=\"cap\" text-anchor=\"middle\">case 2: one of the other 99 digits is the even one<\/text><\/svg><\/div><\/div><figcaption><p>The first digit behaves differently from the others because it cannot be 0. So only two cases: the first digit is even, or one of the other 99 digits is even. They&#x27;re disjoint.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"1\"><p class=\"ftitle\">1. What could it look like?<\/p><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th><\/th><th>Problem 1: exactly one 2 (3 digits)<\/th><th>Problem 2: exactly one even digit (100 digits)<\/th><\/tr><\/thead><tbody><tr><td>the special place<\/td><td>the first digit<\/td><td>the first digit<\/td><\/tr><tr><td>why it&#x27;s special<\/td><td>it can&#x27;t be 0<\/td><td>it can&#x27;t be 0<\/td><\/tr><tr><td>case A: special digit first<\/td><td>9 \u00d7 9<\/td><td>4 \u00d7 5\u2079\u2079<\/td><\/tr><tr><td>case B: special digit elsewhere<\/td><td>2 places \u00d7 8 \u00d7 9<\/td><td>99 places \u00d7 5 \u00d7 5\u2079\u2079<\/td><\/tr><tr><td>total<\/td><td>case A + case B<\/td><td>case A + case B<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>This is Problem 1&#x27;s idea made bigger. There, the 2 was first, or in one of the other places; here, the even digit is first, or in one of the other 99 places. In both, only the first digit is special, because it can&#x27;t be 0.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><div class=\"vstack\"><svg class=\"pic \" viewBox=\"0 0 510 134\" role=\"img\" aria-label=\"slots\" style=\"max-width:740px\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"47.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">1st digit<\/text><rect x=\"10\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot fixed\"/><text x=\"47.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">4<\/text><text x=\"99.0\" y=\"62\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><text x=\"151.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">2nd digit<\/text><rect x=\"114\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"151.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">5<\/text><text x=\"203.0\" y=\"62\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><text x=\"255.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">3rd digit<\/text><rect x=\"218\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"255.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">5<\/text><text x=\"307.0\" y=\"62\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><text x=\"359.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">\u2026<\/text><rect x=\"322\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"359.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">\u2026<\/text><text x=\"411.0\" y=\"62\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><text x=\"463.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">100th digit<\/text><rect x=\"426\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"463.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">5<\/text><text x=\"255.0\" y=\"128\" class=\"cap\" text-anchor=\"middle\">1st: 2, 4, 6, 8 (not 0)   every other digit: 1, 3, 5, 7, 9<\/text><\/svg><svg class=\"pic \" viewBox=\"0 0 605 70\" role=\"img\" aria-label=\"case 1\" style=\"max-width:877px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"25.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">4<\/text><text x=\"64.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><rect x=\"88\" y=\"16\" width=\"343\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"259.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">5 \u00d7 5 \u00d7 \u2026 \u00d7 5  (99 fives)<\/text><text x=\"454.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"478\" y=\"16\" width=\"109\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"532.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">4 \u00d7 5\u2079\u2079<\/text><\/svg><\/div><\/div><figcaption><p>Case 1, the first digit is even. Go digit by digit: the 1st digit can be 2, 4, 6 or 8 (4 options; not 0). The rest must be odd: the 2nd digit can be any of 1, 3, 5, 7, 9 (5 options), the same for the 3rd digit, and so on up to the 100th. That&#x27;s 99 digits with 5 options each, so 5 \u00d7 5 \u00d7 \u2026 \u00d7 5 = 5\u2079\u2079. With the first digit: 4 \u00d7 5\u2079\u2079.<\/p><div class=\"ask\"><b>Ask him:<\/b> For a 3-digit number, what would case 1 give?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><div class=\"vstack\"><svg class=\"pic \" viewBox=\"0 0 471 134\" role=\"img\" aria-label=\"slots\" style=\"max-width:683px\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"47.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">which place<\/text><rect x=\"10\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"47.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">99<\/text><text x=\"99.0\" y=\"62\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><text x=\"151.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">even digit<\/text><rect x=\"114\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"151.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">5<\/text><text x=\"203.0\" y=\"62\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><text x=\"255.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">the 99 odd digits<\/text><rect x=\"218\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"255.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">5\u2079\u2079<\/text><text x=\"307.0\" y=\"62\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"322\" y=\"28\" width=\"139\" height=\"50\" rx=\"8\" class=\"result\"/><text x=\"391.5\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">99 \u00d7 5\u00b9\u2070\u2070<\/text><text x=\"235.5\" y=\"128\" class=\"cap\" text-anchor=\"middle\">the even digit can be 0 now: 0, 2, 4, 6, 8<\/text><\/svg><\/div><\/div><figcaption><p>Case 2, one of the other digits is even: first choose which of the 99 places (99 options), then that even digit, 0, 2, 4, 6 or 8 (5 options, 0 allowed now), then the first digit and the remaining 98 digits all odd (5 options each, 5\u2079\u2079): 99 \u00d7 5 \u00d7 5\u2079\u2079 = 99 \u00d7 5\u00b9\u2070\u2070.<\/p><div class=\"ask\"><b>Ask him:<\/b> Why is 0 allowed for the even digit in case 2 but not in case 1?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>case (cases add +)<\/th><th>inside the case: first, and then (steps multiply \u00d7)<\/th><th>count<\/th><\/tr><\/thead><tbody><tr><td>the even digit is first<\/td><td>4 \u00d7 5 \u00d7 \u2026 \u00d7 5 = 4 \u00d7 5\u2079\u2079<\/td><td>4 \u00d7 5\u2079\u2079<\/td><\/tr><tr><td>the even digit is somewhere else<\/td><td>99 \u00d7 5 \u00d7 5\u2079\u2079 = 99 \u00d7 5\u00b9\u2070\u2070<\/td><td>99 \u00d7 5\u00b9\u2070\u2070<\/td><\/tr><tr class=\"hl\"><td>total (add the cases)<\/td><td>4 \u00d7 5\u2079\u2079 + 99 \u00d7 5\u00b9\u2070\u2070<\/td><td>4 \u00d7 5\u2079\u2079 + 99 \u00d7 5\u00b9\u2070\u2070<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>The shape of every Week 5 problem: split it into cases, multiply the steps inside each case (\u201cfirst ___, and then ___\u201d), then add the cases (\u201ceither ___ or ___\u201d). Here: 2 cases, each one a multiplication, added together.<\/p><div class=\"ask\"><b>Ask him:<\/b> Which numbers here are multiplied, and which are added? Why?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 176 92\" role=\"img\" aria-label=\"tempting\" style=\"max-width:255px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"148\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"84.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">100 \u00d7 5\u00b9\u2070\u2070<\/text><line x1=\"6\" y1=\"60\" x2=\"170\" y2=\"12\" class=\"strike banned big\"/><text x=\"88.0\" y=\"86\" class=\"cap\" text-anchor=\"middle\">treats all 100 places alike<\/text><\/svg><\/div><figcaption><p>Tempting: 100 places, 5 even digits, 5 odd digits each time. But the first digit behaves differently: it can&#x27;t be 0. That&#x27;s why there are two cases, not one.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 319 70\" role=\"img\" aria-label=\"final answer\" style=\"max-width:463px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"109\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"64.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">4 \u00d7 5\u2079\u2079<\/text><text x=\"142.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">+<\/text><rect x=\"166\" y=\"16\" width=\"135\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"233.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">99 \u00d7 5\u00b9\u2070\u2070<\/text><\/svg><\/div><figcaption><p>The cases are disjoint, so count them separately and add. Final answer: 4 \u00d7 5\u2079\u2079 + 99 \u00d7 5\u00b9\u2070\u2070.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"4\"><p class=\"ftitle\">4. Check a tiny case<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 374 184\" role=\"img\" aria-label=\"list\" style=\"max-width:542px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"6\" width=\"34\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"25.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">10<\/text><rect x=\"48\" y=\"6\" width=\"34\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"65.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">12<\/text><rect x=\"88\" y=\"6\" width=\"34\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"105.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">14<\/text><rect x=\"128\" y=\"6\" width=\"34\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"145.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">16<\/text><rect x=\"168\" y=\"6\" width=\"34\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"185.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">18<\/text><rect x=\"20 " class=\"lt\" text-anchor=\"middle\">72<\/text><rect x=\"208\" y=\"96\" width=\"34\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"225.0\" y=\"113\" class=\"lt\" text-anchor=\"middle\">74<\/text><rect x=\"248\" y=\"96\" width=\"34\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"265.0\" y=\"113\" class=\"lt\" text-anchor=\"middle\">76<\/text><rect x=\"288\" y=\"96\" width=\"34\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"305.0\" y=\"113\" class=\"lt\" text-anchor=\"middle\">78<\/text><rect x=\"328\" y=\"96\" width=\"34\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"345.0\" y=\"113\" class=\"lt\" text-anchor=\"middle\">81<\/text><rect x=\"8\" y=\"126\" width=\"34\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"25.0\" y=\"143\" class=\"lt\" text-anchor=\"middle\">83<\/text><rect x=\"48\" y=\"126\" width=\"34\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"65.0\" y=\"143\" class=\"lt\" text-anchor=\"middle\">85<\/text><rect x=\"88\" y=\"126\" width=\"34\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"105.0\" y=\"143\" class=\"lt\" text-anchor=\"middle\">87<\/text><rect x=\"128\" y=\"126\" width=\"34\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"145.0\" y=\"143\" class=\"lt\" text-anchor=\"middle\">89<\/text><rect x=\"168\" y=\"126\" width=\"34\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"185.0\" y=\"143\" class=\"lt\" text-anchor=\"middle\">90<\/text><rect x=\"208\" y=\"126\" width=\"34\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"225.0\" y=\"143\" class=\"lt\" text-anchor=\"middle\">92<\/text><rect x=\"248\" y=\"126\" width=\"34\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"265.0\" y=\"143\" class=\"lt\" text-anchor=\"middle\">94<\/text><rect x=\"288\" y=\"126\" width=\"34\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"305.0\" y=\"143\" class=\"lt\" text-anchor=\"middle\">96<\/text><rect x=\"328\" y=\"126\" width=\"34\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"345.0\" y=\"143\" class=\"lt\" text-anchor=\"middle\">98<\/text><text x=\"187.0\" y=\"178\" class=\"cap\" text-anchor=\"middle\">20 + 25 = 45<\/text><\/svg><\/div><figcaption><p>Tiny case: two-digit numbers with exactly one even digit. Case 1: 4 \u00d7 5 = 20. Case 2: 5 \u00d7 5 = 25. 20 + 25 = 45, and the list has 45.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"4\"><p class=\"ftitle\">4. Check a tiny case<\/p><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>digits<\/th><th>count by testing<\/th><th>formula<\/th><th>formula gives<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>4<\/td><td>4<\/td><td>4<\/td><\/tr><tr><td>2<\/td><td>45<\/td><td>4\u00b75\u00b9 + 1\u00b75\u00b2<\/td><td>45<\/td><\/tr><tr><td>3<\/td><td>350<\/td><td>4\u00b75\u00b2 + 2\u00b75\u00b3<\/td><td>350<\/td><\/tr><tr><td>4<\/td><td>2,375<\/td><td>4\u00b75\u00b3 + 3\u00b75\u2074<\/td><td>2,375<\/td><\/tr><tr><td>5<\/td><td>15,000<\/td><td>4\u00b75\u2074 + 4\u00b75\u2075<\/td><td>15,000<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>The same two cases work for any length n: 4 \u00d7 5 to the (n\u22121) + (n\u22121) \u00d7 5 to the n. Testing every number with 1 to 5 digits matches the formula each time, so it works for 100 digits too.<\/p><\/figcaption><\/figure><\/div><\/div><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><input type=\"checkbox\" class=\"showall\"> Show all steps<\/label><\/div><\/div>", "answer": "4 \u00d7 5\u2079\u2079 + 99 \u00d7 5\u00b9\u2070\u2070", "check": "Two disjoint cases: 4\u00b75\u2079\u2079 + 99\u00b75\u00b9\u2070\u2070. The same formula matches a brute-force count for every length from 1 to 6 digits.", "concept": "w5both", "inclass": null, "above": true, "note": null, "figure": null}, {"id": "w5l3", "label": "Problem 3", "section": "Lesson problems", "text": "(Problem Set 4 #11) Ellen has five different jobs to be done. She assigns all five jobs to her four kids. Each kid will have at least one job. How many ways can Ellen assign the jobs?", "steps": [{"q": "Step 1, structure: how many jobs does each kid end up with? Type four numbers, any order.", "type": "nums", "ans": [2, 1, 1, 1], "nudges": ["Give every kid one job first. How many jobs are left?", "Where can the leftover job go?", "Write the piles: one number per kid."], "hint": "Make cases by structure: find every way the job piles could look. Each structure is a case. Every kid needs one job; the one left over makes someone's pile bigger.", "reveal": "2, 1, 1, 1.", "check": "4 kids, 5 jobs: 2 + 1 + 1 + 1 = 5.", "ok": "One person must have 2 jobs, the rest have 1 each.", "named": {}, "ph": "four numbers, e.g. 3, 0, 1, 1", "special": null, "order": false}, {"q": "First: how many ways to choose which kid gets 2 jobs?", "type": "num", "ans": 4, "nudges": ["Who could be the busy kid?", "Any of the kids.", "Count the kids."], "hint": "Any of the kids could be the one with 2 jobs.", "reveal": "4.", "check": "Ana, Ben, Cal or Dee.", "ok": "First step done.", "named": {}, "ph": "number or expression", "special": null, "order": false}, {"q": "And then: how many ways to choose which 2 jobs that kid gets?", "type": "num", "ans": 10, "nudges": ["Does the order of that kid's two jobs matter?", "Count with order, then remove the order.", "Choose 2 of the 5 jobs."], "hint": "Choose 2 of the 5 jobs, without order.", "reveal": "5C2 = 10.", "check": "5 \u00d7 4 \u00f7 2 = 10.", "ok": "Dishes + Pets = Pets + Dishes.", "named": {"20": "That counts Dishes-then-Pets and Pets-then-Dishes as different.", "25": "The two jobs must be different."}, "ph": "number or expression", "special": null, "order": false}, {"q": "How many ways can Ellen assign the jobs?", "type": "num", "ans": 240, "nudges": ["After the busy kid gets 2 jobs, how many jobs and kids are left?", "The other 3 jobs go to the other 3 kids, one each.", "First ___, and then ___, and then ___: multiply all the steps."], "hint": "Who gets 2 (4) \u00d7 which 2 jobs (10) \u00d7 the other 3 jobs to the other 3 kids, one each (3 \u00d7 2 \u00d7 1). There is only one structure, so only one case: nothing to add, just multiply the steps.", "reveal": "4 \u00d7 10 \u00d7 6 = 240.", "check": "Checked: of all 4\u2075 = 1,024 assignments, 240 leave no kid empty-handed.", "ok": "Structure first, then multiply.", "named": {"480": "Each assignment got built twice: which of the busy kid's jobs was the 'spare'?", "1024": "That lets a kid get no jobs.", "40": "The other 3 jobs still need to go to the other 3 kids.", "120": "That's 5!. There are 4 kids, not 5."}, "ph": "number or expression", "special": null, "order": false}], "story": "<div class=\"story worked\" id=\"story43\" tabindex=\"0\" aria-label=\"Worked answer: Problem 3\" data-plan='[&quot;What could it look like?&quot;, &quot;Each case: first, and then&quot;, &quot;Either, or: add&quot;, &quot;Check a tiny case&quot;]'><div class=\"wbody\"><div class=\"plan-side\" aria-hidden=\"true\"><ol><li data-s=\"1\">What structures might we consider? Make cases where decisions behave differently (like a first digit, which can&#x27;t be 0).<\/li><li data-s=\"2\">Inside each case, break it into steps: first ___, and then ___. Multiply.<\/li><li data-s=\"3\">If the cases are disjoint (non-overlapping), count them separately and add.<\/li><li data-s=\"4\">Check a tiny case you can list.<\/li><\/ol><\/div><div class=\"wmain\"><div class=\"plan-strip\" aria-hidden=\"true\"><span data-s=\"1\">1<\/span><span data-s=\"2\">2<\/span><span data-s=\"3\">3<\/span><span data-s=\"4\">4<\/span><span class=\"stepname\"><\/span><\/div><figure class=\"frame\" data-step=\"1\"><p class=\"ftitle\">1. What could it look like?<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 380 138\" role=\"img\" aria-label=\"assignment\" style=\"max-width:551px\" preserveAspectRatio=\"xMidYMid meet\"><circle cx=\"50.0\" cy=\"22\" r=\"14\" class=\"person\"/><text x=\"50.0\" y=\"27\" class=\"persont\" text-anchor=\"middle\">A<\/text><text x=\"50.0\" y=\"52\" class=\"cap\" text-anchor=\"middle\">Ana<\/text><rect x=\"12\" y=\"58\" width=\"76\" height=\"20\" rx=\"6\" class=\"chip picked\"/><text x=\"50.0\" y=\"73.0\" class=\"chiptxt picked\" text-anchor=\"middle\">job<\/text><rect x=\"12\" y=\"82\" width=\"76\" height=\"20\" rx=\"6\" class=\"chip picked\"/><text x=\"50.0\" y=\"97.0\" class=\"chiptxt picked\" text-anchor=\"middle\">job<\/text><circle cx=\"142.0\" cy=\"22\" r=\"14\" class=\"person\"/><text x=\"142.0\" y=\"27\" class=\"persont\" text-anchor=\"middle\">B<\/text><text x=\"142.0\" y=\"52\" class=\"cap\" text-anchor=\"middle\">Ben<\/text><rect x=\"104\" y=\"58\" width=\"76\" height=\"20\" rx=\"6\" class=\"chip picked\"/><text x=\"142.0\" y=\"73.0\" class=\"chiptxt picked\" text-anchor=\"middle\">job<\/text><circle cx=\"234.0\" cy=\"22\" r=\"14\" class=\"person\"/><text x=\"234.0\" y=\"27\" class=\"persont\" text-anchor=\"middle\">C<\/text><text x=\"234.0\" y=\"52\" class=\"cap\" text-anchor=\"middle\">Cal<\/text><rect x=\"196\" y=\"58\" width=\"76\" height=\"20\" rx=\"6\" class=\"chip picked\"/><text x=\"234.0\" y=\"73.0\" class=\"chiptxt picked\" text-anchor=\"middle\">job<\/text><circle cx=\"326.0\" cy=\"22\" r=\"14\" class=\"person\"/><text x=\"326.0\" y=\"27\" class=\"persont\" text-anchor=\"middle\">D<\/text><text x=\"326.0\" y=\"52\" class=\"cap\" text-anchor=\"middle\">Dee<\/text><rect x=\"288\" y=\"58\" width=\"76\" height=\"20\" rx=\"6\" class=\"chip picked\"/><text x=\"326.0\" y=\"73.0\" class=\"chiptxt picked\" text-anchor=\"middle\">job<\/text><text x=\"190.0\" y=\"132\" class=\"cap\" text-anchor=\"middle\">one person must have 2 jobs, the rest have 1 each<\/text><\/svg><\/div><figcaption><p>The teacher&#x27;s step 1: structure. Before choosing anything, ask what an answer looks like: one person must have 2 jobs, and the rest have 1 each.<\/p><div class=\"ask\"><b>Ask him:<\/b> Why can&#x27;t two kids have 2 jobs each?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"1\"><p class=\"ftitle\">1. What could it look like?<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 400 108\" role=\"img\" aria-label=\"why\" style=\"max-width:580px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"4\" y=\"4\" width=\"392\" height=\"100\" rx=\"10\" class=\"wcard \"/><text x=\"200.0\" y=\"32\" class=\"cardt\" text-anchor=\"middle\">5 jobs, 4 kids, everyone at least 1<\/text><text x=\"200.0\" y=\"58\" class=\"cardt\" text-anchor=\"middle\">one job each uses 4 jobs, 1 is left over<\/text><text x=\"200.0\" y=\"84\" class=\"cardt\" text-anchor=\"middle\">\u2192 the structure is always 2, 1, 1, 1<\/text><\/svg><\/div><figcaption><p>Every kid needs at least one job: that uses 4 of the 5 jobs. The one left over makes somebody&#x27;s pile 2. So every answer has the same structure: 2, 1, 1, 1.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 222 68\" role=\"img\" aria-label=\"options\" style=\"max-width:322px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"6\" y=\"6\" width=\"48\" height=\"26\" rx=\"6\" class=\"chip picked\"/><text x=\"30.0\" y=\"24.0\" class=\"chiptxt picked\" text-anchor=\"middle\">Ana<\/text><rect x=\"60\" y=\"6\" width=\"48\" height=\"26\" rx=\"6\" class=\"chip\"/><text x=\"84.0\" y=\"24.0\" class=\"chiptxt \" text-anchor=\"middle\">Ben<\/text><rect x=\"114\" y=\"6\" width=\"48\" height=\"26\" rx=\"6\" class=\"chip\"/><text x=\"138.0\" y=\"24.0\" class=\"chiptxt \" text-anchor=\"middle\">Cal<\/text><rect x=\"168\" y=\"6\" width=\"48\" height=\"26\" rx=\"6\" class=\"chip\"/><text x=\"192.0\" y=\"24.0\" class=\"chiptxt \" text-anchor=\"middle\">Dee<\/text><text x=\"111.0\" y=\"62\" class=\"cap\" text-anchor=\"middle\">first: who gets the 2 jobs? 4 options<\/text><\/svg><\/div><figcaption><p>Now multiply, step by step. First: which kid gets the 2 jobs? 4 options.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><div class=\"vstack\"><svg class=\"pic \" viewBox=\"0 0 396 68\" role=\"img\" aria-label=\"options\" style=\"max-width:574px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"6\" y=\"6\" width=\"72\" height=\"26\" rx=\"6\" class=\"chip picked\"/><text x=\"42.0\" y=\"24.0\" class=\"chiptxt picked\" text-anchor=\"middle\">Dishes<\/text><rect x=\"84\" y=\"6\" width=\"72\" height=\"26\" rx=\"6\" class=\"chip picked\"/><text x=\"120.0\" y=\"24.0\" class=\"chiptxt picked\" text-anchor=\"middle\">Pets<\/text><rect x=\"162\" y=\"6\" width=\"72\" height=\"26\" rx=\"6\" class=\"chip\"/><text x=\"198.0\" y=\"24.0\" class=\"chiptxt \" text-anchor=\"middle\">Trash<\/text><rect x=\"240\" y=\"6\" width=\"72\" height=\"26\" rx=\"6\" class=\"chip\"/><text x=\"276.0\" y=\"24.0\" class=\"chiptxt \" text-anchor=\"middle\">Laundry<\/text><rect x=\"318\" y=\"6\" width=\"72\" height=\"26\" rx=\"6\" class=\"chip\"/><text x=\"354.0\" y=\"24.0\" class=\"chiptxt \" text-anchor=\"middle\">Garden<\/text><text x=\"198.0\" y=\"62\" class=\"cap\" text-anchor=\"middle\">and then: which 2 jobs?<\/text><\/svg><svg class=\"pic \" viewBox=\"0 0 280 70\" role=\"img\" aria-label=\"5C2\" style=\"max-width:406px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"83\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"51.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">5 \u00d7 4<\/text><text x=\"116.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">\u00f7<\/text><rect x=\"140\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"155.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">2<\/text><text x=\"194.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"218\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"240.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">10<\/text><\/svg><\/div><\/div><figcaption><p>And then: which 2 of the 5 jobs does that kid get? Count with order, 5 \u00d7 4 = 20, then remove the order (Dishes + Pets = Pets + Dishes): 5C2 = 10.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 324 94\" role=\"img\" aria-label=\"list\" style=\"max-width:470px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"6\" width=\"56\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"36.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">DP<\/text><rect x=\"70\" y=\"6\" width=\"56\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"98.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">DT<\/text><rect x=\"132\" y=\"6\" width=\"56\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"160.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">DL<\/text><rect x=\"194\" y=\"6\" width=\"56\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"222.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">DG<\/text><rect x=\"256\" y=\"6\" width=\"56\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"284.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">PT<\/text><rect x=\"8\" y=\"36\" width=\"56\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"36.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">PL<\/text><rect x=\"70\" y=\"36\" width=\"56\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"98.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">PG<\/text><rect x=\"132\" y=\"36\" width=\"56\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"160.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">TL<\/text><rect x=\"194\" y=\"36\" width=\"56\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"222.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">TG<\/text><rect x=\"256\" y=\"36\" width=\"56\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"284.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">LG<\/text><text x=\"162.0\" y=\"88\" class=\"cap\" text-anchor=\"middle\">D, P, T, L, G = Dishes, Pets, Trash, Laundry, Garden<\/text><\/svg><\/div><figcaption><p>Say Ana is the kid who gets 2 jobs. We still have to decide which 2 of the 5 jobs go in her pile. Her pile is a group: \u201cDishes and Pets\u201d is the same pile as \u201cPets and Dishes\u201d. So we&#x27;re choosing 2 jobs out of 5 with no order, and that&#x27;s what 5C2 counts. Here are all 10 of her possible piles.<\/p><div class=\"ask\"><b>Ask him:<\/b> Why isn&#x27;t \u201cP D\u201d in the list?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><div class=\"vstack\"><svg class=\"pic \" viewBox=\"0 0 248 110\" role=\"img\" aria-label=\"bundle\" style=\"max-width:360px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"12\" width=\"58\" height=\"24\" rx=\"5\" class=\"card\"/><rect x=\"15\" y=\"15\" width=\"22\" height=\"18\" rx=\"6\" class=\"chip  p1\"/><text x=\"26.0\" y=\"29.0\" class=\"chiptxt \" text-anchor=\"middle\">D<\/text><rect x=\"39\" y=\"15\" width=\"22\" height=\"18\" rx=\"6\" class=\"chip  p2\"/><text x=\"50.0\" y=\"29.0\" class=\"chiptxt \" text-anchor=\"middle\">P<\/text><rect x=\"10\" y=\"42\" width=\"58\" height=\"24\" rx=\"5\" class=\"card\"/><rect x=\"15\" y=\"45\" width=\"22\" height=\"18\" rx=\"6\" class=\"chip  p2\"/><text x=\"26.0\" y=\"59.0\" class=\"chiptxt \" text-anchor=\"middle\">P<\/text><rect x=\"39\" y=\"45\" width=\"22\" height=\"18\" rx=\"6\" class=\"chip  p1\"/><text x=\"50.0\" y=\"59.0\" class=\"chiptxt \" text-anchor=\"middle\">D<\/text><path d=\"M82 55.0 L106 55.0\" class=\"arrow\" marker-end=\"url(#ah29)\"/><defs><marker id=\"ah29\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><pa
