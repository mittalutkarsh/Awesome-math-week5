class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 420 108\" role=\"img\" aria-label=\"structure\" style=\"max-width:609px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"4\" y=\"4\" width=\"412\" height=\"100\" rx=\"10\" class=\"wcard \"/><text x=\"210.0\" y=\"32\" class=\"cardt\" text-anchor=\"middle\">every 3 she writes sits in one place:<\/text><text x=\"210.0\" y=\"58\" class=\"cardt\" text-anchor=\"middle\">the hundreds, the tens, or the ones place<\/text><text x=\"210.0\" y=\"84\" class=\"cardt\" text-anchor=\"middle\">\u2192 three disjoint cases<\/text><\/svg><\/div><figcaption><p>Count the 3s by where they sit. A 3 in the tens place and a 3 in the ones place are different 3s on the paper (33 has two of them), so the three places are disjoint cases.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 122 272\" role=\"img\" aria-label=\"tiles\" style=\"max-width:177px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p2\"/><text x=\"25.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">3<\/text><rect x=\"44\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"59.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">0<\/text><rect x=\"78\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"93.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">0<\/text><rect x=\"10\" y=\"48\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p2\"/><text x=\"25.0\" y=\"69.0\" class=\"tilet\" text-anchor=\"middle\">3<\/text><rect x=\"44\" y=\"48\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"59.0\" y=\"69.0\" class=\"tilet\" text-anchor=\"middle\">0<\/text><rect x=\"78\" y=\"48\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"93.0\" y=\"69.0\" class=\"tilet\" text-anchor=\"middle\">1<\/text><rect x=\"10\" y=\"88\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p2\"/><text x=\"25.0\" y=\"109.0\" class=\"tilet\" text-anchor=\"middle\">3<\/text><rect x=\"44\" y=\"88\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"59.0\" y=\"109.0\" class=\"tilet\" text-anchor=\"middle\">0<\/text><rect x=\"78\" y=\"88\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"93.0\" y=\"109.0\" class=\"tilet\" text-anchor=\"middle\">2<\/text><rect x=\"10\" y=\"128\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p2\"/><text x=\"25.0\" y=\"149.0\" class=\"tilet\" text-anchor=\"middle\">3<\/text><rect x=\"44\" y=\"128\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"59.0\" y=\"149.0\" class=\"tilet\" text-anchor=\"middle\">0<\/text><rect x=\"78\" y=\"128\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"93.0\" y=\"149.0\" class=\"tilet\" text-anchor=\"middle\">3<\/text><rect x=\"10\" y=\"168\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"25.0\" y=\"189.0\" class=\"tilet\" text-anchor=\"middle\">\u22ee<\/text><rect x=\"44\" y=\"168\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"59.0\" y=\"189.0\" class=\"tilet\" text-anchor=\"middle\"><\/text><rect x=\"78\" y=\"168\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"93.0\" y=\"189.0\" class=\"tilet\" text-anchor=\"middle\"><\/text><rect x=\"10\" y=\"208\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p2\"/><text x=\"25.0\" y=\"229.0\" class=\"tilet\" text-anchor=\"middle\">3<\/text><rect x=\"44\" y=\"208\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"59.0\" y=\"229.0\" class=\"tilet\" text-anchor=\"middle\">9<\/text><rect x=\"78\" y=\"208\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"93.0\" y=\"229.0\" class=\"tilet\" text-anchor=\"middle\">9<\/text><text x=\"61.0\" y=\"266\" class=\"cap\" text-anchor=\"middle\">100 of these<\/text><\/svg><\/div><figcaption><p>Case 1, the 3 is written in the hundreds place: 300, 301, 302, 303, \u2026, 399. 100 of these.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><div class=\"vstack\"><svg class=\"pic \" viewBox=\"0 0 302 134\" role=\"img\" aria-label=\"slots\" style=\"max-width:438px\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"47.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">hundreds: 0\u20134<\/text><rect x=\"10\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"47.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">5<\/text><text x=\"99.0\" y=\"62\" class=\"op\" text-anchor=\"middle\"><\/text><text x=\"151.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">tens<\/text><rect x=\"114\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot fixed\"/><text x=\"151.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">3<\/text><text x=\"203.0\" y=\"62\" class=\"op\" text-anchor=\"middle\"><\/text><text x=\"255.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">ones: 0\u20139<\/text><rect x=\"218\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"255.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">10<\/text><text x=\"151.0\" y=\"128\" class=\"cap\" text-anchor=\"middle\">5 options, the 3, 10 options<\/text><\/svg><svg class=\"pic \" viewBox=\"0 0 241 70\" role=\"img\" aria-label=\"case 2\" style=\"max-width:349px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"25.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">5<\/text><text x=\"64.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">\u00b7<\/text><rect x=\"88\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"110.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">10<\/text><text x=\"155.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"179\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"201.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">50<\/text><\/svg><\/div><\/div><figcaption><p>Case 2, the 3 is written in the tens place: _ 3 _. The hundreds digit can be 0, 1, 2, 3 or 4 (5 options; 0 means a number like 35, and 4 is fine because 439 is below 444). The ones digit can be anything, 0 to 9 (10 options). 5 \u00b7 10 = 50.<\/p><div class=\"ask\"><b>Ask him:<\/b> Why can the hundreds digit be 4 here, but the numbers stop at 444?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 122 232\" role=\"img\" aria-label=\"tiles\" style=\"max-width:177px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"25.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\"> <\/text><rect x=\"44\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"59.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">0<\/text><rect x=\"78\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p2\"/><text x=\"93.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">3<\/text><rect x=\"10\" y=\"48\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"25.0\" y=\"69.0\" class=\"tilet\" text-anchor=\"middle\"> <\/text><rect x=\"44\" y=\"48\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"59.0\" y=\"69.0\" class=\"tilet\" text-anchor=\"middle\">1<\/text><rect x=\"78\" y=\"48\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p2\"/><text x=\"93.0\" y=\"69.0\" class=\"tilet\" text-anchor=\"middle\">3<\/text><rect x=\"10\" y=\"88\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"25.0\" y=\"109.0\" class=\"tilet\" text-anchor=\"middle\"> <\/text><rect x=\"44\" y=\"88\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"59.0\" y=\"109.0\" class=\"tilet\" text-anchor=\"middle\">2<\/text><rect x=\"78\" y=\"88\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p2\"/><text x=\"93.0\" y=\"109.0\" class=\"tilet\" text-anchor=\"middle\">3<\/text><rect x=\"10\" y=\"128\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"25.0\" y=\"149.0\" class=\"tilet\" text-anchor=\"middle\"><\/text><rect x=\"44\" y=\"128\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"59.0\" y=\"149.0\" class=\"tilet\" text-anchor=\"middle\">\u22ee<\/text><rect x=\"78\" y=\"128\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"93.0\" y=\"149.0\" class=\"tilet\" text-anchor=\"middle\"><\/text><rect x=\"10\" y=\"168\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"25.0\" y=\"189.0\" class=\"tilet\" text-anchor=\"middle\">4<\/text><rect x=\"44\" y=\"168\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"59.0\" y=\"189.0\" class=\"tilet\" text-anchor=\"middle\">4<\/text><rect x=\"78\" y=\"168\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p2\"/><text x=\"93.0\" y=\"189.0\" class=\"tilet\" text-anchor=\"middle\">3<\/text><text x=\"61.0\" y=\"226\" class=\"cap\" text-anchor=\"middle\">the part in front: 0, 1, 2, \u2026, 44 \u2192 45 numbers<\/text><\/svg><\/div><figcaption><p>Case 3, the 3 is written in the ones place: 03, 13, 23, \u2026, 443. The part in front of the 3 runs from 0 to 44, so there are 45 numbers.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>case (cases add +)<\/th><th>inside the case: first, and then (steps multiply \u00d7)<\/th><th>count<\/th><\/tr><\/thead><tbody><tr><td>3 in the hundreds place<\/td><td>300 to 399<\/td><td>100<\/td><\/tr><tr><td>3 in the tens place<\/td><td>5 \u00d7 10<\/td><td>50<\/td><\/tr><tr><td>3 in the ones place<\/td><td>0 to 44 in front<\/td><td>45<\/td><\/tr><tr class=\"hl\"><td>total (add the cases)<\/td><td>100 + 50 + 45<\/td><td>195<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>The shape of every Week 5 problem: split it into cases, multiply the steps inside each case (\u201cfirst ___, and then ___\u201d), then add the cases (\u201ceither ___ or ___\u201d). Here: 3 cases, each one a multiplication, added together.<\/p><div class=\"ask\"><b>Ask him:<\/b> Which numbers here are multiplied, and which are added? Why?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 371 70\" role=\"img\" aria-label=\"add\" style=\"max-width:538px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"38.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">100<\/text><text x=\"90.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">+<\/text><rect x=\"114\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"136.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">50<\/text><text x=\"181.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">+<\/text><rect x=\"205\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"227.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">45<\/text><text x=\"272.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"296\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"324.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">195<\/text><\/svg><\/div><figcaption><p>Disjoint cases, so add: 100 + 50 + 45 = 195.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"4\"><p class=\"ftitle\">4. Check a tiny case<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 371 70\" role=\"img\" aria-label=\"tiny case\" style=\"max-width:538px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"122\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"71.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">1 to 44:<\/text><rect x=\"140\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"162.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">10<\/text><text x=\"207.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">+<\/text><rect x=\"231\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"246.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">5<\/text><text x=\"285.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"309\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"331.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">15<\/text><\/svg><\/div><figcaption><p>Tiny case: from 1 to 44. Tens place: 30\u201339 (10). Ones place: 3, 13, 23, 33, 43 (5). 10 + 5 = 15, and writing them all out gives exactly fifteen 3s.<\/p><\/figcaption><\/figure><\/div><\/div><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><input type=\"checkbox\" class=\"showall\"> Show all steps<\/label><\/div><\/div>", "answer": "195", "check": "100 + 50 + 45 = 195; counted directly from 1 to 444.", "concept": "w5rules", "inclass": null, "above": false, "note": null, "figure": null}, {"id": "w5x4", "label": "Practice 4", "section": "Practice!", "text": "(2007 MATHCOUNTS) How many even, three-digit positive integers have the property that exactly two of the integer's digits are equal?", "steps": [{"q": "Case 1, ABA (first and last digits equal, like 212): how many?", "type": "num", "ans": 36, "nudges": ["A is the first digit and the last digit. What two rules does it have to follow?", "Not 0 and even: which digits are left?", "And then B: anything except A."], "hint": "Make cases by structure: ABA, AAB or BAA. A is not 0 (first digit) and even (last digit): 2, 4, 6 or 8. B is any digit except A.", "reveal": "4 \u00b7 9 = 36.", "check": "Checked by testing.", "ok": "Case 1 done.", "named": {"45": "A is the first digit, so it can't be 0.", "32": "B can be 0.", "40": "B can't be equal to A."}, "ph": "number or expression", "special": null, "order": false}, {"q": "Case 2, AAB (first two digits equal, like 112): how many?", "type": "num", "ans": 41, "nudges": ["B is the last digit, so it's even. Does B = 0 behave differently from B = 2, 4, 6, 8?", "Subcases: B = 0, or B \u2260 0.", "If B = 0, A is anything but 0. If B \u2260 0, A can't be 0 or B."], "hint": "Subcase B = 0: A has 9 options. Subcase B \u2260 0: B has 4 options and A has 8. Subcases add.", "reveal": "9 + 4 \u00b7 8 = 41.", "check": "Checked by testing.", "ok": "A decision that behaves differently makes a subcase.", "named": {"45": "If B is 2, 4, 6 or 8, A can't be 0 or B: only 8 options.", "36": "Don't forget the subcase B = 0.", "32": "Don't forget the subcase B = 0.", "50": "A is the first digit, so it can't be 0."}, "ph": "number or expression", "special": null, "order": false}, {"q": "Case 3, BAA (last two digits equal, like 300): how many?", "type": "num", "ans": 41, "nudges": ["Now A is the last digit (even) and B is the first (not 0).", "Does A = 0 behave differently?", "It's the same counting as case 2, roles swapped."], "hint": "Subcase A = 0: B has 9 options. Subcase A \u2260 0: A has 4 options and B has 8.", "reveal": "9 + 4 \u00b7 8 = 41.", "check": "Checked by testing.", "ok": "Case 3 done.", "named": {"45": "If A is 2, 4, 6 or 8, B can't be 0 or A: only 8 options.", "36": "Count the subcase A = 0 too.", "32": "Count the subcase A = 0 too."}, "ph": "number or expression", "special": null, "order": false}, {"q": "How many even three-digit numbers have exactly two equal digits?", "type": "num", "ans": 118, "nudges": ["Can a number be in two of these cases?", "Disjoint cases: add.", "Use steps 1 to 3."], "hint": "Exactly two equal means the cases don't overlap: add.", "reveal": "36 + 41 + 41 = 118.", "check": "Testing all 450 even three-digit numbers finds 118.", "ok": "Cases add.", "named": {"122": "That includes numbers like 222, where all three digits are equal.", "77": "Did you include all three cases?"}, "ph": "number or expression", "special": null, "order": false}], "story": "<div class=\"story worked\" id=\"story48\" tabindex=\"0\" aria-label=\"Worked answer: Practice 4\" data-plan='[&quot;What could it look like?&quot;, &quot;Each case: first, and then&quot;, &quot;Either, or: add&quot;, &quot;Check a tiny case&quot;]'><div class=\"wbody\"><div class=\"plan-side\" aria-hidden=\"true\"><ol><li data-s=\"1\">What structures might we consider? Make cases where decisions behave differently (like a first digit, which can&#x27;t be 0).<\/li><li data-s=\"2\">Inside each case, break it into steps: first ___, and then ___. Multiply.<\/li><li data-s=\"3\">If the cases are disjoint (non-overlapping), count them separately and add.<\/li><li data-s=\"4\">Check a tiny case you can list.<\/li><\/ol><\/div><div class=\"wmain\"><div class=\"plan-strip\" aria-hidden=\"true\"><span data-s=\"1\">1<\/span><span data-s=\"2\">2<\/span><span data-s=\"3\">3<\/span><span data-s=\"4\">4<\/span><span class=\"stepname\"><\/span><\/div><figure class=\"frame\" data-step=\"1\"><p class=\"ftitle\">1. What could it look like?<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 122 152\" role=\"img\" aria-label=\"tiles\" style=\"max-width:177px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p2\"/><text x=\"25.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">A<\/text><rect x=\"44\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p1\"/><text x=\"59.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">B<\/text><rect x=\"78\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p2\"/><text x=\"93.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">A<\/text><rect x=\"10\" y=\"48\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p2\"/><text x=\"25.0\" y=\"69.0\" class=\"tilet\" text-anchor=\"middle\">A<\/text><rect x=\"44\" y=\"48\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p2\"/><text x=\"59.0\" y=\"69.0\" class=\"tilet\" text-anchor=\"middle\">A<\/text><rect x=\"78\" y=\"48\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p1\"/><text x=\"93.0\" y=\"69.0\" class=\"tilet\" text-anchor=\"middle\">B<\/text><rect x=\"10\" y=\"88\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p1\"/><text x=\"25.0\" y=\"109.0\" class=\"tilet\" text-anchor=\"middle\">B<\/text><rect x=\"44\" y=\"88\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p2\"/><text x=\"59.0\" y=\"109.0\" class=\"tilet\" text-anchor=\"middle\">A<\/text><rect x=\"78\" y=\"88\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p2\"/><text x=\"93.0\" y=\"109.0\" class=\"tilet\" text-anchor=\"middle\">A<\/text><text x=\"61.0\" y=\"146\" class=\"cap\" text-anchor=\"middle\">case 1: ABA   case 2: AAB   case 3: BAA<\/text><\/svg><\/div><figcaption><p>Structures: what could these numbers look like? (The teacher&#x27;s question.) Exactly two digits equal: call the repeated digit A and the other B. Then the number is ABA, AAB or BAA. In every case the first digit is not 0 and the last digit is even. Exactly two equal means A \u2260 B, so the three cases are disjoint.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><div class=\"vstack\"><svg class=\"pic \" viewBox=\"0 0 302 134\" role=\"img\" aria-label=\"slots\" style=\"max-width:438px\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"47.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">A (first): not 0<\/text><rect x=\"10\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"47.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">4<\/text><text x=\"99.0\" y=\"62\" class=\"op\" text-anchor=\"middle\"><\/text><text x=\"151.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">B \u2260 A<\/text><rect x=\"114\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"151.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">9<\/text><text x=\"203.0\" y=\"62\" class=\"op\" text-anchor=\"middle\"><\/text><text x=\"255.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">A (last): even<\/text><rect x=\"218\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot fixed\"/><text x=\"255.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">A<\/text><text x=\"151.0\" y=\"128\" class=\"cap\" text-anchor=\"middle\">A: 2, 4, 6, 8<\/text><\/svg><svg class=\"pic \" viewBox=\"0 0 228 70\" role=\"img\" aria-label=\"case 1\" style=\"max-width:331px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"25.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">4<\/text><text x=\"64.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">\u00b7<\/text><rect x=\"88\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"103.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">9<\/text><text x=\"142.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"166\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"188.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">36<\/text><\/svg><\/div><\/div><figcaption><p>Case 1, ABA: A is both the first digit (not 0) and the last digit (even), so A is 2, 4, 6 or 8 (4 options). B is anything but A (9 options). 4 \u00b7 9 = 36.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><div class=\"vstack\"><table class=\"ptable \"><thead><tr><th>subcase<\/th><th>B (last digit, even)<\/th><th>A (first, not 0, not B)<\/th><th>ways<\/th><\/tr><\/thead><tbody><tr><td>B = 0<\/td><td>1 option<\/td><td>9 options<\/td><td>9<\/td><\/tr><tr><td>B \u2260 0<\/td><td>2, 4, 6, 8 (4 options)<\/td><td>8 options<\/td><td>4 \u00b7 8 = 32<\/td><\/tr><\/tbody><\/table><svg class=\"pic \" viewBox=\"0 0 280 70\" role=\"img\" aria-label=\"case 2\" style=\"max-width:406px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"25.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">9<\/text><text x=\"64.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">+<\/text><rect x=\"88\" y=\"16\" width=\"83\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"129.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">4 \u00b7 8<\/text><text x=\"194.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"218\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"240.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">41<\/text><\/svg><\/div><\/div><figcaption><p>Case 2, AAB: the last digit B is even and the first digit A is not 0. Does B = 0 behave differently? Yes: if B = 0, A can be any of 1 to 9 (9 options). If B is 2, 4, 6 or 8 (4 options), A can&#x27;t be 0 and can&#x27;t be B (8 options). Subcases add: 9 + 4 \u00b7 8 = 41.<\/p><div class=\"ask\"><b>Ask him:<\/b> Why does B = 0 need its own subcase?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>subcase<\/th><th>A (last two digits, even)<\/th><th>B (first, not 0, not A)<\/th><th>ways<\/th><\/tr><\/thead><tbody><tr><td>A = 0<\/td><td>1 option<\/td><td>9 options<\/td><td>9<\/td><\/tr><tr><td>A \u2260 0<\/td><td>2, 4, 6, 8 (4 options)<\/td><td>8 options<\/td><td>4 \u00b7 8 = 32<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Case 3, BAA: the same counting with the roles swapped. Now A is the even last digit and B is the first digit (not 0, not A): 9 + 4 \u00b7 8 = 41.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>case (cases add +)<\/th><th>inside the case: first, and then (steps multiply \u00d7)<\/th><th>count<\/th><\/tr><\/thead><tbody><tr><td>ABA<\/td><td>4 \u00d7 9<\/td><td>36<\/td><\/tr><tr><td>AAB (subcases B = 0, B \u2260 0)<\/td><td>9 + 4 \u00d7 8<\/td><td>41<\/td><\/tr><tr><td>BAA (subcases A = 0, A \u2260 0)<\/td><td>9 + 4 \u00d7 8<\/td><td>41<\/td><\/tr><tr class=\"hl\"><td>total (add the cases)<\/td><td>36 + 41 + 41<\/td><td>118<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>The shape of every Week 5 problem: split it into cases, multiply the steps inside each case (\u201cfirst ___, and then ___\u201d), then add the cases (\u201ceither ___ or ___\u201d). Here: 3 cases, each one a multiplication, added together.<\/p><div class=\"ask\"><b>Ask him:<\/b> Which numbers here are multiplied, and which are added? Why?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 358 70\" role=\"img\" aria-label=\"add\" style=\"max-width:519px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"32.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">36<\/text><text x=\"77.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">+<\/text><rect x=\"101\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"123.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">41<\/text><text x=\"168.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">+<\/text><rect x=\"192\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"214.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">41<\/text><text x=\"259.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"283\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"311.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">118<\/text><\/svg><\/div><figcaption><p>The three structures are disjoint cases, so add: 36 + 41 + 41 = 118.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 267 92\" role=\"img\" aria-label=\"tempting\" style=\"max-width:387px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"38.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">118<\/text><text x=\"90.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">+<\/text><rect x=\"114\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"129.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">4<\/text><text x=\"168.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"192\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"220.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">122<\/text><line x1=\"6\" y1=\"60\" x2=\"261\" y2=\"12\" class=\"strike banned big\"/><text x=\"133.5\" y=\"86\" class=\"cap\" text-anchor=\"middle\">222, 444, 666, 888 have all three digits equal<\/text><\/svg><\/div><figcaption><p>Careful: numbers like 222 have all three digits equal, not exactly two. Counting them would give 122.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"4\"><p class=\"ftitle\">4. Check a tiny case<\/p><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>case<\/th><th>counted<\/th><th>by testing all 450 even three-digit numbers<\/th><\/tr><\/thead><tbody><tr><td>ABA<\/td><td>36<\/td><td>36<\/td><\/tr><tr><td>AAB<\/td><td>9 + 32 = 41<\/td><td>41<\/td><\/tr><tr><td>BAA<\/td><td>9 + 32 = 41<\/td><td>41<\/td><\/tr><tr><td>total<\/td><td>118<\/td><td>118<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Check: testing every even three-digit number finds exactly 36, 41 and 41 in the three cases (and 9 + 32 inside each of the last two), 118 in all.<\/p><\/figcaption><\/figure><\/div><\/div><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><input type=\"checkbox\" class=\"showall\"> Show all steps<\/label><\/div><\/div>", "answer": "118", "check": "ABA 36 + AAB 41 + BAA 41 = 118; checked over all 450 even three-digit numbers.", "concept": "w5rules", "inclass": null, "above": true, "note": null, "figure": null}, {"id": "w5l5", "label": "Problem 5", "section": "Complementary counting", "text": "(Example 2.1) How many 4-digit numbers contain at least one even digit?", "steps": [{"q": "Total: all 4-digit numbers. How many are there?", "type": "num", "ans": 9000, "nudges": ["What can the first digit be?", "And then each of the other three digits?", "First ___, and then ___: multiply."], "hint": "Make two cases: the ones you want, and the rest. Start with the Total: the first digit is 1 to 9, the others 0 to 9.", "reveal": "9 \u00d7 10 \u00d7 10 \u00d7 10 = 9,000.", "check": "1000 to 9999.", "ok": "Total done.", "named": {"10000": "Can a 4-digit number start with 0?", "9999": "The smallest 4-digit number is 1000, not 1.", "6561": "That's 9 \u00d7 9 \u00d7 9 \u00d7 9: the other digits can be 0."}, "ph": "number or expression", "special": null, "order": false}, {"q": "Complement: how many 4-digit numbers have no even digits (all odd)?", "type": "num", "ans": 625, "nudges": ["No even digit means every digit is odd.", "How many odd digits are there?", "Can the first digit be 0 here?"], "hint": "Every digit is odd: 1, 3, 5, 7 or 9.", "reveal": "5 \u00d7 5 \u00d7 5 \u00d7 5 = 625.", "check": "Checked by testing every 4-digit number.", "ok": "The complement done.", "named": {"500": "The first digit is odd too: 5 options, not 4.", "20": "First ___, and then ___ multiplies.", "1024": "There are 5 odd digits, not 4."}, "ph": "number or expression", "special": null, "order": false}, {"q": "How many 4-digit numbers contain at least one even digit?", "type": "num", "ans": 8375, "nudges": ["Total = the ones you want + the rest.", "So the count you want = Total \u2212 the rest.", "Use steps 1 and 2."], "hint": "The total splits into two disjoint cases: the ones you want and the rest. Subtract the rest from the total.", "reveal": "9,000 \u2212 625 = 8,375.", "check": "Checked by testing all 9,000 four-digit numbers.", "ok": "Count you want = Total \u2212 the rest.", "named": {"9625": "Subtract the rest; don't add it.", "625": "That's the rest: the numbers with no even digit.", "9000": "That's the total."}, "ph": "number or expression", "special": null, "order": false}], "story": "<div class=\"story worked\" id=\"story49\" tabindex=\"0\" aria-label=\"Worked answer: Problem 5\" data-plan='[&quot;What could it look like?&quot;, &quot;Each case: first, and then&quot;, &quot;Either, or: add&quot;, &quot;Check a tiny case&quot;]'><div class=\"wbody\"><div class=\"plan-side\" aria-hidden=\"true\"><ol><li data-s=\"1\">What structures might we consider? Make cases where decisions behave differently (like a first digit, which can&#x27;t be 0).<\/li><li data-s=\"2\">Inside each case, break it into steps: first ___, and then ___. Multiply.<\/li><li data-s=\"3\">If the cases are disjoint (non-overlapping), count them separately and add.<\/li><li data-s=\"4\">Check a tiny case you can list.<\/li><\/ol><\/div><div class=\"wmain\"><div class=\"plan-strip\" aria-hidden=\"true\"><span data-s=\"1\">1<\/span><span data-s=\"2\">2<\/span><span data-s=\"3\">3<\/span><span data-s=\"4\">4<\/span><span class=\"stepname\"><\/span><\/div><figure class=\"frame\" data-step=\"1\"><p class=\"ftitle\">1. What could it look like?<\/p><div class=\"pic-wrap\"><div class=\"vstack\"><svg class=\"pic \" viewBox=\"0 0 427 56\" role=\"img\" aria-label=\"the problem\" style=\"max-width:619px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"4\" y=\"4\" width=\"419\" height=\"48\" rx=\"10\" class=\"wcard \"/><text x=\"213.5\" y=\"32\" class=\"cardt\" text-anchor=\"middle\">at least one even digit: could be more than 1<\/text><\/svg><table class=\"ptable \"><thead><tr><th>case<\/th><th>how many even digits<\/th><\/tr><\/thead><tbody><tr><td>case 1<\/td><td>1<\/td><\/tr><tr><td>case 2<\/td><td>2<\/td><\/tr><tr><td>case 3<\/td><td>3<\/td><\/tr><tr><td>case 4<\/td><td>4<\/td><\/tr><\/tbody><\/table><\/div><\/div><figcaption><p>Could we solve this with casework? \u201cAt least one\u201d could be more than one even digit, so: case 1, one even digit; case 2, two; case 3, three; case 4, four. And in each case the first digit behaves differently (it can&#x27;t be 0), so every case splits into subcases. That&#x27;s a lot of cases.<\/p><div class=\"ask\"><b>Ask him:<\/b> Why would each case need subcases?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"1\"><p class=\"ftitle\">1. What could it look like?<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 460 200\" role=\"img\" aria-label=\"complement\" style=\"max-width:667px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"30\" width=\"440\" height=\"130\" rx=\"6\" class=\"wcard\"/><text x=\"60\" y=\"22\" class=\"slotlab\" text-anchor=\"start\">Total<\/text><rect x=\"24\" y=\"42\" width=\"270\" height=\"106\" rx=\"6\" style=\"fill:#E1ECFC;stroke:var(--p1);stroke-width:2\"/><circle cx=\"115\" cy=\"65\" r=\"2\" class=\"dot\"/><circle cx=\"197\" cy=\"58\" r=\"2\" class=\"dot\"/><circle cx=\"168\" cy=\"83\" r=\"2\" class=\"dot\"/><circle cx=\"48\" cy=\"96\" r=\"2\" class=\"dot\"/><circle cx=\"43\" cy=\"89\" r=\"2\" class=\"dot\"/><circle cx=\"51\" cy=\"60\" r=\"2\" class=\"dot\"/><circle cx=\"140\" cy=\"123\" r=\"2\" class=\"dot\"/><circle cx=\"65\" cy=\"71\" r=\"2\" class=\"dot\"/><circle cx=\"191\" cy=\"134\" r=\"2\" class=\"dot\"/><circle cx=\"178\" cy=\"86\" r=\"2\" class=\"dot\"/><circle cx=\"278\" cy=\"56\" r=\"2\" class=\"dot\"/><circle cx=\"249\" cy=\"77\" r=\"2\" class=\"dot\"/><circle cx=\"70\" cy=\"62\" r=\"2\" class=\"dot\"/><circle cx=\"111\" cy=\"122\" r=\"2\" class=\"dot\"/><circle cx=\"79\" cy=\"102\" r=\"2\" class=\"dot\"/><circle cx=\"194\" cy=\"84\" r=\"2\" class=\"dot\"/><circle cx=\"171\" cy=\"57\" r=\"2\" class=\"dot\"/><circle cx=\"49\" cy=\"70\" r=\"2\" class=\"dot\"/><circle cx=\"204\" cy=\"89\" r=\"2\" class=\"dot\"/><circle cx=\"113\" cy=\"102\" r=\"2\" class=\"dot\"/><circle cx=\"147\" cy=\"78\" r=\"2\" class=\"dot\"/><circle cx=\"233\" cy=\"112\" r=\"2\" class=\"dot\"/><circle cx=\"95\" cy=\"101\" r=\"2\" class=\"dot\"/><circle cx=\"165\" cy=\"127\" r=\"2\" class=\"dot\"/><circle cx=\"216\" cy=\"77\" r=\"2\" class=\"dot\"/><circle cx=\"279\" cy=\"62\" r=\"2\" class=\"dot\"/><rect x=\"308\" y=\"42\" width=\"128\" height=\"106\" rx=\"6\" style=\"fill:#DEF1E7;stroke:var(--p4);stroke-width:2\"/><rect x=\"322\" y=\"50\" width=\"40\" height=\"24\" rx=\"3\" style=\"fill:none;stroke:var(--p4)\"/><rect x=\"376\" y=\"50\" width=\"40\" height=\"24\" rx=\"3\" style=\"fill:none;stroke:var(--p4)\"/><rect x=\"322\" y=\"82\" width=\"40\" height=\"24\" rx=\"3\" style=\"fill:none;stroke:var(--p4)\"/><rect x=\"376\" y=\"82\" width=\"40\" height=\"24\" rx=\"3\" style=\"fill:none;stroke:var(--p4)\"/><rect x=\"322\" y=\"114\" width=\"40\" height=\"24\" rx=\"3\" style=\"fill:none;stroke:var(--p4)\"/><rect x=\"376\" y=\"114\" width=\"40\" height=\"24\" rx=\"3\" style=\"fill:none;stroke:var(--p4)\"/><line x1=\"300\" y1=\"40\" x2=\"444\" y2=\"152\" class=\"strike banned big\"/><line x1=\"444\" y1=\"40\" x2=\"300\" y2=\"152\" class=\"strike banned big\"/><text x=\"159\" y=\"178\" class=\"cap\" text-anchor=\"middle\">you want to count these<\/text><text x=\"372\" y=\"178\" class=\"cap\" text-anchor=\"middle\">the rest of the total<\/text><\/svg><\/div><figcaption><p>The teacher&#x27;s picture. Inside the Total are the numbers you want to count, and the rest of the total. The rest is the complement (the opposite). Total = (the ones you want) + (the rest): two disjoint cases. So the count you want = Total \u2212 the rest.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"1\"><p class=\"ftitle\">1. What could it look like?<\/p><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>what we want: at least one even digit<\/th><th>the complement: no even digit (all odd)<\/th><\/tr><\/thead><tbody><tr><td>1234<\/td><td>1357<\/td><\/tr><tr><td>2468<\/td><td>9999<\/td><\/tr><tr><td>1350<\/td><td>3175<\/td><\/tr><tr><td>\u2026 every other 4-digit number with an even digit<\/td><td>\u2026 every 4-digit number whose digits are all odd<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>The complement of \u201cat least one even digit\u201d is \u201cno even digit\u201d, which means every digit is odd. Every 4-digit number lands in exactly one column: the two columns never overlap, and together they are all the 4-digit numbers.<\/p><div class=\"ask\"><b>Ask him:<\/b> Is 2000 in the left column or the right one? What about 1111?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 523 134\" role=\"img\" aria-label=\"slots\" style=\"max-width:758px\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"47.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">1st digit<\/text><rect x=\"10\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"47.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">9<\/text><text x=\"99.0\" y=\"62\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><text x=\"151.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">2nd<\/text><rect x=\"114\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"151.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">10<\/text><text x=\"203.0\" y=\"62\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><text x=\"255.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">3rd<\/text><rect x=\"218\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"255.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">10<\/text><text x=\"307.0\" y=\"62\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><text x=\"359.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">4th<\/text><rect x=\"322\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"359.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">10<\/text><text x=\"411.0\" y=\"62\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"426\" y=\"28\" width=\"87\" height=\"50\" rx=\"8\" class=\"result\"/><text x=\"469.5\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">9,000<\/text><text x=\"261.5\" y=\"128\" class=\"cap\" text-anchor=\"middle\">1st digit 1\u20139 (not 0), the others 0\u20139<\/text><\/svg><\/div><figcaption><p>Total: all 4-digit numbers. First digit 1 to 9 (9 options, not 0), and then 10 options for each of the other three: 9 \u00b7 10 \u00b7 10 \u00b7 10 = 9,000.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 520 134\" role=\"img\" aria-label=\"slots\" style=\"max-width:754px\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"47.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">1st digit<\/text><rect x=\"10\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"47.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">5<\/text><text x=\"99.0\" y=\"62\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><text x=\"151.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">2nd<\/text><rect x=\"114\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"151.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">5<\/text><text x=\"203.0\" y=\"62\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><text x=\"255.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">3rd<\/text><rect x=\"218\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"255.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">5<\/text><text x=\"307.0\" y=\"62\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><text x=\"359.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">4th<\/text><rect x=\"322\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"359.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">5<\/text><text x=\"411.0\" y=\"62\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"426\" y=\"28\" width=\"84\" height=\"50\" rx=\"8\" class=\"result\"/><text x=\"468.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">625<\/text><text x=\"260.0\" y=\"128\" class=\"cap\" text-anchor=\"middle\">every digit odd: 1, 3, 5, 7, 9<\/text><\/svg><\/div><figcaption><p>Complement: 4-digit numbers with no even digits (all odd). Every digit is 1, 3, 5, 7 or 9, and since the first digit is odd anyway, 0 never comes up. 5 \u00b7 5 \u00b7 5 \u00b7 5 = 625.<\/p><div class=\"ask\"><b>Ask him:<\/b> Why doesn&#x27;t the first digit need a special rule here?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>case (they add up to the Total)<\/th><th>count<\/th><\/tr><\/thead><tbody><tr><td>the ones you want (at least one even digit)<\/td><td>?<\/td><\/tr><tr><td>the rest (no even digit)<\/td><td>625<\/td><\/tr><tr class=\"hl\"><td>Total<\/td><td>9,000<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Two disjoint cases make up the Total: the ones you want and the rest. Their counts add to 9,000, so the one you want is what&#x27;s left after taking away the 625.<\/p><div class=\"ask\"><b>Ask him:<\/b> Which number here is the unknown, and how do you find it?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><div class=\"vstack\"><svg class=\"pic \" viewBox=\"0 0 460 200\" role=\"img\" aria-label=\"complement\" style=\"max-width:667px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"30\" width=\"440\" height=\"130\" rx=\"6\" class=\"wcard\"/><text x=\"60\" y=\"22\" class=\"slotlab\" text-anchor=\"start\">Total = 9,000<\/text><rect x=\"24\" y=\"42\" width=\"270\" height=\"106\" rx=\"6\" style=\"fill:#E1ECFC;stroke:var(--p1);stroke-width:2\"/><circle cx=\"115\" cy=\"65\" r=\"2\" class=\"dot\"/><circle cx=\"197\" cy=\"58\" r=\"2\" class=\"dot\"/><circle cx=\"168\" cy=\"83\" r=\"2\" class=\"dot\"/><circle cx=\"48\" cy=\"96\" r=\"2\" class=\"dot\"/><circle cx=\"43\" cy=\"89\" r=\"2\" class=\"dot\"/><circle cx=\"51\" cy=\"60\" r=\"2\" class=\"dot\"/><circle cx=\"140\" cy=\"123\" r=\"2\" class=\"dot\"/><circle cx=\"65\" cy=\"71\" r=\"2\" class=\"dot\"/><circle cx=\"191\" cy=\"134\" r=\"2\" class=\"dot\"/><circle cx=\"178\" cy=\"86\" r=\"2\" class=\"dot\"/><circle cx=\"278\" cy=\"56\" r=\"2\" class=\"dot\"/><circle cx=\"249\" cy=\"77\" r=\"2\" class=\"dot\"/><circle cx=\"70\" cy=\"62\" r=\"2\" class=\"dot\"/><circle cx=\"111\" cy=\"122\" r=\"2\" class=\"dot\"/><circle cx=\"79\" cy=\"102\" r=\"2\" class=\"dot\"/><circle cx=\"194\" cy=\"84\" r=\"2\" class=\"dot\"/><circle cx=\"171\" cy=\"57\" r=\"2\" class=\"dot\"/><circle cx=\"49\" cy=\"70\" r=\"2\" class=\"dot\"/><circle cx=\"204\" cy=\"89\" r=\"2\" class=\"dot\"/><circle cx=\"113\" cy=\"102\" r=\"2\" class=\"dot\"/><circle cx=\"147\" cy=\"78\" r=\"2\" class=\"dot\"/><circle cx=\"233\" cy=\"112\" r=\"2\" class=\"dot\"/><circle cx=\"95\" cy=\"101\" r=\"2\" class=\"dot\"/><circle cx=\"165\" cy=\"127\" r=\"2\" class=\"dot\"/><circle cx=\"216\" cy=\"77\" r=\"2\" class=\"dot\"/><circle cx=\"279\" cy=\"62\" r=\"2\" class=\"dot\"/><rect x=\"308\" y=\"42\" width=\"128\" height=\"106\" rx=\"6\" style=\"fill:#DEF1E7;stroke:var(--p4);stroke-width:2\"/><rect x=\"322\" y=\"50\" width=\"40\" height=\"24\" rx=\"3\" style=\"fill:none;stroke:var(--p4)\"/><rect x=\"376\" y=\"50\" width=\"40\" height=\"24\" rx=\"3\" style=\"fill:none;stroke:var(--p4)\"/><rect x=\"322\" y=\"82\" width=\"40\" height=\"24\" rx=\"3\" style=\"fill:none;stroke:var(--p4)\"/><rect x=\"376\" y=\"82\" width=\"40\" height=\"24\" rx=\"3\" style=\"fill:none;stroke:var(--p4)\"/><rect x=\"322\" y=\"114\" width=\"40\" height=\"24\" rx=\"3\" style=\"fill:none;stroke:var(--p4)\"/><rect x=\"376\" y=\"114\" width=\"40\" height=\"24\" rx=\"3\" style=\"fill:none;stroke:var(--p4)\"/><line x1=\"300\" y1=\"40\" x2=\"444\" y2=\"152\" class=\"strike banned big\"/><line x1=\"444\" y1=\"40\" x2=\"300\" y2=\"152\" class=\"strike banned big\"/><text x=\"159\" y=\"178\" class=\"cap\" text-anchor=\"middle\">you want to count these: 8,375<\/text><text x=\"372\" y=\"178\" class=\"cap\" text-anchor=\"middle\">the rest of the total: 625<\/text><\/svg><svg class=\"pic \" viewBox=\"0 0 345 70\" role=\"img\" aria-label=\"count you want\" style=\"max-width:500px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"83\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"51.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">9,000<\/text><text x=\"116.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">\u2212<\/text><rect x=\"140\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"168.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">625<\/text><text x=\"220.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"244\" y=\"16\" width=\"83\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"285.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">8,375<\/text><\/svg><\/div><\/div><figcaption><p>Count you want = Total \u2212 complement: 9,000 \u2212 625 = 8,375.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"4\"><p class=\"ftitle\">4. Check a tiny case<\/p><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>casework instead<\/th><th>count (by testing every 4-digit number)<\/th><\/tr><\/thead><tbody><tr><td>case 1: one even digit<\/td><td>2,375<\/td><\/tr><tr><td>case 2: two even digits<\/td><td>3,375<\/td><\/tr><tr><td>case 3: three even digits<\/td><td>2,125<\/td><\/tr><tr><td>case 4: four even digits<\/td><td>500<\/td><\/tr><tr><td>total (add the cases)<\/td><td>8,375<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Check: the four cases really do add up to 8,375 (counted by testing every 4-digit number). Casework works, but each case needs its own subcases. The complement takes two easy counts.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"4\"><p class=\"ftitle\">4. Check a tiny case<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 254 70\" role=\"img\" aria-label=\"tiny case\" style=\"max-width:368px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"32.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">90<\/text><text x=\"77.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">\u2212<\/text><rect x=\"101\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"123.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">25<\/text><text x=\"168.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"192\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"214.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">65<\/text><\/svg><\/div><figcaption><p>Tiny case: two-digit numbers with at least one even digit. Total 9 \u00d7 10 = 90; all odd 5 \u00d7 5 = 25; 90 \u2212 25 = 65, and testing all 90 finds 65.<\/p><\/figcaption><\/figure><\/div><\/div><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><input type=\"checkbox\" class=\"showall\"> Show all steps<\/label><\/div><\/div>", "answer": "8,375", "check": "Total 9,000 \u2212 all-odd 625 = 8,375; the four cases (1\u20134 even digits) also add to 8,375.", "concept": "w5comp", "inclass": null, "above": false, "note": null, "figure": null}, {"id": "w5l6", "label": "Problem 6", "section": "Complementary counting", "text": "(Problem 2.1) How many 3-digit numbers contain at least one 3 and no 5's?", "steps": [{"q": "Adjust the total: how many 3-digit numbers have no 5 at all?", "type": "num", "ans": 648, "nudges": ["Every number we want has no 5. So use only those as the Total.", "Which digits can the hundreds place use?", "And then the tens and ones?"], "hint": "Make two cases inside an adjusted Total: the ones we want, and the complement. Total = 3-digit numbers with no 5: hundreds not 0 or 5, tens and ones not 5.", "reveal": "8 \u00b7 9 \u00b7 9 = 648.", "check": "Checked by testing all 900 three-digit numbers.", "ok": "We can adjust the total as long as it contains the desired count.", "named": {"900": "Every number we want has no 5: adjust the total to the numbers with no 5.", "729": "The hundreds digit can't be 0 either.", "576": "The tens and ones can be 0."}, "ph": "number or expression", "special": null, "order": false}, {"q": "Complement: how many 3-digit numbers have no 5 and no 3?", "type": "num", "ans": 448, "nudges": ["\u201cAt least one 3\u201d has the complement \u201cno 3\u201d.", "Which digits can the hundreds place use now?", "And the tens and ones?"], "hint": "Hundreds: not 0, 3 or 5. Tens and ones: not 3 or 5.", "reveal": "7 \u00b7 8 \u00b7 8 = 448.", "check": "Checked by testing.", "ok": "Complement done.", "named": {"512": "The hundreds digit can't be 0.", "648": "That's the adjusted total. Now leave out the 3s too.", "392": "Tens and ones can be 0."}, "ph": "number or expression", "special": null, "order": false}, {"q": "How many 3-digit numbers contain at least one 3 and no 5's?", "type": "num", "ans": 200, "nudges": ["Total = the ones we want + the complement.", "Subtract the complement from the adjusted total.", "Use steps 1 and 2."], "hint": "Count = Total \u2212 complement. Inside each count, multiply; the two cases make the total.", "reveal": "648 \u2212 448 = 200.", "check": "Checked by testing all 900 three-digit numbers.", "ok": "Count = Total \u2212 complement.", "named": {"252": "That's every number with a 3, including ones with a 5 (like 335).", "452": "Use the adjusted total (no 5s), not 900.", "1096": "Subtract, don't add."}, "ph": "number or expression", "special": null, "order": false}], "story": "<div class=\"story worked\" id=\"story50\" tabindex=\"0\" aria-label=\"Worked answer: Problem 6\" data-plan='[&quot;What could it look like?&quot;, &quot;Each case: first, and then&quot;, &quot;Either, or: add&quot;, &quot;Check a tiny case&quot;]'><div class=\"wbody\"><div class=\"plan-side\" aria-hidden=\"true\"><ol><li data-s=\"1\">What structures might we consider? Make cases where decisions behave differently (like a first digit, which can&#x27;t be 0).<\/li><li data-s=\"2\">Inside each case, break it into steps: first ___, and then ___. Multiply.<\/li><li data-s=\"3\">If the cases are disjoint (non-overlapping), count them separately and add.<\/li><li data-s=\"4\">Check a tiny case you can list.<\/li><\/ol><\/div><div class=\"wmain\"><div class=\"plan-strip\" aria-hidden=\"true\"><span data-s=\"1\">1<\/span><span data-s=\"2\">2<\/span><span data-s=\"3\">3<\/span><span data-s=\"4\">4<\/span><span class=\"stepname\"><\/span><\/div><figure class=\"frame\" data-step=\"1\"><p class=\"ftitle\">1. What could it look like?<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 420 108\" role=\"img\" aria-label=\"the plain opposite\" style=\"max-width:609px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"4\" y=\"4\" width=\"412\" height=\"100\" rx=\"10\" class=\"wcard \"/><text x=\"210.0\" y=\"32\" class=\"cardt\" text-anchor=\"middle\">want: at least one 3 AND no 5&#x27;s<\/text><text x=\"210.0\" y=\"58\" class=\"cardt\" text-anchor=\"middle\">opposite: no 3&#x27;s, OR at least one 5<\/text><text x=\"210.0\" y=\"84\" class=\"cardt\" text-anchor=\"middle\">\u2192 messy: two kinds of \u201copposite\u201d<\/text><\/svg><\/div><figcaption><p>The teacher first writes the opposite of the whole question: \u201cno 3&#x27;s, at least one 5\u201d. That opposite has two different kinds of number in it (no 3s, or some 5s), which is messy to count.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"1\"><p class=\"ftitle\">1. What could it look like?<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 460 200\" role=\"img\" aria-label=\"complement\" style=\"max-width:667px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"30\" width=\"440\" height=\"130\" rx=\"6\" class=\"wcard\"/><text x=\"60\" y=\"22\" class=\"slotlab\" text-anchor=\"start\">Total: 3-digit numbers with no 5&#x27;s<\/text><rect x=\"24\" y=\"42\" width=\"270\" height=\"106\" rx=\"6\" style=\"fill:#E1ECFC;stroke:var(--p1);stroke-width:2\"/><circle cx=\"115\" cy=\"65\" r=\"2\" class=\"dot\"/><circle cx=\"197\" cy=\"58\" r=\"2\" class=\"dot\"/><circle cx=\"168\" cy=\"83\" r=\"2\" class=\"dot\"/><circle cx=\"48\" cy=\"96\" r=\"2\" class=\"dot\"/><circle cx=\"43\" cy=\"89\" r=\"2\" class=\"dot\"/><circle cx=\"51\" cy=\"60\" r=\"2\" class=\"dot\"/><circle cx=\"140\" cy=\"123\" r=\"2\" class=\"dot\"/><circle cx=\"65\" cy=\"71\" r=\"2\" class=\"dot\"/><circle cx=\"191\" cy=\"134\" r=\"2\" class=\"dot\"/><circle cx=\"178\" cy=\"86\" r=\"2\" class=\"dot\"/><circle cx=\"278\" cy=\"56\" r=\"2\" class=\"dot\"/><circle cx=\"249\" cy=\"77\" r=\"2\" class=\"dot\"/><circle cx=\"70\" cy=\"62\" r=\"2\" class=\"dot\"/><circle cx=\"111\" cy=\"122\" r=\"2\" class=\"dot\"/><circle cx=\"79\" cy=\"102\" r=\"2\" class=\"dot\"/><circle cx=\"194\" cy=\"84\" r=\"2\" class=\"dot\"/><circle cx=\"171\" cy=\"57\" r=\"2\" class=\"dot\"/><circle cx=\"49\" cy=\"70\" r=\"2\" class=\"dot\"/><circle cx=\"204\" cy=\"89\" r=\"2\" class=\"dot\"/><circle cx=\"113\" cy=\"102\" r=\"2\" class=\"dot\"/><circle cx=\"147\" cy=\"78\" r=\"2\" class=\"dot\"/><circle cx=\"233\" cy=\"112\" r=\"2\" class=\"dot\"/><circle cx=\"95\" cy=\"101\" r=\"2\" class=\"dot\"/><circle cx=\"165\" cy=\"127\" r=\"2\" class=\"dot\"/><circle cx=\"216\" cy=\"77\" r=\"2\" class=\"dot\"/><circle cx=\"279\" cy=\"62\" r=\"2\" class=\"dot\"/><rect x=\"308\" y=\"42\" width=\"128\" height=\"106\" rx=\"6\" style=\"fill:#DEF1E7;stroke:var(--p4);stroke-width:2\"/><rect x=\"322\" y=\"50\" width=\"40\" height=\"24\" rx=\"3\" style=\"fill:none;stroke:var(--p4)\"/><rect x=\"376\" y=\"50\" width=\"40\" height=\"24\" rx=\"3\" style=\"fill:none;stroke:var(--p4)\"/><rect x=\"322\" y=\"82\" width=\"40\" height=\"24\" rx=\"3\" style=\"fill:none;stroke:var(--p4)\"/><rect x=\"376\" y=\"82\" width=\"40\" height=\"24\" rx=\"3\" style=\"fill:none;stroke:var(--p4)\"/><rect x=\"322\" y=\"114\" width=\"40\" height=\"24\" rx=\"3\" style=\"fill:none;stroke:var(--p4)\"/><rect x=\"376\" y=\"114\" width=\"40\" height=\"24\" rx=\"3\" style=\"fill:none;stroke:var(--p4)\"/><line x1=\"300\" y1=\"40\" x2=\"444\" y2=\"152\" class=\"strike banned big\"/><line x1=\"444\" y1=\"40\" x2=\"300\" y2=\"152\" class=\"strike banned big\"/><text x=\"159\" y=\"178\" class=\"cap\" text-anchor=\"middle\">and at least one 3<\/text><text x=\"372\" y=\"178\" class=\"cap\" text-anchor=\"middle\">and no 3&#x27;s<\/text><\/svg><\/div><figcaption><p>So he adjusts the total: every number we want has no 5s, so take the Total to be the 3-digit numbers with no 5&#x27;s. (We can adjust the total as long as we are looking at a total containing the desired count.) Inside it, a number either has at least one 3 (blue, what we want) or no 3&#x27;s (the complement, crossed out).<\/p><div class=\"ask\"><b>Ask him:<\/b> Why is \u201cno 3&#x27;s\u201d an easier opposite than \u201cno =\"result\"/><text x=\"363.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">648<\/text><\/svg><\/div><\/div><figcaption><p>Total: 3-digit numbers with no 5&#x27;s. Hundreds digit not 0 or 5 (8 options), tens not 5 (9 options), ones not 5 (9 options): 8 \u00b7 9 \u00b7 9 = 8 \u00b7 81 = 648.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><div class=\"vstack\"><svg class=\"pic \" viewBox=\"0 0 302 134\" role=\"img\" aria-label=\"slots\" style=\"max-width:438px\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"47.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">not 0, 3, 5<\/text><rect x=\"10\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"47.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">7<\/text><text x=\"99.0\" y=\"62\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><text x=\"151.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">not 3, 5<\/text><rect x=\"114\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"151.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">8<\/text><text x=\"203.0\" y=\"62\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><text x=\"255.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">not 3, 5<\/text><rect x=\"218\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"255.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">8<\/text><text x=\"151.0\" y=\"128\" class=\"cap\" text-anchor=\"middle\">7 options, 8 options, 8 options<\/text><\/svg><svg class=\"pic \" viewBox=\"0 0 410 70\" role=\"img\" aria-label=\"complement\" style=\"max-width:594px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"135\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"77.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">7 \u00b7 8 \u00b7 8<\/text><text x=\"168.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"192\" y=\"16\" width=\"96\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"240.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">7 \u00b7 64<\/text><text x=\"311.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"335\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"363.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">448<\/text><\/svg><\/div><\/div><figcaption><p>Complement: no 3&#x27;s and no 5&#x27;s. Hundreds not 0, 3 or 5 (7 options), tens not 3 or 5 (8 options), ones not 3 or 5 (8 options): 7 \u00b7 8 \u00b7 8 = 7 \u00b7 64 = 448.<\/p><div class=\"ask\"><b>Ask him:<\/b> Why does the hundreds digit have only 7 options?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>case (they add up to the Total)<\/th><th>count<\/th><\/tr><\/thead><tbody><tr><td>and at least one 3 (what we want)<\/td><td>?<\/td><\/tr><tr><td>and no 3&#x27;s (the complement)<\/td><td>448<\/td><\/tr><tr class=\"hl\"><td>Total: no 5&#x27;s<\/td><td>648<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Two disjoint cases make up the adjusted Total.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><div class=\"vstack\"><svg class=\"pic \" viewBox=\"0 0 460 200\" role=\"img\" aria-label=\"complement\" style=\"max-width:667px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"30\" width=\"440\" height=\"130\" rx=\"6\" class=\"wcard\"/><text x=\"60\" y=\"22\" class=\"slotlab\" text-anchor=\"start\">Total: no 5&#x27;s = 648<\/text><rect x=\"24\" y=\"42\" width=\"270\" height=\"106\" rx=\"6\" style=\"fill:#E1ECFC;stroke:var(--p1);stroke-width:2\"/><circle cx=\"115\" cy=\"65\" r=\"2\" class=\"dot\"/><circle cx=\"197\" cy=\"58\" r=\"2\" class=\"dot\"/><circle cx=\"168\" cy=\"83\" r=\"2\" class=\"dot\"/><circle cx=\"48\" cy=\"96\" r=\"2\" class=\"dot\"/><ci x=\"146.5\" y=\"86\" class=\"cap\" text-anchor=\"middle\">counts numbers like 335 and 353<\/text><\/svg><\/div><figcaption><p>Tempting: all 900 three-digit numbers minus the 648 with no 3. But that counts numbers with a 3 and a 5, like 335. The \u201cno 5&#x27;s\u201d rule belongs in the Total.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"4\"><p class=\"ftitle\">4. Check a tiny case<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 414 72\" role=\"img\" aria-label=\"list\" style=\"max-width:600px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"6\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"30.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">13<\/text><rect x=\"58\" y=\"6\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"80.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">23<\/text><rect x=\"108\" y=\"6\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"130.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">30<\/text><rect x=\"158\" y=\"6\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"180.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">31<\/text><rect x=\"208\" y=\"6\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"230.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">32<\/text><rect x=\"258\" y=\"6\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"280.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">33<\/text><rect x=\"308\" y=\"6\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"330.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">34<\/text><rect x=\"358\" y=\"6\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"380.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">36<\/text><rect x=\"8\" y=\"36\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"30.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">37<\/text><rect x=\"58\" y=\"36\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"80.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">38<\/text><rect x=\"108\" y=\"36\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"130.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">39<\/text><rect x=\"158\" y=\"36\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"180.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">43<\/text><rect x=\"208\" y=\"36\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"230.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">63<\/text><rect x=\"258\" y=\"36\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"280.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">73<\/text><rect x=\"308\" y=\"36\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"330.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">83<\/text><rect x=\"358\" y=\"36\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"380.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">93<\/text><\/svg><\/div><figcaption><p>Tiny case: two-digit numbers with at least one 3 and no 5. Adjusted total 8 \u00b7 9 = 72, complement 7 \u00b7 8 = 56, so 72 \u2212 56 = 16, and the list has 16.<\/p><\/figcaption><\/figure><\/div><\/div><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><input type=\"checkbox\" class=\"showall\"> Show all steps<\/label><\/div><\/div>", "answer": "200", "check": "Adjusted total (no 5) 648 \u2212 complement (no 3, no 5) 448 = 200; checked over all 900 three-digit numbers.", "concept": "w5rules", "inclass": null, "above": false, "note": null, "figure": null}, {"id": "w5y1", "label": "Practice 2.1", "section": "Practice! (section 2)", "text": "(1985 AJHSME) How many whole numbers between 100 and 400 contain the digit 2?", "steps": [{"q": "Complement: how many numbers from 100 to 399 do not contain a 2?", "type": "num", "ans": 162, "nudges": ["Which hundreds digits are allowed if there's no 2?", "And the tens and ones digits?", "First the hundreds, and then the tens, and then the ones."], "hint": "\u201cContains the digit 2\u201d means \u201cat least one 2\u201d: count the complement. Make two cases: the ones we want, and the complement. Count the Total and the complement, then subtract. Complement: hundreds 1 or 3; tens and ones anything but 2.", "reveal": "2 \u00b7 9 \u00b7 9 = 162.", "check": "Checked by testing every number from 100 to 399.", "ok": "Complement done.", "named": {"243": "The hundreds digit can't be 2 either: only 1 or 3.", "81": "Don't forget the hundreds digit's options.", "200": "The tens and ones can't be 2."}, "ph": "number or expression", "special": null, "order": false}, {"q": "Total: how many whole numbers are there from 100 to 399?", "type": "num", "ans": 300, "nudges": ["What can the hundreds digit be?", "And then the tens and the ones?", "Or just count: 100 to 399."], "hint": "Hundreds 1, 2 or 3; tens and ones anything.", "reveal": "300 numbers (3 \u00b7 10 \u00b7 10).", "check": "100 to 399 is 300 numbers.", "ok": "Total done.", "named": {"299": "From 100 to 399 includes both ends.", "400": "Stop at 399: 400 is past the end, and it has no 2 anyway."}, "ph": "number or expression", "special": null, "order": false}, {"q": "How many whole numbers between 100 and 400 contain the digit 2?", "type": "num", "ans": 138, "nudges": ["Total = the ones we want + the complement.", "So the ones we want = Total \u2212 complement.", "Use steps 1 and 2."], "hint": "Subtract the complement from the total. Inside each count, multiply; then the two cases make the total.", "reveal": "300 \u2212 162 = 138.", "check": "Checked by testing every number from 100 to 399.", "ok": "Count = Total \u2212 complement.", "named": {"162": "That's the complement: numbers with no 2.", "462": "Subtract, don't add.", "100": "That's only the numbers from 200 to 299."}, "ph": "number or expression", "special": null, "order": false}], "story": "<div class=\"story worked\" id=\"story51\" tabindex=\"0\" aria-label=\"Worked answer: Practice 2.1\" data-plan='[&quot;What could it look like?&quot;, &quot;Each case: first, and then&quot;, &quot;Either, or: add&quot;, &quot;Check a tiny case&quot;]'><div class=\"wbody\"><div class=\"plan-side\" aria-hidden=\"true\"><ol><li data-s=\"1\">What structures might we consider? Make cases where decisions behave differently (like a first digit, which can&#x27;t be 0).<\/li><li data-s=\"2\">Inside each case, break it into steps: first ___, and then ___. Multiply.<\/li><li data-s=\"3\">If the cases are disjoint (non-overlapping), count them separately and add.<\/li><li data-s=\"4\">Check a tiny case you can list.<\/li><\/ol><\/div><div class=\"wmain\"><div class=\"plan-strip\" aria-hidden=\"true\"><span data-s=\"1\">1<\/span><span data-s=\"2\">2<\/span><span data-s=\"3\">3<\/span><span data-s=\"4\">4<\/span><span class=\"stepname\"><\/span><\/div><figure class=\"frame\" data-step=\"1\"><p class=\"ftitle\">1. What could it look like?<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 360 212\" role=\"img\" aria-label=\"the word chain\" style=\"max-width:522px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"4\" y=\"4\" width=\"352\" height=\"204\" rx=\"10\" class=\"wcard \"/><text x=\"180.0\" y=\"32\" class=\"cardt\" text-anchor=\"middle\">\u201ccontain the digit 2\u201d<\/text><text x=\"180.0\" y=\"58\" class=\"cardt\" text-anchor=\"middle\">\u2193  means<\/text><text x=\"180.0\" y=\"84\" class=\"cardt\" text-anchor=\"middle\">\u201cat least one 2\u201d<\/text><text x=\"180.0\" y=\"110\" class=\"cardt\" text-anchor=\"middle\">\u2193  so count the complement<\/text><text x=\"180.0\" y=\"136\" class=\"cardt\" text-anchor=\"middle\">\u201cno 2 at all\u201d<\/text><text x=\"180.0\" y=\"162\" class=\"cardt\" text-anchor=\"middle\">\u2193<\/text><text x=\"180.0\" y=\"188\" class=\"cardt\" text-anchor=\"middle\">Total \u2212 complement<\/text><\/svg><\/div><figcaption><p>The teacher&#x27;s arrow: \u201ccontain the digit 2\u201d means \u201cat least one\u201d 2. And \u201cat least one\u201d is the signal for complementary counting: its opposite is \u201cno 2 at all\u201d, which is one easy multiplication. Count you want = Total \u2212 complement.<\/p><div class=\"ask\"><b>Ask him:<\/b> What other words in a problem mean \u201cat least one\u201d?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"1\"><p class=\"ftitle\">1. What could it look like?<\/p><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>what we want: contains a 2<\/th><th>the complement: no 2 at all<\/th><\/tr><\/thead><tbody><tr><td>123<\/td><td>135<\/td><\/tr><tr><td>202<\/td><td>399<\/td><\/tr><tr><td>342<\/td><td>101<\/td><\/tr><tr><td>\u2026 every number with a 2 somewhere<\/td><td>\u2026 every number with no 2<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>\u201cContains the digit 2\u201d means at least one 2. Its complement is \u201cno 2 at all\u201d. Every number from 100 to 399 is in exactly one column. (100 and 400 have no 2, so it doesn&#x27;t matter whether \u201cbetween\u201d includes them.)<\/p><div class=\"ask\"><b>Ask him:<\/b> Is 222 in the left column or the right one?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 416 134\" role=\"img\" aria-label=\"slots\" style=\"max-width:603px\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"47.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">1, 3<\/text><rect x=\"10\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"47.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">2<\/text><text x=\"99.0\" y=\"62\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><text x=\"151.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">not 2<\/text><rect x=\"114\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"151.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">9<\/text><text x=\"203.0\" y=\"62\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><text x=\"255.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">not 2<\/text><rect x=\"218\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"255.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">9<\/text><text x=\"307.0\" y=\"62\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"322\" y=\"28\" width=\"84\" height=\"50\" rx=\"8\" class=\"result\"/><text x=\"364.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">162<\/text><text x=\"208.0\" y=\"128\" class=\"cap\" text-anchor=\"middle\">hundreds 1 or 3; tens and ones not 2<\/text><\/svg><\/div><figcaption><p>Complement first (the teacher&#x27;s order): numbers between 100 and 399 which do not contain 2. The teacher crosses out 400 and writes 399: \u201cwe can adjust the total as long as we are looking at a total containing the desired count.\u201d (400 has no 2, so leaving it out loses nothing we want.) Hundreds digit 1 or 3 (2 options), tens not 2 (9 options), ones not 2 (9 options): 2 \u00b7 9 \u00b7 9 = 162.<\/p><div class=\"ask\"><b>Ask him:<\/b> Why only 2 options for the hundreds digit?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 436 70\" role=\"img\" aria-label=\"total\" style=\"max-width:632px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"200\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"110.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">Total: 100\u2013399<\/text><text x=\"233.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"257\" y=\"16\" width=\"161\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"337.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">300 numbers<\/text><\/svg><\/div><figcaption><p>Total: 100 to 399, which is 300 numbers (3 \u00b7 10 \u00b7 10 = 300).<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>case (they add up to the Total)<\/th><th>count<\/th><\/tr><\/thead><tbody><tr><td>the ones we want (contain a 2)<\/td><td>?<\/td><\/tr><tr><td>the complement (no 2)<\/td><td>162<\/td><\/tr><tr class=\"hl\"><td>Total<\/td><td>300<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Two disjoint cases make up the Total, so the one we want is the Total minus the complement.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><div class=\"vstack\"><svg class=\"pic \" viewBox=\"0 0 460 200\" role=\"img\" aria-label=\"complement\" style=\"max-width:667px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"30\" width=\"440\" height=\"130\" rx=\"6\" class=\"wcard\"/><text x=\"60\" y=\"22\" class=\"slotlab\" text-anchor=\"start\">Total = 300<\/text><rect x=\"24\" y=\"42\" width=\"270\" height=\"106\" rx=\"6\" style=\"fill:#E1ECFC;stroke:var(--p1);stroke-width:2\"/><circle cx=\"115\" cy=\"65\" r=\"2\" class=\"dot\"/><circle cx=\"197\" cy=\"58\" r=\"2\" class=\"dot\"/><circle cx=\"168\" cy=\"83\" r=\"2\" class=\"dot\"/><circle cx=\"48\" cy=\"96\" r=\"2\" class=\"dot\"/><circle cx=\"43\" cy=\"89\" r=\"2\" class=\"dot\"/><circle cx=\"51\" cy=\"60\" r=\"2\" class=\"dot\"/><circle cx=\"140\" cy=\"123\" r=\"2\" class=\"dot\"/><circle cx=\"65\" cy=\"71\" r=\"2\" class=\"dot\"/><circle cx=\"191\" cy=\"134\" r=\"2\" class=\"dot\"/><circle cx=\"178\" cy=\"86\" r=\"2\" class=\"dot\"/><circle cx=\"278\" cy=\"56\" r=\"2\" class=\"dot\"/><circle cx=\"249\" cy=\"77\" r=\"2\" class=\"dot\"/><circle cx=\"70\" cy=\"62\" r=\"2\" class=\"dot\"/><circle cx=\"111\" cy=\"122\" r=\"2
