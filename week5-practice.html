nd 2."], "hint": "15 pairs, each with 56 middles.", "reveal": "15 \u00b7 56 = 840.", "check": "Checked by testing every four-digit number.", "ok": "Cases add; steps multiply.", "named": {"448": "That's only first \u2212 last = 2. The difference can go the other way too.", "71": "Multiply, don't add."}, "ph": "number or expression", "special": null, "order": false}], "story": "<div class=\"story worked\" id=\"story61\" tabindex=\"0\" aria-label=\"Worked answer: Problem Problem 9\" data-plan='[&quot;What could it look like?&quot;, &quot;Each case: first, and then&quot;, &quot;Either, or: add&quot;, &quot;Check a tiny case&quot;]'><div class=\"wbody\"><div class=\"plan-side\" aria-hidden=\"true\"><ol><li data-s=\"1\">What structures might we consider? Make cases where decisions behave differently (like a first digit, which can&#x27;t be 0).<\/li><li data-s=\"2\">Inside each case, break it into steps: first ___, and then ___. Multiply.<\/li><li data-s=\"3\">If the cases are disjoint (non-overlapping), count them separately and add.<\/li><li data-s=\"4\">Check a tiny case you can list.<\/li><\/ol><\/div><div class=\"wmain\"><div class=\"plan-strip\" aria-hidden=\"true\"><span data-s=\"1\">1<\/span><span data-s=\"2\">2<\/span><span data-s=\"3\">3<\/span><span data-s=\"4\">4<\/span><span class=\"stepname\"><\/span><\/div><figure class=\"frame\" data-step=\"1\"><p class=\"ftitle\">1. What could it look like?<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 504 82\" role=\"img\" aria-label=\"structure\" style=\"max-width:731px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"4\" y=\"4\" width=\"496\" height=\"74\" rx=\"10\" class=\"wcard \"/><text x=\"252.0\" y=\"32\" class=\"cardt\" text-anchor=\"middle\">\u201cdifference 2\u201d: last = first + 2  or  last = first \u2212 2<\/text><text x=\"252.0\" y=\"58\" class=\"cardt\" text-anchor=\"middle\">first digit 1\u20139, last digit 0\u20139<\/text><\/svg><\/div><figcaption><p>The difference between the first and last digits is 2, either way round: like 1 _ _ 3 or 3 _ _ 1.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"1\"><p class=\"ftitle\">1. What could it look like?<\/p><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>first digit<\/th><th>last digit (differs by 2)<\/th><th>options<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>3<\/td><td>1<\/td><\/tr><tr><td>2, 3, 4, 5, 6, 7<\/td><td>first \u2212 2 or first + 2<\/td><td>2 each<\/td><\/tr><tr><td>8<\/td><td>6<\/td><td>1<\/td><\/tr><tr><td>9<\/td><td>7<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Cases: first digits 1, 8 and 9 have one partner (the other would be \u22121, 10 or 11); first digits 2 to 7 have two. Decisions that behave differently make the cases.<\/p><div class=\"ask\"><b>Ask him:<\/b> Why does the first digit 1 have only one partner?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 410 70\" role=\"img\" aria-label=\"pairs\" style=\"max-width:594px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"83\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"51.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">3 \u00b7 1<\/text><text x=\"116.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">+<\/text><rect x=\"140\" y=\"16\" width=\"83\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"181.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">6 \u00b7 2<\/text><text x=\"246.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"270\" y=\"16\" width=\"122\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"331.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">15 pairs<\/text><\/svg><\/div><figcaption><p>Pairs: 3 + 12 = 15.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 3 =\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><input type=\"checkbox\" class=\"showall\"> Show all steps<\/label><\/div><\/div>", "answer": "840", "check": "15 (first, last) pairs \u00d7 8 \u00b7 7 = 840; brute force agrees.", "concept": "w5rules", "inclass": null, "above": false, "note": null, "figure": null}, {"id": "ps5_10", "label": "Problem Problem 10", "section": "Problem solving", "text": "(2024 Purple Comet) Find the number of digits you would write if you wrote down all of the integers from 1 through 2024: 1, 2, 3, \u2026, 2022, 2023, 2024.", "steps": [{"q": "Case: the one-digit and two-digit numbers (1 to 99). How many digits do they use?", "type": "num", "ans": 189, "nudges": ["How many one-digit numbers? How many digits each?", "How many two-digit numbers (10 to 99)?", "Each case: count \u00d7 digits, then add."], "hint": "Make cases by how many digits a number has. One-digit: 9 numbers \u00d7 1; two-digit: 90 numbers \u00d7 2.", "reveal": "9 + 180 = 189.", "check": "Checked by writing them out.", "ok": "Cases add.", "named": {"99": "Two-digit numbers use 2 digits each.", "198": "There are 9 one-digit numbers (1\u20139), not 10."}, "ph": "number or expression", "special": null, "order": false}, {"q": "Case: the three-digit numbers (100 to 999). How many digits?", "type": "num", "ans": 2700, "nudges": ["How many three-digit numbers?", "Each uses 3 digits.", "Multiply."], "hint": "900 numbers \u00d7 3 digits.", "reveal": "2,700.", "check": "Checked.", "ok": "Case done.", "named": {"900": "Each one uses 3 digits.", "2697": "100 to 999 is 900 numbers."}, "ph": "number or expression", "special": null, "order": false}, {"q": "Case: the four-digit numbers (1000 to 2024). How many digits?", "type": "num", "ans": 4100, "nudges": ["How many numbers from 1000 to 2024?", "Incl text><text x=\"142.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"166\" y=\"16\" width=\"83\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"207.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">2,700<\/text><\/svg><\/div><figcaption><p>Three-digit numbers: 900 \u00d7 3 = 2,700.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 293 70\" role=\"img\" aria-label=\"four-digit\" style=\"max-width:425px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"135\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"77.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">1,025 \u00d7 4<\/text><text x=\"168.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"192\" y=\"16\" width=\"83\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"233.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">4,100<\/text><\/svg><\/div><figcaption><p>Four-digit numbers, 1000 to 2024: 2024 \u2212 1000 + 1 = 1,025 numbers, \u00d7 4 = 4,100.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>case (cases add +)<\/th><th>inside the case (steps multiply \u00d7)<\/th><th>count<\/th><\/tr><\/thead><tbody><tr><td>1 digit<\/td><td>9 \u00d7 1<\/td><td>9<\/td><\/tr><tr><td>2 digits<\/td><td>90 \u00d7 2<\/td><td>180<\/td><\/tr><tr><td>3 digits<\/td><td>900 \u00d7 3<\/td><td>2,700<\/td><\/tr><tr><td>4 digits<\/td><td>1,025 \u00d7 4<\/td><td>4,100<\/td><\/tr><tr class=\"hl\"><td>total (add the cases)<\/td><td>9 + 180 + 2,700 + 4,100<\/td><td>6,989<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Every Week 5 problem has the same shape: split into cases, multiply inside each case, add the cases.<\/p><div class=\"ask\"><b>Ask him:<\/b> Which numbers are multiplied, and which are added? Why?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 475 70\" role=\"img\" aria-label=\"add\" style=\"max-width:689px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"38.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">189<\/text><text x=\"90.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">+<\/text><rect x=\"114\" y=\"16\" width=\"83\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"155.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">2,700<\/text><text x=\"220.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">+<\/text><rect x=\"244\" y=\"16\" width=\"83\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"285.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">4,100<\/text><text x=\"350.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"374\" y=\"16\" width=\"83\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"415.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">6,989<\/text><\/svg><\/div><figcaption><p>Add the cases: 6,989.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"4\"><p class=\"ftitle\">4. Check a tiny case<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 423 70\" role=\"img\" aria-label=\"tiny case\" style=\"max-width:613px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"122\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"71.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">1 to 20:<\/text><rect x=\"140\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"155.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">9<\/text><text x=\"194.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">+<\/text><rect x=\"218\" y=\"16\" width=\"96\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"266.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">11 \u00d7 2<\/text><text x=\"337.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"361\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"383.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">31<\/text><\/svg><\/div><figcaption><p>Tiny case: writing 1 to 20 uses 9 + 22 = 31 digits. Writing them out confirms it.<\/p><\/figcaption><\/figure><\/div><\/div><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><input type=\"checkbox\" class=\"showall\"> Show all steps<\/label><\/div><\/div>", "answer": "6,989", "check": "9 + 180 + 2,700 + 4,100 = 6,989; checked by writing every number.", "concept": "w5rules", "inclass": null, "above": true, "note": null, "figure": null}, {"id": "ps5_11", "label": "Problem Problem 11", "section": "Problem solving", "text": "(2007 MATHCOUNTS) The planning committee at school has 10 members. Exactly four of these members are teachers. A four-person subcommittee with at least one member who is a teacher must be formed from the members of the planning committee. How many distinct subcommittees are possible?", "steps": [{"q": "Complement: how many four-person subcommittees have no teacher at all?", "type": "num", "ans": 15, "nudges": ["\u201cAt least one teacher\u201d \u2192 complement: no teachers.", "How many members are not teachers?", "Choose 4 of them. Does order matter in a subcommittee?"], "hint": "Make two cases: at least one teacher (what we want) and no teacher (the complement). Complement: choose 4 of the 6 non-teachers.", "reveal": "6C4 = 15.", "check": "Listed.", "ok": "Complement done.", "named": {"360": "A subcommittee has no order: divide out the 4! orders.", "1": "There are 6 non-teachers."}, "ph": "number or expression", "special": null, "order": false}, {"q": "Total: how many four-person subcommittees are there?", "type": "num", "ans": 210, "nudges": ["Choose 4 of the 10 members.", "Count with order, then remove the order.", "10C4."], "hint": "10C4 = 10 \u00b7 9 \u00b7 8 \u00b7 7 \u00f7 4!.", "reveal": "210.", "check": "Listed.", "ok": "Total done.", "named": {"5040": "Remove the order: \u00f7 4!.", "40": "Choose, don't multiply 10 \u00d7 4."}, "ph": "number or expression", "special": null, "order": false}, {"q": "How many distinct subcommittees are possible?", "type": "num", "ans": 195, "nudges": ["Total = what we want + complement.", "Subtract.", "Use steps 1 and 2."], "hint": "Count = Total \u2212 complement.", "reveal": "210 \u2212 15 = 195.", "check": "Checked by listing all 210 subcommittees.", "ok": "Count = Total \u2212 complement.", "named": {"15": "That's the complement.", "225": "Subtract, don't add.", "80": "That's only the ones with exactly one teacher."}, "ph": "number or expression", "special": null, "order": false}], "story": "<div class=\"story worked\" id=\"story63\" tabindex=\"0\" aria-label=\"Worked answer: Problem Problem 11\" data-plan='[&quot;What could it look like?&quot;, &quot;Each case: first, and then&quot;, &quot;Either, or: add&quot;, &quot;Check a tiny case&quot;]'><div class=\"wbody\"><div class=\"plan-side\" aria-hidden=\"true\"><ol><li data-s=\"1\">What structures might we consider? Make cases where decisions behave differently (like a first digit, which can&#x27;t be 0).<\/li><li data-s=\"2\">Inside each case, break it into steps: first ___, and then ___. Multiply.<\/li><li data-s=\"3\">If the cases are disjoint (non-overlapping), count them separately and add.<\/li><li data-s=\"4\">Check a tiny case you can list.<\/li><\/ol><\/div><div class=\"wmain\"><div class=\"plan-strip\" aria-hidden=\"true\"><span data-s=\"1\">1<\/span><span data-s=\"2\">2<\/span><span data-s=\"3\">3<\/span><span data-s=\"4\">4<\/span><span class=\"stepname\"><\/span><\/div><figure class=\"frame\" data-step=\"1\"><p class=\"ftitle\">1. What could it look like?<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 409 108\" role=\"img\" aria-label=\"the word chain\" style=\"max-width:593px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"4\" y=\"4\" width=\"401\" height=\"100\" rx=\"10\" class=\"wcard \"/><text x=\"204.5\" y=\"32\" class=\"cardt\" text-anchor=\"middle\">\u201cat least one teacher\u201d<\/text><text x=\"204.5\" y=\"58\" class=\"cardt\" text-anchor=\"middle\">\u2193 complement<\/text><text x=\"204.5\" y=\"84\" class=\"cardt\" text-anchor=\"middle\">\u201cno teacher\u201d: all 4 from the 6 non-teachers<\/text><\/svg><\/div><figcaption><p>\u201cAt least one\u201d \u2192 complementary counting. The complement: no teacher at all.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 475 70\" role=\"img\" aria-label=\"complement\" style=\"max-width:689px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"38.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">6C4<\/text><text x=\"90.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"114\" y=\"16\" width=\"252\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"240.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">6 \u00b7 5 \u00b7 4 \u00b7 3 \u00f7 4!<\/text><text x=\"389.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"413\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"435.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">15<\/text><\/svg><\/div><figcaption><p>Complement: choose 4 of the 6 non-teachers: count with order, then remove the order: 15.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 514 70\" role=\"img\" aria-label=\"total\" style=\"max-width:745px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"70\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"45.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">10C4<\/text><text x=\"103.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"127\" y=\"16\" width=\"265\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"259.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">10 \u00b7 9 \u00b7 8 \u00b7 7 \u00f7 4!<\/text><text x=\"415.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"439\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"467.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">210<\/text><\/svg><\/div><figcaption><p>Total: choose any 4 of the 10: 210.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>case (they add up to the Total)<\/th><th>count<\/th><\/tr><\/thead><tbody><tr><td>at least one teacher (what we want)<\/td><td>?<\/td><\/tr><tr><td>no teacher (complement)<\/td><td>15<\/td><\/tr><tr class=\"hl\"><td>Total<\/td><td>210<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Two disjoint cases make up the Total.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 280 70\" role=\"img\" aria-label=\"count\" style=\"max-width:406px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"38.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">210<\/text><text x=\"90.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">\u2212<\/text><rect x=\"114\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"136.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">15<\/text><text x=\"181.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"205\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"233.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">195<\/text><\/svg><\/div><figcaption><p>Count = 210 \u2212 15 = 195.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"4\"><p class=\"ftitle\">4. Check a tiny case<\/p><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>casework instead<\/th><th>count<\/th><\/tr><\/thead><tbody><tr><td>exactly 1 teacher<\/td><td>4C1 \u00b7 6C3 = 80<\/td><\/tr><tr><td>exactly 2 teachers<\/td><td>4C2 \u00b7 6C2 = 90<\/td><\/tr><tr><td>exactly 3 teachers<\/td><td>4C3 \u00b7 6C1 = 24<\/td><\/tr><tr><td>exactly 4 teachers<\/td><td>4C4 \u00b7 6C0 = 1<\/td><\/tr><tr><td>total<\/td><td>195<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Check with casework: exactly 1, 2, 3 or 4 teachers, 80 + 90 + 24 + 1 = 195. The complement needed just two counts.<\/p><\/figcaption><\/figure><\/div><\/div><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><input type=\"checkbox\" class=\"showall\"> Show all steps<\/label><\/div><\/div>", "answer": "195", "check": "10C4 \u2212 6C4 = 210 \u2212 15 = 195; casework 80 + 90 + 24 + 1 agrees.", "concept": "w5rules", "inclass": null, "above": false, "note": null, "figure": null}, {"id": "ps5_12", "label": "Problem Problem 12", "section": "Problem solving", "text": "A child has a set of 96 distinct blocks. Each block is one of 2 materials (plastic, wood), 3 sizes (small, medium, large), 4 colors (blue, green, red, yellow), and 4 shapes (circle, hexagon, square, triangle). How many blocks in the set are different from the \u201cplastic medium red circle\u201d in exactly 2 ways? (The \u201cwood medium red square\u201d is such a block.)", "steps": [{"q": "Cases: in how many ways can you pick which 2 of the 4 features are different?", "type": "num", "ans": 6, "nudges": ["The features: material, size, color, shape.", "Pick 2 of them. Does order matter?", "4C2."], "hint": "Make cases by which two features change. There are 4C2 such pairs.", "reveal": "4C2 = 6 cases.", "check": "Listed: material+size, material+color, \u2026", "ok": "Each pair is a case.", "named": {"12": "Material-then-size is the same pair as size-then-material.", "4": "Choose a pair of features, not one feature."}, "ph": "number or expression", "special": null, "order": false}, {"q": "How many blocks differ from the plastic medium red circle in exactly 2 ways?", "type": "num", "ans": 29, "nudges": ["In each case, the two changed features each have \u201call but one\u201d options.", "Material: 1 other; size: 2 others; color: 3 others; shape: 3 others.", "Multiply inside each case, then add the 6 cases."], "hint": "Material+size 1\u00b72, material+color 1\u00b73, material+shape 1\u00b73, size+color 2\u00b73, size+shape 2\u00b73, color+shape 3\u00b73.", "reveal": "2 + 3 + 3 + 6 + 6 + 9 = 29.", "check": "Checked by testing all 96 blocks.", "ok": "Cases add.", "named": {"48": "Each changed feature must take a different value: one fewer option each.", "36": "Check each case's product again: options minus one for each changed feature."}, "ph": "number or expression", "special": null, "order": false}], "story": "<div class=\"story worked\" id=\"story64\" tabindex=\"0\" aria-label=\"Worked answer: Problem Problem 12\" data-plan='[&quot;What could it look like?&quot;, &quot;Each case: first, and then&quot;, &quot;Either, or: add&quot;, &quot;Check a tiny case&quot;]'><div class=\"wbody\"><div class=\"plan-side\" aria-hidden=\"true\"><ol><li data-s=\"1\">What structures might we consider? Make cases where decisions behave differently (like a first digit, which can&#x27;t be 0).<\/li><li data-s=\"2\">Inside each case, break it into steps: first ___, and then ___. Multiply.<\/li><li data-s=\"3\">If the cases are disjoint (non-overlapping), count them separately and add.<\/li><li data-s=\"4\">Check a tiny case you can list.<\/li><\/ol><\/div><div class=\"wmain\"><div class=\"plan-strip\" aria-hidden=\"true\"><span data-s=\"1\">1<\/span><span data-s=\"2\">2<\/span><span data-s=\"3\">3<\/span><span data-s=\"4\">4<\/span><span class=\"stepname\"><\/span><\/div><figure class=\"frame\" data-step=\"1\"><p class=\"ftitle\">1. What could it look like?<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 380 82\" role=\"img\" aria-label=\"the start block\" style=\"max-width:551px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"4\" y=\"4\" width=\"372\" height=\"74\" rx=\"10\" class=\"wcard \"/><text x=\"190.0\" y=\"32\" class=\"cardt\" text-anchor=\"middle\">plastic \u00b7 medium \u00b7 red \u00b7 circle<\/text><text x=\"190.0\" y=\"58\" class=\"cardt\" text-anchor=\"middle\">change exactly 2 of the 4 features<\/text><\/svg><\/div><figcaption><p>Start from the plastic medium red circle. A block that differs in exactly 2 ways changes exactly two features and keeps the other two.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"1\"><p class=\"ftitle\">1. What could it look like?<\/p><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>feature<\/th><th>other options<\/th><\/tr><\/thead><tbody><tr><td>material<\/td><td>1 (wood)<\/td><\/tr><tr><td>size<\/td><td>2 (small, large)<\/td><\/tr><tr><td>color<\/td><td>3 (blue, green, yellow)<\/td><\/tr><tr><td>shape<\/td><td>3 (hexagon, square, triangle)<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Each changed feature must take a different value: one fewer than its options.<\/p><div class=\"ask\"><b>Ask him:<\/b> Why does material have only 1 other option?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>case: which 2 change<\/th><th>first, and then (multiply)<\/th><th>blocks<\/th><\/tr><\/thead><tbody><tr><td>material and size<\/td><td>1 \u00d7 2<\/td><td>2<\/td><\/tr><tr><td>material and color<\/td><td>1 \u00d7 3<\/td><td>3<\/td><\/tr><tr><td>material and shape<\/td><td>1 \u00d7 3<\/td><td>3<\/td><\/tr><tr><td>size and color<\/td><td>2 \u00d7 3<\/td><td>6<\/td><\/tr><tr><td>size and shape<\/td><td>2 \u00d7 3<\/td><td>6<\/td><\/tr><tr><td>color and shape<\/td><td>3 \u00d7 3<\/td><td>9<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>There are 4C2 = 6 cases, one for each pair of features. Inside each case, multiply the other-options counts.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>case (cases add +)<\/th><th>inside the case (steps multiply \u00d7)<\/th><th>count<\/th><\/tr><\/thead><tbody><tr><td>material and size<\/td><td>1 \u00d7 2<\/td><td>2<\/td><\/tr><tr><td>material and color<\/td><td>1 \u00d7 3<\/td><td>3<\/td><\/tr><tr><td>material and shape<\/td><td>1 \u00d7 3<\/td><td>3<\/td><\/tr><tr><td>size and color<\/td><td>2 \u00d7 3<\/td><td>6<\/td><\/tr><tr><td>size and shape<\/td><td>2 \u00d7 3<\/td><td>6<\/td><\/tr><tr><td>color and shape<\/td><td>3 \u00d7 3<\/td><td>9<\/td><\/tr><tr class=\"hl\"><td>total (add the cases)<\/td><td>2 + 3 + 3 + 6 + 6 + 9<\/td><td>29<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Every Week 5 problem has the same shape: split into cases, multiply inside each case, add the cases.<\/p><div class=\"ask\"><b>Ask him:<\/b> Which numbers are multiplied, and which are added? Why?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 410 70\" role=\"img\" aria-label=\"add\" style=\"max-width:594px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"291\" h many even integers are there between 200 and 700 whose digits are all different and come from the set {1, 2, 5, 7, 8, 9}?", "steps": [{"q": "Case 1: the hundreds digit is 2. How many such numbers?", "type": "num", "ans": 4, "nudges": ["Which hundreds digits from the set are between 2 and 6?", "If the hundreds digit is 2, which even digit can go last?", "And then the middle digit."], "hint": "Make cases by the hundreds digit: it can only be 2 or 5. With 2 first, the last digit must be the other even digit in the set, then the middle digit from what is left.", "reveal": "1 \u00b7 4 \u00b7 1 = 4.", "check": "Listed: 218, 258, 278, 298.", "ok": "Case 1 done.", "named": {"8": "The last digit can't be 2 again: only 8.", "5": "The middle digit can't be 2 or 8."}, "ph": "number or expression", "special": null, "order": false}, {"q": "Case 2: the hundreds digit is 5. How many such numbers?", "type": "num", "ans": 8, "nudges": ["Which even digits can go last?", "And then the middle digit: what's left?", "Multiply."], "hint": "With 5 first, the last digit can be either even digit in the set; then the middle digit from what is left.", "reveal": "2 \u00b7 4 = 8.", "check": "Listed.", "ok": "Case 2 done.", "named": {"10": "The middle digit can't be 5 or the last digit.", "12": "That's the total: this case is just the 5 _ _ numbers."}, "ph": "number or expression", "special": null, "order": false}, {"q": "How many such even integers are there?", "type": "num", "ans": 12, "nudges": ["Disjoint cases: add.", "Use steps 1 and 2.", "Add the two case counts."], "hint": "Add the cases.", "reveal": "4 + 8 = 12.", "check": "Listed in full.", "ok": "Cases add.", "named": {"16": "Check case 1: with 2 first, only 8 can go last.", "32": "Add the cases; don't multiply."}, "ph": "number or expression", "special": null, "order": false}], "story": "<div class=\"story worked\" id=\"story65\" tabindex=\"0\" aria-label=\"Worked answer: Problem Problem 13\" data-plan='[&quot;What could it look like?&quot;, &quot;Each case: first, and then&quot;, &quot;Either, or: add&quot;, &quot;Check a tiny case&quot;]'><div class=\"wbody\"><div class=\"plan-side\" aria-hidden=\"true\"><ol><li data-s=\"1\">What structures might we consider? Make cases where decisions behave differently (like a first digit, which can&#x27;t be 0).<\/li><li data-s=\"2\">Inside each case, break it into steps: first ___, and then ___. Multiply.<\/li><li data-s=\"3\">If the cases are disjoint (non-overlapping), count them separately and add.<\/li><li data-s=\"4\">Check a tiny case you can list.<\/li><\/ol><\/div><div class=\"wmain\"><div class=\"plan-strip\" aria-hidden=\"true\"><span data-s=\"1\">1<\/span><span data-s=\"2\">2<\/span><span data-s=\"3\">3<\/span><span data-s=\"4\">4<\/span><span class=\"stepname\"><\/span><\/div><figure class=\"frame\" data-step=\"1\"><p class=\"ftitle\">1. What could it look like?<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 427 108\" role=\"img\" aria-label=\"structure\" style=\"max-width:619px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"4\" y=\"4\" width=\"419\" height=\"100\" rx=\"10\" class=\"wcard \"/><text x=\"213.5\" y=\"32\" class=\"cardt\" text-anchor=\"middle\">digits from {1, 2, 5, 7, 8, 9}, all different<\/text><text x=\"213.5\" y=\"58\" class=\"cardt\" text-anchor=\"middle\">between 200 and 700 \u2192 hundreds digit 2 or 5<\/text><text x=\"213.5\" y=\"84\" class=\"cardt\" text-anchor=\"middle\">even \u2192 last digit 2 or 8<\/text><\/svg><\/div><figcaption><p>What could these numbers look like? The hundreds digit must be in the set and between 2 and 6: only 2 or 5. The last digit must be even and in the set: 2 or 8. Hundreds digit 2 uses up an even digit, so it behaves differently from 5: two cases.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 222 42\" role=\"img\" aria-label=\"list\" style=\"max-width:322px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"6\" width=\"46\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"31.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">218<\/text><rect x=\"60\" y=\"6\" width=\"46\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"83.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">258<\/text><rect x=\"112\" y=\"6\" width=\"46\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"135.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">278<\/text><rect x=\"164\" y=\"6\" width=\"46\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"187.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">298<\/text><\/svg><\/div><figcaption><p>Case 1, 2 _ _: the last digit must be 8; the middle any of 1, 5, 7, 9: 4 numbers.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 222 72\" role=\"img\" aria-label=\"list\" style=\"max-width:322px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"6\" width=\"46\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"31.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">512<\/text><rect x=\"60\" y=\"6\" width=\"46\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"83.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">518<\/text><rect x=\"112\" y=\"6\" width=\"46\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"135.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">528<\/text><rect x=\"164\" y=\"6\" width=\"46\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"187.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">572<\/text><rect x=\"8\" y=\"36\" width=\"46\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"31.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">578<\/text><rect x=\"60\" y=\"36\" width=\"46\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"83.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">582<\/text><rect x=\"112\" y=\"36\" width=\"46\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"135.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">592<\/text><rect x=\"164\" y=\"36\" width=\"46\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"187.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">598<\/text><\/svg><\/div><figcaption><p>Case 2, 5 _ _: the last digit 2 or 8, then 4 choices for the middle: 8 numbers.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>case (cases add +)<\/th><th>inside the case (steps multiply \u00d7)<\/th><th>count<\/th><\/tr><\/thead><tbody><tr><td>hundreds digit 2<\/td><td>1 \u00b7 4 \u00b7 1<\/td><td>4<\/td><\/tr><tr><td>hundreds digit 5<\/td><td>1 \u00b7 4 \u00b7 2<\/td><td>8<\/td><\/tr><tr class=\"hl\"><td>total (add the cases)<\/td><td>4 + 8<\/td><td>12<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Every Week 5 problem has the same shape: split into cases, multiply inside each case, add the cases.<\/p><div class=\"ask\"><b>Ask him:<\/b> Which numbers are multiplied, and which are added? Why?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 228 70\" role=\"img\" aria-label=\"add\" style=\"max-width:331px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"25.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">4<\/text><text x=\"64.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">+<\/text><rect x=\"88\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"103.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">8<\/text><text x=\"142.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"166\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"188.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">12<\/text><\/svg><\/div><figcaption><p>Add the cases: 12.<\/p><\/figcaption><\/figure><\/div><\/div><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><input type=\"checkbox\" class=\"showall\"> Show all steps<\/label><\/div><\/div>", "answer": "12", "check": "4 + 8 = 12 (hundreds digit 2 or 5); listed in full.", "concept": "w5rules", "inclass": null, "above": false, "note": null, "figure": null}, {"id": "ps5_14", "label": "Problem Problem 14", "section": "Problem solving", "text": "How many positive integers less than 10,000 have at most two different digits?", "steps": [{"q": "Case: numbers with one or two digits. How many of them have at most two different digits?", "type": "num", "ans": 99, "nudges": ["Can a one- or two-digit number have three different digits?", "So how many numbers is that, counting the one-digit ones too?", "All of them."], "hint": "Make cases by the number of digits. Every number with 1 or 2 digits has at most two different digits.", "reveal": "99.", "check": "1 to 99.", "ok": "Case done.", "named": {"90": "Include the one-digit numbers 1 to 9."}, "ph": "number or expression", "special": null, "order": false}, {"q": "Case: three-digit numbers. How many have at most two different digits?", "type": "num", "ans": 252, "nudges": ["Subcases: all three digits the same, or exactly two different digits.", "Does 0 behave differently? It can't go first.", "Two digits without 0: choose the pair (9C2), arrange (2\u00b3 \u2212 2). With 0: the other digit d (9), first digit d, the other two each d or 0 but not both d (2\u00b2 \u2212 1)."], "hint": "All the same: 9. Exactly two, no 0: 36 \u00b7 6 = 216. Exactly two, with 0: 9 \u00b7 3 = 27.", "reveal": "9 + 216 + 27 = 252.", "check": "Checked by testing all 900.", "ok": "Subcases add.", "named": {"225": "Don't forget the numbers with all three digits the same.", "243": "Add the 9 numbers like 111 and 222.", "333": "0 can't be the first digit."}, "ph": "number or expression", "special": null, "order": false}, {"q": "Case: four-digit numbers. How many have at most two different digits?", "type": "num", "ans": 576, "nudges": ["Same subcases as three digits, with 4 places.", "No 0: 36 \u00b7 (2\u2074 \u2212 2). With 0: 9 \u00b7 (2\u00b3 \u2212 1).", "Plus the 9 all-the-same numbers."], "hint": "All the same: 9. No 0: 36 \u00b7 14 = 504. With 0: 9 \u00b7 7 = 63.", "reveal": "9 + 504 + 63 = 576.", "check": "Checked by testing all 9,000.", "ok": "Subcases add.", "named": {"567": "Add the 9 numbers like 1111.", "513": "Count the subcase with a 0, like 1001."}, "ph": "number or expression", "special": null, "order": false}, {"q": "How many positive integers less than 10,000 have at most two different digits?", "type": "num", "ans": 927, "nudges": ["Disjoint cases: add.", "Use steps 1 to 3.", "Add the three case totals."], "hint": "Add the cases.", "reveal": "99 + 252 + 576 = 927.", "check": "Checked by testing every number below 10,000.", "ok": "Cases add.", "named": {"9999": "Only those with at most two different digits."}, "ph": "number or expression", "special": null, "order": false}], "story": "<div class=\"story worked\" id=\"story66\" tabindex=\"0\" aria-label=\"Worked answer: Problem Problem 14\" data-plan='[&quot;What could it look like?&quot;, &quot;Each case: first, and then&quot;, &quot;Either, or: add&quot;, &quot;Check a tiny case&quot;]'><div class=\"wbody\"><div class=\"plan-side\" aria-hidden=\"true\"><ol><li data-s=\"1\">What structures might we consider? Make cases where decisions behave differently (like a first digit, which can&#x27;t be 0).<\/li><li data-s=\"2\">Inside each case, break it into steps: first ___, and then ___. Multiply.<\/li><li data-s=\"3\">If the cases are disjoint (non-overlapping), count them separately and add.<\/li><li data-s=\"4\">Check a tiny case you can list.<\/li><\/ol><\/div><div class=\"wmain\"><div class=\"plan-strip\" aria-hidden=\"true\"><span data-s=\"1\">1<\/span><span data-s=\"2\">2<\/span><span data-s=\"3\">3<\/span><span data-s=\"4\">4<\/span><span class=\"stepname\"><\/span><\/div><figure class=\"frame\" data-step=\"1\"><p class=\"ftitle\">1. What could it look like?<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 452 108\" role=\"img\" aria-label=\"structure\" style=\"max-width:655px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"4\" y=\"4\" width=\"444\" height=\"100\" rx=\"10\" class=\"wcard \"/><text x=\"226.0\" y=\"32\" class=\"cardt\" text-anchor=\"middle\">cases: 1\u20132 digits, 3 digits, 4 digits<\/text><text x=\"226.0\" y=\"58\" class=\"cardt\" text-anchor=\"middle\">subcases: all the same, or exactly two different<\/text><text x=\"226.0\" y=\"84\" class=\"cardt\" text-anchor=\"middle\">0 behaves differently: it can&#x27;t go first<\/text><\/svg><\/div><figcaption><p>What could these numbers look like? Split by length. Inside the 3- and 4-digit cases, split again: all digits the same, or exactly two different. And 0 behaves differently (it can&#x27;t be first), so \u201ctwo different digits\u201d splits into without 0 and with 0.<\/p><div class=\"ask\"><b>Ask him:<\/b> Why does 0 need its own subcase?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>3-digit subcase<\/th><th>count<\/th><th>e.g.<\/th><\/tr><\/thead><tbody><tr><td>all the same<\/td><td>9<\/td><td>777<\/td><\/tr><tr><td>two digits, no 0<\/td><td>9C2 \u00b7 (2\u00b3 \u2212 2) = 36 \u00b7 6 = 216<\/td><td>377, 737<\/td><\/tr><tr><td>two digits, with 0<\/td><td>9 \u00b7 (2\u00b2 \u2212 1) = 27<\/td><td>300, 303<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Three digits. With two non-zero digits: choose the pair (36), then each place gets one of the two, but not all the same (2\u00b3 \u2212 2 = 6). With 0: the other digit d (9 options) goes first, then each of the other two places is d or 0, but not both d (3). 9 + 216 + 27 = 252.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>4-digit subcase<\/th><th>count<\/th><\/tr><\/thead><tbody><tr><td>all the same<\/td><td>9<\/td><\/tr><tr><td>two digits, no 0<\/td><td>36 \u00b7 (2\u2074 \u2212 2) = 504<\/td><\/tr><tr><td>two digits, with 0<\/td><td>9 \u00b7 (2\u00b3 \u2212 1) = 63<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Four digits, the same way: 9 + 504 + 63 = 576.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>case (cases add +)<\/th><th>inside the case (steps multiply \u00d7)<\/th><th>count<\/th><\/tr><\/thead><tbody><tr><td>1 or 2 digits<\/td><td>all of 1\u201399<\/td><td>99<\/td><\/tr><tr><td>3 digits<\/td><td>9 + 216 + 27<\/td><td>252<\/td><\/tr><tr><td>4 digits<\/td><td>9 + 504 + 63<\/td><td>576<\/td><\/tr><tr class=\"hl\"><td>total (add the cases)<\/td><td>99 + 252 + 576<\/td><td>927<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Every Week 5 problem has the same shape: split into cases, multiply inside each case, add the cases.<\/p><div class=\"ask\"><b>Ask him:<\/b> Which numbers are multiplied, and which are added? Why?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 384 70\" role=\"img\" aria-label=\"add\" style=\"max-width:557px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"32.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">99<\/text><text x=\"77.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">+<\/text><rect x=\"101\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"129.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">252<\/text><text x=\"181.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">+<\/text><rect x=\"205\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"233.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">576<\/text><text x=\"285.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"309\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"337.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">927<\/text><\/svg><\/div><figcaption><p>Add the cases: 927.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"4\"><p class=\"ftitle\">4. Check a tiny case<\/p><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>case<\/th><th>counted<\/th><th>by testing<\/th><\/tr><\/thead><tbody><tr><td>1\u201399<\/td><td>99<\/td><td>99<\/td><\/tr><tr><td>3 digits<\/td><td>252<\/td><td>252<\/td><\/tr><tr><td>4 digits<\/td><td>576<\/td><td>576<\/td><\/tr><tr><td>total<\/td><td>927<\/td><td>927<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Check: testing every number below 10,000 matches every case.<\/p><\/figcaption><\/figure><\/div><\/div><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><input type=\"checkbox\" class=\"showall\"> Show all steps<\/label><\/div><\/div>", "answer": "927", "check": "99 + 252 + 576 = 927 with subcases for 0; brute force agrees.", "concept": "w5rules", "inclass": null, "above": true, "note": null, "figure": null}, {"id": "ps5_15", "label": "Problem Problem 15", "section": "Problem solving", "text": "(2019 MATHCOUNTS) A positive integer is called referential if each digit occurs the same number of times as the value of the digit. For example, 1, 22 and 132332 are referential, but 10, 331 and 4242 are not. How many integers between 0 and 100,000 are referential?", "steps": [{"q": "Case: only one kind of digit (like 333). How many such referential numbers are there below 100,000?", "type": "num", "ans": 5, "nudges": ["If only the digit d appears, it appears d times.", "Which d still fit below 100,000?", "Can 0 appear?"], "hint": "Make cases by which digits appear. One kind: 1, 22, 333, 4444, 55555.", "reveal": "5.", "check": "Listed.", "ok": "Case done.", "named": {"9": "666666 is too long: it isn't below 100,000.", "6": "0 can't appear: it would have to appear 0 times."}, "ph": "number or expression", "special": null, "order": false}, {"q": "Case: two kinds of digits. How many such referential numbers are there below 100,000?", "type": "num", "ans": 22, "nudges": ["Which pairs of digits fit in 5 places? (1 and 2 use 3 places, \u2026)", "Pairs: {1,2}, {1,3}, {1,4}, {2,3}.", "Each pair: arrange a word with repeated letters, like 122: 3!/2!."], "hint": "{1,2}: 3!/2! = 3. {1,3}: 4!/3! = 4. {1,4}: 5!/4! = 5. {2,3}: 5!/(2!\u00b73!) = 10.", "reveal": "3 + 4 + 5 + 10 = 22.", "check": "Checked by testing.", "ok": "Subcases add.", "named": {"4": "That's only the number of digit pairs. Count the arrangements of each.", "12": "Don't forget the pair {2, 3}: 22333 uses exactly 5 digits."}, "ph": "number or expression", "special": null, "order": false}, {"q": "How many integers between 0 and 100,000 are referential?", "type": "num", "ans": 27, "nudges": ["Can three kinds of digits fit? 1 + 2 + 3 = 6 places.", "So only steps 1 and 2.", "Add the cases."], "hint": "Three kinds would need at least 1 + 2 + 3 = 6 digits: too many. Add the two cases.", "reveal": "5 + 22 = 27.", "check": "Checked by testing every number below 100,000.", "ok": "Cases add.", "named": {"22": "Add the one-kind case too.", "9": "Count the arrangements, not just the digit sets."}, "ph": "number or expression", "special": null, "order": false}], "story": "<div class=\"story worked\" id=\"story67\" tabindex=\"0\" aria-label=\"Worked answer: Problem Problem 15\" data-plan='[&quot;What could it look like?&quot;, &quot;Each case: first, and then&quot;, &quot;Either, or: add&quot;, &quot;Check a tiny case&quot;]'><div class=\"wbody\"><div class=\"plan-side\" aria-hidden=\"true\"><ol><li data-s=\"1\">What structures might we consider? Make cases where decisions behave differently (like a first digit, which can&#x27;t be 0).<\/li><li data-s=\"2\">Inside each case, break it into steps: first ___, and then ___. Multiply.<\/li><li data-s=\"3\">If the cases are disjoint (non-overlapping), count them separately and add.<\/li><li data-s=\"4\">Check a tiny case you can list.<\/li><\/ol><\/div><div class=\"wmain\"><div class=\"plan-strip\" aria-hidden=\"true\"><span data-s=\"1\">1<\/span><span data-s=\"2\">2<\/span><span data-s=\"3\">3<\/span><span data-s=\"4\">4<\/span><span class=\"stepname\"><\/span><\/div><figure class=\"frame\" data-step=\"1\"><p class=\"ftitle\">1. What could it look like?<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 380 108\" role=\"img\" aria-label=\"structure\" style=\"max-width:551px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"4\" y=\"4\" width=\"372\" height=\"100\" rx=\"10\" class=\"wcard \"/><text x=\"190.0\" y=\"32\" class=\"cardt\" text-anchor=\"middle\">digit d appears exactly d times<\/text><text x=\"190.0\" y=\"58\" class=\"cardt\" text-anchor=\"middle\">0 can never appear<\/text><text x=\"190.0\" y=\"84\" class=\"cardt\" text-anchor=\"middle\">at most 5 digits (below 100,000)<\/text><\/svg><\/div><figcaption><p>What could these numbers look like? Each digit d that appears must appear exactly d times; 0 can&#x27;t appear at all. Below 100,000 the number has at most 5 digits.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"1\"><p class=\"ftitle\">1. What could it look like?<\/p><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>digits used<\/th><th>places needed<\/th><th>fits?<\/th><\/tr><\/thead><tbody><tr><td>one kind: 1, 2, 3, 4, 5<\/td><td>1 to 5<\/td><td>yes<\/td><\/tr><tr><td>1 and 2<\/td><td>3<\/td><td>yes<\/td><\/tr><tr><td>1 and 3<\/td><td>4<\/td><td>yes<\/td><\/tr><tr><td>1 and 4 / 2 and 3<\/td><td>5<\/td><td>yes<\/td><\/tr><tr><td>1, 2 and 3<\/td><td>6<\/td><td>no<\/td><\/tr><tr><td>6 or more<\/td><td>6+<\/td><td>no<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Cases by which digits appear. Three kinds would need 1 + 2 + 3 = 6 places, too many.<\/p><div class=\"ask\"><b>Ask him:<\/b> Why can&#x27;t 1, 2 and 3 all appear?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>case: digits<\/th><th>arrange the word (Week 4&#x27;s repeated letters)<\/th><th>count<\/th><\/tr><\/thead><tbody><tr><td>1 (like 1)<\/td><td>just 1 way<\/td><td>1<\/td><\/tr><tr><td>2 (like 22)<\/td><td>just 1 way<\/td><td>1<\/td><\/tr><tr><td>3 (like 333)<\/td><td>just 1 way<\/td><td>1<\/td><\/tr><tr><td>4 (like 4444)<\/td><td>just 1 way<\/td><td>1<\/td><\/tr><tr><td>5 (like 55555)<\/td><td>just 1 way<\/td><td>1<\/td><\/tr><tr><td>1 and 2 (like 122)<\/td><td>3! \u00f7 (1! \u00b7 2!)<\/td><td>3<\/td><\/tr><tr><td>1 and 3 (like 1333)<\/td><td>4! \u00f7 (1! \u00b7 3!)<\/td><td>4<\/td><\/tr><tr><td>1 and 4 (like 14444)<\/td><td>5! \u00f7 (1! \u00b7 4!)<\/td><td>5<\/td><\/tr><tr><td>2 and 3 (like 22333)<\/td><td>5! \u00f7 (2! \u00b7 3!)<\/td><td>10<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Inside each case, the number is a word with repeated letters: for 1 and 2 it&#x27;s the letters 1, 2, 2, so 3!/2! = 3 numbers (122, 212, 221).<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>case (cases add +)<\/th><th>inside the case (steps multiply \u00d7)<\/th><th>count<\/th><\/tr><\/thead><tbody><tr><td>1 (like 1)<\/td><td>just 1 way<\/td><td>1<\/td><\/tr><tr><td>2 (like 22)<\/td><td>just 1 way<\/td><td>1<\/td><\/tr><tr><td>3 (like 333)<\/td><td>just 1 way<\/td><td>1<\/td><\/tr><tr><td>4 (like 4444)<\/td><td>just 1 way<\/td><td>1<\/td><\/tr><tr><td>5 (like 55555)<\/td><td>just 1 way<\/td><td>1<\/td><\/tr><tr><td>1 and 2 (like 122)<\/td><td>3! \u00f7 (1! \u00b7 2!)<\/td><td>3<\/td><\/tr><tr><td>1 and 3 (like 1333)<\/td><td>4! \u00f7 (1! \u00b7 3!)<\/td><td>4<\/td><\/tr><tr><td>1 and 4 (like 14444)<\/td><td>5! \u00f7 (1! \u00b7 4!)<\/td><td>5<\/td><\/tr><tr><td>2 and 3 (like 22333)<\/td><td>5! \u00f7 (2! \u00b7 3!)<\/td><td>10<\/td><\/tr><tr class=\"hl\"><td>total (add the cases)<\/td><td>1 + 1 + 1 + 1 + 1 + 3 + 4 + 5 + 10<\/td><td>27<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Every Week 5 problem has the same shape: split into cases, multiply inside each case, add the cases.<\/p><div class=\"ask\"><b>Ask him:<\/b> Which numbers are multiplied, and which are added? Why?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 397 70\" role=\"img\" aria-label=\"add\" style=\"max-width:576px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"25.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">5<\/text><text x=\"64.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">+<\/text><rect x=\"88\" y=\"16\" width=\"200\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"188.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">3 + 4 + 5 + 10<\/text><text x=\"311.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"335\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"357.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">27<\/text><\/svg><\/div><figcaption><p>One kind of digit: 5 numbers. Two kinds: 3 + 4 + 5 + 10 = 22. Add the cases: 27.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"4\"><p class=\"ftitle\">4. Check a tiny case<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 448 94\" role=\"img\" aria-label=\"list\" style=\"max-width:650px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"6\" width=\"56\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"36.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">1<\/text><rect x=\"70\" y=\"6\" width=\"56\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"98.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">22<\/text><rect x=\"132\" y=\"6\" width=\"56\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"160.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">122<\/text><rect x=\"194\" y=\"6\" width=\"56\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"222.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">212<\/text><rect x=\"256\" y=\"6\" width=\"56\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"284.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">221<\/text><rect x=\"318\" y=\"6\" width=\"56\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"346.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">333<\/text><rect x=\"380\" y=\"6\" width=\"56\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"408.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">1333<\/text><rect x=\"8\" y=\"36\" width=\"56\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"36.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">3133<\/text><rect x=\"70\" y=\"36\" width=\"56\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"98.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">3313<\/text><rect x=\"132\" y=\"36\" width=\"56\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"160.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">3331<\/text><rect x=\"194\" y=\"36\" width=\"56\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"222.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">4444<\/text><text x=\"224.0\" y=\"88\" class=\"cap\" text-anchor=\"middle\">all referential numbers with up to 4 digits<\/text><\/svg><\/div><figcaption><p>Check: here are the ones with up to 4 digits; testing every number below 100,000 finds 27 in all.<\/p><\/figcaption><\/figure><\/div><\/div><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><input type=\"checkbox\" class=\"showall\"> Show all steps<\/label><\/div><\/div>", "answer": "27", "check": "5 one-kind + 22 two-kind (repeated-letter words) = 27; brute force agrees.", "concept": "w5rules", "inclass": null, "above": true, "note": null, "figure": null}, {"id": "ps5_16", "label": "Problem Problem 16", "section": "Problem solving", "text": "(2006 MATHCOUNTS) In a round-robin chess tournament every player plays one game with every other player. Five participants withdrew after playing two games each. None of these players played a game against each other. A total of 220 games were played in the tournament. Including those who withdrew, how many players participated?", "steps": [{"q": "Case 1: games that a withdrawn player played in. How many?", "type": "num", "ans": 10, "nudges": ["Each of the 5 played 2 games.", "Could one game be counted twice (two withdrawn players in it)?", "Multiply."], "hint": "Make cases: every game either has a withdrawn player in it, or it doesn't. Case 1: 5 players \u00d7 2 games, and no game had two of them.", "reveal": "5 \u00b7 2 = 10.", "check": "From the problem.", "ok": "Case 1 done.", "named": {"5": "Each of the 5 played 2 games.", "20": "Each game has only one withdrawn player, so nothing is counted twice."}, "ph": "number or expression", "special": null, "order": false}, {"q": "Case 2: games among the players who stayed. How many?", "type": "num", "ans": 210, "nudges": ["Every game is in case 1 or case 2, and the cases add to 220.", "220 \u2212 case 1.", "Subtract."], "hint": "Every game is in case 1 or case 2, and the cases add up to 220: take away case 1.", "reveal": "210.", "check": "220 \u2212 10 = 210.", "ok": "Case 2 done.", "named": {"230": "The cases add up to 220, so subtract."}, "ph": "number or expression", "special": null, "order": false}, {"q": "How many players stayed for the whole round robin?", "type": "num", "ans": 21, "nudges": ["Among n players, every pair plays once: nC2 games.", "n(n \u2212 1) \u00f7 2 = 210, so n(n \u2212 1) = 420.", "Two numbers in a row that multiply to 420."], "hint": "Find n with nC2 = 210: two numbers in a row that multiply to 420.", "reveal": "21.", "check": "21C2 = 210.", "ok": "Stayers done.", "named": {"20": "n(n \u2212 1) = 420: n is the bigger of the two numbers in a row.", "210": "That's the number of games, not players."}, "ph": "number or expression", "special": null, "order": false}, {"q": "Including those who withdrew, how many players participated?", "type": "num", "ans": 26, "nudges": ["Stayers + the ones who withdrew.", "Use step 3.", "Add."], "hint": "Add the two kinds of players.", "reveal": "21 + 5 = 26.", "check": "26 players.", "ok": "Done.", "named": {"21": "Add the 5 who withdrew.", "22": "Five players withdrew, not one."}, "ph": "number or expression", "special": null, "order": false}], "story": "<div class=\"story worked\" id=\"story68\" tabindex=\"0\" aria-label=\"Worked answer: Problem Problem 16\" data-plan='[&quot;What could it look like?&quot;, &quot;Each case: first, and then&quot;, &quot;Either, or: add&quot;, &quot;Check a tiny case&quot;]'><div class=\"wbody\"><div class=\"plan-side\" aria-hidden=\"true\"><ol><li data-s=\"1\">What structures might we consider? Make cases where decisions behave differently (like a first digit, which can&#x27;t be 0).<\/li><li data-s=\"2\">Inside each case, break it into steps: first ___, and then ___. Multiply.<\/li><li data-s=\"3\">If the cases are disjoint (non-overlapping), count them separately and add.<\/li><li data-s=\"4\">Check a tiny case you can list.<\/li><\/ol><\/div><div class=\"wmain\"><div class=\"plan-strip\" aria-hidden=\"true\"><span data-s=\"1\">1<\/span><span data-s=\"2\">2<\/span><span data-s=\"3\">3<\/span><span data-s=\"4\">4<\/span><span class=\"stepname\"><\/span><\/div><figure class=\"frame\" data-step=\"1\"><p class=\"ftitle\">1. What could it look like?<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 504 82\" role=\"img\" aria-label=\"structure\" style=\"max-width:731px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"4\" y=\"4\" width=\"496\" height=\"74\" rx=\"10\" class=\"wcard \"/><text x=\"252.0\" y=\"32\" class=\"cardt\" text-anchor=\"middle\">every game has a withdrawn player in it, or it doesn&#x27;t<\/text><text x=\"252.0\" y=\"58\" class=\"cardt\" text-anchor=\"middle\">\u2192 two disjoint cases that add to 220<\/text><\/svg><\/div><figcaption><p>What could the games look like? Each game either involves one of the 5 who withdrew, or it&#x27;s between two players who stayed. Two disjoint cases.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 202 70\" role=\"img\" aria-label=\"case 1\" style=\"max-width:293px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"83\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"51.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">5 \u00d7 2<\/text><text x=\"116.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"140\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"162.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">10<\/text><\/svg><\/div><figcaption><p>Case 1: the 5 withdrawn players each played 2 games, never against each other: 10 games.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 280 70\" role=\"img\" aria-label=\"case 2\" style=\"max-width:406px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"38.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">220<\/text><text x=\"90.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">\u2212<\/text><rect x=\"114\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"136.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">10<\/text><text x=\"181.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"205\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"233.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">210<\/text><\/svg><\/div><figcaption><p>Case 2: the games among the stayers. The cases add to 220, so 220 \u2212 10 = 210.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 449 70\" role=\"img\" aria-label=\"stayers\" style=\"max-width:651px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"174\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"97.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">n(n \u2212 1) \u00f7 2<\/text><text x=\"207.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"231\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"259.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">210<\/text><text x=\"311.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">\u2192<\/text><rect x=\"335\" y=\"16\" width=\"96\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"383.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">n = 21<\/text><\/svg><\/div><figcaption><p>Among n stayers every pair played: nC2 = n(n \u2212 1) \u00f7 2 = 210, so n(n \u2212 1) = 420 = 21 \u00b7 20: n = 21.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>case (cases add +)<\/th><th>inside the case (steps multiply \u00d7)<\/th><th>count<\/th><\/tr><\/thead><tbody><tr><td>games with a withdrawn player<\/td><td>5 \u00d7 2<\/td><td>10<\/td><\/tr><tr><td>games among the 21 stayers<\/td><td>21C2<\/td><td>210<\/td><\/tr><tr class=\"hl\"><td>total (add the cases)<\/td><td>10 + 210<\/td><td>220<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Every Week 5 problem has the same shape: split into cases, multiply inside each case, add the cases.<\/p><div class=\"ask\"><b>Ask him:<\/b> Which numbers are multiplied, and which are added? Why?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 241 70\" role=\"img\" aria-label=\"players\" style=\"max-width:349px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"32.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">21<\/text><text x=\"77.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">+<\/text><rect x=\"101\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"116.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">5<\/text><text x=\"155.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"179\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"201.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">26<\/text><\/svg><\/div><figcaption><p>Players: 21 who stayed + 5 who withdrew = 26.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"4\"><p class=\"ftitle\">4. Check a tiny case<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 308 94\" role=\"img\" aria-label=\"list\" style=\"max-width:447px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"6\" width=\"92\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"54.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">PPLL \u2192 AB<\/text><rect x=\"106\" y=\"6\" width=\"92\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"152.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">PLPL \u2192 AC<\/text><rect x=\"204\" y=\"6\" width=\"92\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"250.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">PLLP \u2192 AD<\/text><rect x=\"8\" y=\"36\" width=\"92\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"54.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">LPPL \u2192 BC<\/text><rect x=\"106\" y=\"36\" width=\"92\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"152.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">LPLP \u2192 BD<\/text><rect x=\"204\" y=\"36\" width=\"92\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"250.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">LLPP \u2192 CD<\/text><text x=\"154.0\" y=\"88\" class=\"cap\" text-anchor=\"middle\">4 players: 4C2 = 6 games<\/text><\/svg><\/div><figcaption><p>Tiny case: a round robin of 4 players has 4C2 = 6 games, listed.<\/p><\/figcaption><\/figure><\/div><\/div><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><input type=\"checkbox\" class=\"showall\"> Show all steps<\/label><\/div><\/div>", "answer": "26", "check": "Cases: 10 games with a withdrawn player + 21C2 = 210 among stayers = 220; 21 + 5 = 26.", "concept": "w5rules", "inclass": null, "above": false, "note": null, "figure": null}], "concepts": {"w5rules": "<h2>The Week 5 rules<\/h2><div class=\"eq\" role=\"math\">total = (case 1) + (case 2) + \u2026<\/div><div class=\"prop\"><p class=\"prop-h\">The addition rule<\/p><p>If a count can be split into <b>disjoint<\/b> (non-overlapping) cases, we count the cases separately and add.<\/p><\/div><div class=\"prop\"><p class=\"prop-h\">How to choose the cases<\/p><p>\u201cCases should be made based on the idea that some cases behave differently: some decisions affect the count differently than others.\u201d<\/p><\/div><div class=\"prop\"><p class=\"prop-h\">Complementary counting<\/p><p>Count you want = Total \u2212 the complement (the opposite). \u201cAt least one\u201d \u2192 its complement is \u201cnone\u201d. We can adjust the total as long as we are looking at a total containing the desired count.<\/p><\/div><table class=\"ptable \"><thead><tr><th>you can say\u2026<\/th><th>it means<\/th><th>so you\u2026<\/th><\/tr><\/thead><tbody><tr><td>\u201cfirst ___, and then ___\u201d<\/td><td>steps, one after another<\/td><td>multiply<\/td><\/tr><tr><td>\u201c___ and ___\u201d (both happen)<\/td><td>steps<\/td><td>multiply<\/td><\/tr><tr><td>\u201ceither ___ or ___\u201d<\/td><td>cases, only one happens<\/td><td>add<\/td><\/tr><tr><td>\u201cat least one of each\u201d<\/td><td>split into cases<\/td><td>add the cases<\/td><\/tr><\/tbody><\/table>"}}</script>
