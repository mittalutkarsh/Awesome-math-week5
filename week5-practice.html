<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Week 5 practice: Problem Set 5 · Week 5: and, or</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Kalam:wght@400;700&display=swap" rel="stylesheet"><style>
/* Math notebook: graph-paper ground, navy fountain-pen ink, a yellow highlighter, a red correction pen.
   Two typefaces: Atkinson Hyperlegible (text, built for young readers) and Kalam (the handwritten voice). */
:root{
  --paper:#FBFCFE; --sheet:#FFFFFF; --rule:#DCE5F2; --rule2:#C9D6EA;
  --ink:#1C2A4A; --pencil:#5E6A82; --faint:#8E99AE;
  --hl:#FFE45E; --hl-soft:#FFF4B8; --red:#C23A2E; --green:#1E7A50; --blue:#2D6BD0;
  --p1:#2D6BD0; --p2:#D98A00; --p3:#7B4CC0; --p4:#1E7A50; --p5:#138A8A; --p6:#C2407A;
  --console:#14223F; --console-ink:#DDE6F6;
  --hand:"Kalam","Comic Neue","Segoe Print",cursive;
  --text:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-sm:5px; --r-md:9px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.55}
body.reading{background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);
  background-size:26px 26px;background-attachment:local}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:3px}
h1,h2,h3{font-family:var(--hand);font-weight:700;line-height:1.15;color:var(--ink);margin:0 0 .4em}
h1{font-size:2.5rem}
h2{font-size:1.9rem}
h3{font-size:1.4rem}
.hl{background:linear-gradient(transparent 55%,var(--hl) 55%,var(--hl) 92%,transparent 92%)}
button{font:inherit;cursor:pointer}
.btn{border:1.5px solid var(--ink);background:var(--sheet);color:var(--ink);border-radius:var(--r-sm);padding:.35em .8em;font-size:.95rem}
.btn:hover{background:var(--hl-soft)}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover{background:#2B3E68}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.warn{border-color:var(--red);color:var(--red)}
kbd{font-family:var(--text);border:1px solid var(--rule2);border-bottom-width:2px;border-radius:4px;padding:0 .3em;font-size:.85em}

/* ---------- equations ---------- */
.eq{font-size:1.35rem;text-align:center;padding:.7em .6em;margin:.2em 0 1em;border-left:4px solid var(--ink);
  background:var(--sheet);display:flex;flex-wrap:wrap;gap:.35em;align-items:center;justify-content:center}
.frac{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 .15em}
.frac>span:first-child{border-bottom:1.5px solid var(--ink);padding:0 .25em}
.frac>span:last-child{padding:0 .25em}
.binom{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;padding:0 .35em;position:relative;line-height:1.1}
.binom::before,.binom::after{content:"";position:absolute;top:0;bottom:0;width:.35em;border:1.5px solid var(--ink)}
.binom::before{left:0;border-right:none;border-radius:.6em 0 0 .6em}
.binom::after{right:0;border-left:none;border-radius:0 .6em .6em 0}
.eqnote{font-size:.85rem;color:var(--pencil)}

/* ---------- SVG pictures ---------- */
svg.pic{width:100%;height:auto;max-height:340px;display:block;margin:0 auto;font-family:var(--text);overflow:visible}
.pic .t,.pic .cap{fill:var(--pencil);font-size:12px}
.pic .vert{writing-mode:tb}
.pic .chip{fill:#fff;stroke:var(--ink);stroke-width:1.3}
.pic .chip.picked{fill:var(--hl);stroke:var(--ink)}
.pic .chip.used{fill:#EEF1F6;stroke:#B6BECC}
.pic .chip.banned{fill:#FBE9E7;stroke:var(--red)}
.pic .chiptxt{fill:var(--ink);font-size:13px;font-weight:700}
.pic .chiptxt.used{fill:#9AA4B5}
.pic .strike{stroke-width:2;stroke-linecap:round}
.pic .strike.used{stroke:#9AA4B5}
.pic .strike.banned{stroke:var(--red)}
.pic .strike.big{stroke-width:3.5;opacity:.85}
.pic .sub{font-size:9px}
.pic .chip.p1,.pic .tile.p1{fill:#E1ECFC;stroke:var(--p1)}
.pic .chip.p2,.pic .tile.p2{fill:#FCEFD6;stroke:var(--p2)}
.pic .chip.p3,.pic .tile.p3{fill:#ECE3F8;stroke:var(--p3)}
.pic .chip.p4,.pic .tile.p4{fill:#DEF1E7;stroke:var(--p4)}
.pic .chip.p5,.pic .tile.p5{fill:#DAF0F0;stroke:var(--p5)}
.pic .chip.p6,.pic .tile.p6{fill:#F8E1EB;stroke:var(--p6)}
.pic .tile{fill:#fff;stroke:var(--ink);stroke-width:1.4}
.pic .tile.real{fill:var(--hl)}
.pic .tile.pl{fill:#F1F3F7;stroke:#9AA4B5}
.pic .tilet{fill:var(--ink);font-size:16px;font-weight:700}
.pic .tilet.sm{font-size:13px}
.pic .slot{fill:#fff;stroke:var(--ink);stroke-width:1.6}
.pic .slot.fixed{fill:#FCEFD6;stroke:var(--p2);stroke-width:2}
.pic .result{fill:var(--hl);stroke:var(--ink);stroke-width:1.6}
.pic .fracline{stroke:var(--ink);stroke-width:1.6}
.pic .numbox{fill:#fff;stroke:var(--ink);stroke-width:1.2}
.pic .slotlab{fill:var(--pencil);font-size:12px}
.pic .slotn,.pic .calcn{fill:var(--ink);font-size:20px;font-weight:700}
.pic .op{fill:var(--ink);font-size:22px;font-weight:700}
.pic .op.big{font-size:30px}
.pic .card{fill:#fff;stroke:var(--rule2)}
.pic .arrow{stroke:var(--ink);stroke-width:2;fill:none}
.pic .ahead{fill:var(--ink)}
.pic .groupbox{fill:var(--hl-soft);stroke:var(--ink);stroke-width:1.6}
.pic .groupt{fill:var(--ink);font-size:17px;font-weight:700}
.pic .pg-cell{fill:#fff;stroke:var(--rule2);stroke-width:1}
.pic .pg-cell.diag{fill:#FBE9E7}
.pic .pg-cell.lower{fill:#EEF1F6}
.pic .pg-cell.hl,.pic .pg-cell.twin-lit{fill:var(--hl);stroke:var(--ink)}
.pic .pg-cell:hover{stroke:var(--ink);stroke-width:2}
.pic .pgt{fill:var(--ink);pointer-events:none}
.pic .pgt.dim{fill:#9AA4B5}
.pic .gridlab{fill:var(--ink);font-size:13px;font-weight:700}
.pic .edge{stroke:var(--pencil);stroke-width:1.3}
.pic .tnode{fill:#fff;stroke:var(--rule2)}
.pic .nodet{fill:var(--ink);font-size:12px;font-weight:700}
.pic .node.root{fill:var(--ink)}
.pic .rowhl{fill:var(--hl-soft)}
.pic .brace{fill:none;stroke:var(--ink);stroke-width:1.6}
.pic .seg{stroke:var(--faint);stroke-width:1.6}
.pic .seg.hl{stroke:var(--blue);stroke-width:4;stroke-linecap:round;opacity:.85}
.pic .seg.hl2{stroke:var(--p2);stroke-width:4;stroke-linecap:round;opacity:.8}
.pic .dot{fill:var(--ink)}
.pic .dotlab{fill:var(--ink);font-size:13px;font-weight:700}
.pic .gl{stroke:var(--rule2);stroke-width:1.3}
.pic .gl.hlv{stroke:var(--blue);stroke-width:3.5}
.pic .gl.hlh{stroke:var(--green);stroke-width:3.5}
.pic .numv{fill:var(--blue);font-weight:700}
.pic .numh{fill:var(--green);font-weight:700}
.pic .shade{fill:var(--hl);opacity:.6}
.pic .path{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.pic .path.leg1{stroke:var(--blue)}
.pic .path.leg2{stroke:var(--p2);stroke-dasharray:7 4}
.pic .bag{fill:#F4F7FC;stroke:var(--ink);stroke-width:1.5}
.pic .oval{fill:none;stroke:var(--hl);stroke-width:8;opacity:.9}
.pic .oval.diff{stroke:#F2C2BC}
.pic .lcell{fill:#fff;stroke:var(--rule2)}
.pic .lcell.hl{fill:var(--hl)}
.pic .lt{fill:var(--ink);font-size:13px;font-weight:700}
.pic .wcard{fill:#fff;stroke:var(--ink);stroke-width:1.4}
.pic .wcard.skip{fill:#F3F5F9;stroke:#B6BECC;stroke-dasharray:5 4}
.pic .cardt{fill:var(--ink);font-size:15px}
.pic .coin.gold{fill:#F7D774;stroke:#9A7400}
.pic .coin.silver{fill:#E3E7EE;stroke:#7D8696}
.pic .coint{fill:var(--ink);font-size:11px;font-weight:700}
.pic .badring{fill:none;stroke:var(--red);stroke-width:2.5}
.pic .state{fill:#fff;stroke:var(--rule2)}
.pic .state.picked{fill:var(--hl-soft);stroke:var(--ink)}
.pic .person{fill:var(--hl-soft);stroke:var(--ink)}
.pic .persont{fill:var(--ink);font-weight:700;font-size:13px}
.hstack{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%}
.hstack>svg.pic{width:100%;flex:1 1 200px;min-width:0}
.vstack{display:flex;flex-direction:column;gap:8px;align-items:center;width:100%}
.vstack>svg.pic{width:100%}
.ptable{border-collapse:collapse;margin:0 auto;font-size:.92rem;background:#fff}
.ptable th,.ptable td{border:1px solid var(--rule2);padding:.25em .6em;text-align:center}
.ptable th{background:#EEF3FA;font-weight:700}
.ptable tr.hl td{background:var(--hl-soft);font-weight:700}

/* ---------- story component ---------- */
.story{container-type:inline-size;background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--r-md);padding:.8rem;margin:.6rem 0 1.2rem}
.story:focus-visible{outline:3px solid var(--blue)}
.story .frame{display:none;margin:0}
.story .frame.on{display:block}
.story.all .frame{display:block;border-bottom:1px dashed var(--rule2);padding-bottom:.8rem;margin-bottom:.8rem}
.frame .pic-wrap{min-height:80px;display:flex;align-items:center;justify-content:center;overflow-x:auto}
.frame figcaption{margin-top:.5rem}
.frame figcaption p{margin:.2em 0}
.frame .ftitle{font-family:var(--hand);font-size:1.15rem;margin:0 0 .3rem}
.frame.skip .ftitle{text-decoration:line-through;color:var(--faint)}
.frame.skip figcaption p{color:var(--pencil)}
.ask{margin-top:.5rem;padding:.4rem .7rem;border-left:4px solid var(--hl);background:#FFFBE6;font-size:.95rem}
.ask b{font-family:var(--hand)}
.story-ctl{display:flex;align-items:center;gap:.6rem;margin-top:.6rem;flex-wrap:wrap}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots button{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--ink);background:#fff;padding:0}
.dots button.on{background:var(--ink)}
.dots button.seen{background:var(--rule2)}
.story-ctl label{font-size:.9rem;color:var(--pencil);margin-left:auto}
.story.all .story-ctl .nav{visibility:hidden}

/* plan-guided: flowchart beside picture on wide containers, step strip on narrow */
.wbody{display:block}
.plan-side{display:none}
.plan-strip{display:flex;gap:4px;align-items:center;margin-bottom:.6rem;flex-wrap:wrap}
.plan-strip span{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--rule2);display:inline-flex;align-items:center;justify-content:center;
  font-weight:700;font-size:.85rem;color:var(--pencil)}
.plan-strip span.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.plan-strip span.skipd{text-decoration:line-through}
.plan-strip .stepname{font-family:var(--hand);font-size:1.1rem;color:var(--ink);margin-left:.4rem;width:auto;height:auto;border:none;justify-content:flex-start}
@container (min-width:680px){
  .wbody{display:grid;grid-template-columns:215px 1fr;gap:1rem}
  .plan-side{display:block}
  .plan-strip{display:none}
}
.plan-side ol{list-style:none;margin:0;padding:0;counter-reset:pl}
.plan-side li{counter-increment:pl;padding:.35rem .5rem .35rem 2.1rem;position:relative;font-size:.9rem;color:var(--pencil);border-radius:6px;margin-bottom:3px}
.plan-side li::before{content:counter(pl);position:absolute;left:.4rem;top:.3rem;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--rule2);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem}
.plan-side li.on{background:var(--hl);color:var(--ink);font-weight:700}
.plan-side li.on::before{background:var(--ink);color:#fff;border-color:var(--ink)}
.plan-side li.skipd{text-decoration:line-through}
.plan-side li+li::after{content:"";position:absolute;left:1.05rem;top:-4px;height:5px;border-left:1.5px solid var(--rule2)}

/* ---------- reading pages ---------- */
.page{max-width:1180px;margin:0 auto;padding:1.4rem 1.2rem 4rem;display:grid;grid-template-columns:230px minmax(0,1fr);gap:2rem}
.toc{position:sticky;top:1rem;align-self:start;max-height:calc(100vh - 2rem);overflow:auto;font-size:.92rem;background:var(--sheet);
  border:1.5px solid var(--ink);border-radius:var(--r-md);padding:.8rem}
.toc a{display:block;text-decoration:none;color:var(--ink);padding:.15rem .3rem;border-radius:4px}
.toc a:hover{background:var(--hl-soft)}
.toc .sub{padding-left:1rem;font-size:.86rem;color:var(--pencil)}
main.reading-main{min-width:0}
.sheet{background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--r-md);padding:1.3rem 1.4rem;margin-bottom:1.6rem}
.sheet>p,.sheet li{max-width:72ch}
.idea{font-size:1.1rem;font-weight:700}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin:.6rem 0}
.chips a{border:1.5px solid var(--ink);border-radius:999px;padding:.1rem .7rem;text-decoration:none;color:var(--ink);font-size:.9rem;background:#fff}
.chips a:hover{background:var(--hl)}
.prop{border:2px solid #8F84E0;background:#EEEBFC;border-radius:var(--r-md);padding:.6rem .9rem;margin:.4rem 0 1rem}
.prop p{margin:.2rem 0}
.prop-h{font-family:var(--hand);font-weight:700;color:#4B3FA8}
.fromclass{border-left:4px solid var(--blue);background:#F1F6FE;padding:.6rem .8rem;margin:.8rem 0;font-size:.95rem}
.fromclass b{font-family:var(--hand)}
.traps{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem;padding:0;list-style:none}
.traps li{background:#fff;border:1.5px solid var(--ink);border-radius:var(--r-md);padding:.7rem .9rem;max-width:none}
.traps .wrong{color:var(--red);font-weight:700;text-decoration:line-through;text-decoration-thickness:2px}
.cheat{width:100%;border-collapse:collapse}
.cheat td,.cheat th{border:1px solid var(--rule2);padding:.4rem .6rem;vertical-align:top;text-align:left}
.cheat th{background:#EEF3FA}
dl.gloss dt{font-weight:700;margin-top:.6rem}
dl.gloss dd{margin:0 0 0 1rem;max-width:70ch}
.site-head{display:flex;align-items:baseline;gap:1.2rem;flex-wrap:wrap;padding:1rem 1.2rem 0;max-width:1180px;margin:0 auto}
.site-head nav a{margin-right:1rem}
.lede{font-size:1.15rem;max-width:62ch}

/* ---------- workbench ---------- */
body.bench{height:100vh;overflow:hidden;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:.6rem;padding:.45rem .8rem;border-bottom:1.5px solid var(--ink);background:var(--sheet);flex-wrap:wrap}
.topbar .brand{font-family:var(--hand);font-weight:700;font-size:1.25rem;margin-right:.4rem}
.topbar select{font:inherit;font-size:.92rem;padding:.25rem;border:1.5px solid var(--ink);border-radius:var(--r-sm);max-width:280px}
.topbar .meta{font-size:.9rem;color:var(--pencil);display:flex;gap:1rem;align-items:center}
.topbar .links{margin-left:auto;display:flex;gap:.8rem;font-size:.92rem}
.benchgrid{flex:1;min-height:0;display:grid;grid-template-columns:200px minmax(0,1fr) minmax(360px,430px)}
.rail{border-right:1.5px solid var(--ink);overflow:auto;padding:.5rem;background:var(--paper)}
.rail h4{font-family:var(--hand);font-size:1.05rem;margin:.6rem 0 .2rem}
.rail button{display:flex;align-items:center;gap:.5rem;width:100%;text-align:left;border:none;background:none;padding:.25rem .4rem;border-radius:5px;font-size:.92rem;color:var(--ink)}
.rail button:hover{background:var(--hl-soft)}
.rail button.cur{background:var(--hl);font-weight:700}
.sdot{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--pencil);flex:none}
.sdot.prog{background:linear-gradient(90deg,var(--blue) 50%,#fff 50%);border-color:var(--blue)}
.sdot.closed{background:var(--green);border-color:var(--green)}
.middle{overflow:auto;padding:0 1rem 1rem;background:var(--paper)}
.tabs{display:flex;gap:.2rem;position:sticky;top:0;background:var(--paper);padding-top:.5rem;z-index:2;border-bottom:1.5px solid var(--ink)}
.tabs button{border:1.5px solid var(--ink);border-bottom:none;border-radius:7px 7px 0 0;background:#EEF3FA;padding:.3rem .9rem;margin-bottom:-1.5px;font-size:.95rem}
.tabs button[aria-selected="true"]{background:var(--sheet);font-weight:700}
.tabpanel{padding-top:.8rem}
.ptext{font-size:1.08rem;background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--r-md);padding:.8rem 1rem}
.pfig{max-width:380px;margin:.8rem auto 0}
.pfig svg.pic{max-height:300px}
.pfig .pic .gl{stroke:var(--ink);stroke-width:1.2}
.pnote{font-size:.9rem;color:var(--pencil);margin:.5rem 0}
.inclass{display:inline-block;font-size:.85rem;border:1px solid var(--blue);color:var(--blue);border-radius:999px;padding:0 .6rem;margin-right:.4rem}
.above{display:inline-block;font-size:.85rem;border:1px solid var(--p3);color:var(--p3);border-radius:999px;padding:0 .6rem}
.verified{margin-top:1rem;border:2px solid var(--green);border-radius:var(--r-md);background:#F2FAF5;padding:.8rem 1rem}
.verified h3{color:var(--green)}
.right{border-left:1.5px solid var(--ink);display:flex;flex-direction:column;min-height:0;background:var(--sheet)}
.rscroll{overflow:auto;padding:.7rem .8rem;flex:1;min-height:0}
.pills{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:.5rem}
.pills button{border:1.5px solid var(--ink);border-radius:999px;background:#fff;padding:.05rem .65rem;font-size:.88rem}
.pills button.cur{outline:3px solid var(--hl);outline-offset:1px;font-weight:700}
.pills button.ok{background:#DDF1E5;border-color:var(--green)}
.pills button.handed{background:#FBE9E7;border-color:var(--red)}
.pills button.tried{background:#EEF3FA}
.stepq{font-weight:700;margin:.2rem 0 .5rem}
.editor{display:flex;border:1.5px solid var(--ink);border-radius:var(--r-sm);height:140px;background:#fff;
  background-image:linear-gradient(transparent 23px,var(--rule) 23px);background-size:100% 24px;background-position:0 6px}
.gutter{width:2.2rem;text-align:right;padding:6px .35rem 0 0;color:var(--faint);font-size:.85rem;line-height:24px;overflow:hidden;border-right:1px solid var(--rule2);user-select:none}
.editor textarea{flex:1;border:none;resize:none;padding:6px .5rem 0;font:inherit;font-size:.95rem;line-height:24px;background:transparent;color:var(--ink);font-family:var(--hand)}
.editor textarea:focus{outline:none}
.editor:focus-within{outline:3px solid var(--blue);outline-offset:1px}
.ansrow{display:flex;gap:.4rem;margin:.6rem 0}
.ansrow input{flex:1;font:inherit;padding:.35rem .5rem;border:1.5px solid var(--ink);border-radius:var(--r-sm);min-width:0}
.btnrow{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.5rem}
.console{background:var(--console);color:var(--console-ink);font-size:.86rem;padding:.6rem .7rem;height:170px;overflow:auto;border-top:1.5px solid var(--ink);flex:none}
.console div{margin-bottom:.3rem;line-height:1.4}
.console .ok{color:#8BE0AC}
.console .bad{color:#FFB3A8}
.console .info{color:#A9C3F0}
.console .hand{color:#FFE45E}
.console .ts{color:#6F84AD;margin-right:.4rem}
.dialog-back{position:fixed;inset:0;background:rgba(28,42,74,.35);display:none;align-items:center;justify-content:center;z-index:50}
.dialog-back.open{display:flex}
.dialog{background:var(--sheet);border:2px solid var(--ink);border-radius:var(--r-md);max-width:460px;padding:1rem 1.2rem;margin:1rem}
.dialog h3{margin-top:0}
.confirm-note{font-size:.88rem;color:var(--red);margin:.3rem 0}
.rules{background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--r-md);padding:.8rem 1rem}
.rules ol{padding-left:1.3rem;margin:.3rem 0}
.mysteps .ms{background:var(--sheet);border:1px solid var(--rule2);border-radius:var(--r-sm);padding:.5rem .7rem;margin-bottom:.5rem}
.mysteps pre{white-space:pre-wrap;font-family:var(--hand);margin:.3rem 0;font-size:.95rem}
.railtoggle{display:none}

/* ---------- pen ---------- */
.pen-canvas{position:fixed;inset:0;pointer-events:none;z-index:40}
.pen-canvas.active{pointer-events:auto;cursor:crosshair}
.pen-canvas.active.touchpass{touch-action:pan-x pan-y pinch-zoom}
.pen-canvas.active.swallow{touch-action:none}
.pen-bar{position:fixed;right:12px;bottom:12px;z-index:45;background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--r-md);
  padding:.35rem;display:flex;gap:.25rem;align-items:center;flex-wrap:wrap;max-width:calc(100vw - 24px);box-shadow:0 2px 0 var(--ink)}

xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"25.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">2<\/text><text x=\"64.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><rect x=\"88\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"103.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">8<\/text><text x=\"142.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><rect x=\"166\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"181.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">9<\/text><text x=\"220.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"244\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"272.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">144<\/text><\/svg><\/div><figcaption><p>Case B: first, which of the 2 other places holds the 5 (2). And then the first digit: not 5 and not 0 (8). And then the remaining digit: not 5 (9). 2 \u00d7 8 \u00d7 9 = 144.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>case (cases add +)<\/th><th>inside the case: first, and then (steps multiply \u00d7)<\/th><th>count<\/th><\/tr><\/thead><tbody><tr><td>the 5 is first<\/td><td>9 \u00d7 9<\/td><td>81<\/td><\/tr><tr><td>the 5 is somewhere else<\/td><td>2 \u00d7 8 \u00d7 9<\/td><td>144<\/td><\/tr><tr class=\"hl\"><td>total (add the cases)<\/td><td>81 + 144<\/td><td>225<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>The shape of every Week 5 problem: split it into cases, multiply the steps inside each case (\u201cfirst ___, and then ___\u201d), then add the cases (\u201ceither ___ or ___\u201d). Here: 2 cases, each one a multiplication, added together.<\/p><div class=\"ask\"><b>Ask him:<\/b> Which numbers here are multiplied, and which are added? Why?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 280 70\" role=\"img\" aria-label=\"add\" style=\"max-width:406px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"32.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">81<\/text><text x=\"77.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">+<\/text><rect x=\"101\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"129.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">144<\/text><text x=\"181.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"205\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"233.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">225<\/text><\/svg><\/div><figcaption><p>Disjoint cases, so add: 81 + 144 = 225.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"4\"><p class=\"ftitle\">4. Check a tiny case<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 314 102\" role=\"img\" aria-label=\"list\" style=\"max-width:455px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"6\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"30.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">15<\/text><rect x=\"58\" y=\"6\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"80.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">25<\/text><rect x=\"108\" y=\"6\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"130.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">35<\/text><rect x=\"158\" y=\"6\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"180.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">45<\/text><rect x=\"208\" y=\"6\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"230.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">50<\/text><rect x=\"258\" y=\"6\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"280.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">51<\/text><rect x=\"8\" y=\"36\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"30.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">52<\/text><rect x=\"58\" y=\"36\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"80.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">53<\/text><rect x=\"108\" y=\"36\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"130.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">54<\/text><rect x=\"158\" y=\"36\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"180.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">56<\/text><rect x=\"208\" y=\"36\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"230.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">57<\/text><rect x=\"258\" y=\"36\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"280.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">58<\/text><rect x=\"8\" y=\"66\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"30.0\" y=\"83\" class=\"lt\" text-anchor=\"middle\">59<\/text><rect x=\"58\" y=\"66\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"80.0\" y=\"83\" class=\"lt\" text-anchor=\"middle\">65<\/text><rect x=\"108\" y=\"66\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"130.0\" y=\"83\" class=\"lt\" text-anchor=\"middle\">75<\/text><rect x=\"158\" y=\"66\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"180.0\" y=\"83\" class=\"lt\" text-anchor=\"middle\">85<\/text><rect x=\"208\" y=\"66\" width=\"44\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"230.0\" y=\"83\" class=\"lt\" text-anchor=\"middle\">95<\/text><\/svg><\/div><figcaption><p>Tiny case: two-digit numbers with exactly one 5: 9 with the 5 first, 8 with the 5 second. 17, and the list has 17.<\/p><\/figcaption><\/figure><\/div><\/div><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><input type=\"checkbox\" class=\"showall\"> Show all steps<\/label><\/div><\/div>", "answer": "225", "check": "81 + 144 = 225; checked over all 900 three-digit numbers.", "concept": "w5rules", "inclass": null, "above": false, "note": null, "figure": null}, {"id": "ps5_3", "label": "Problem Practice 3", "section": "Casework counting", "text": "Ana writes all the numbers from 1 to 444 on a paper. How many times does she write the digit 3?", "steps": [{"q": "Case 1: how many times does she write a 3 in the hundreds place?", "type": "num", "ans": 100, "nudges": ["Which numbers start with 3?", "300 to 399.", "How many numbers is that?"], "hint": "Make cases: the 3 is in the hundreds, the tens, or the ones place. Every number from 300 to 399 has a 3 in the hundreds place.", "reveal": "100.", "check": "Checked by testing every number from 1 to 444.", "ok": "Case 1 done.", "named": {"99": "300 to 399 includes both ends.", "45": "Which three-digit numbers start with 3?"}, "ph": "number or expression", "special": null, "order": false}, {"q": "Case 2: how many times does she write a 3 in the tens place?", "type": "num", "ans": 50, "nudges": ["Picture _ 3 _. Which digits can go in front of the 3?", "Can the hundreds digit be 4? Is 439 below 444?", "First the hundreds digit, and then the ones digit: multiply."], "hint": "The hundreds digit can be 0, 1, 2, 3 or 4, and the ones digit anything from 0 to 9.", "reveal": "5 \u00d7 10 = 50.", "check": "Checked by testing every number.", "ok": "Case 2 done.", "named": {"40": "Can the hundreds digit be 4? 430 to 439 are all below 444.", "45": "Count the hundreds digits 0 to 4, then the ones digits 0 to 9.", "60": "The hundreds digit can't be 5: 530 is past 444."}, "ph": "number or expression", "special": null, "order": false}, {"q": "Case 3: how many times does she write a 3 in the ones place?", "type": "num", "ans": 45, "nudges": ["3, 13, 23, \u2026 what's the last one?", "Look at the part in front of the 3: it runs from 0 to what?", "Count 0 to 44."], "hint": "The part in front of the 3 runs from 0 to 44.", "reveal": "45.", "check": "Checked by testing every number.", "ok": "Case 3 done.", "named": {"44": "Don't forget 3 itself: the part in front is 0.", "444": "Only one in every ten numbers ends in 3."}, "ph": "number or expression", "special": null, "order": false}, {"q": "How many times does she write the digit 3 altogether?", "type": "num", "ans": 195, "nudges": ["Is a 3 in the ones place the same 3 as one in the tens place?", "Disjoint cases: add.", "Use steps 1, 2 and 3."], "hint": "Each 3 sits in exactly one place, so the three places are disjoint cases: add.", "reveal": "100 + 50 + 45 = 195.", "check": "Writing out 1 to 444 and counting gives 195.", "ok": "Cases add.", "named": {"194": "Numbers like 33 and 333 have more than one 3, and each one counts.", "145": "Did you include all of the hundreds place?", "95": "Don't forget the hundreds place (300 to 399)."}, "ph": "number or expression", "special": null, "order": false}], "story": "<div class=\"story worked\" id=\"story55\" tabindex=\"0\" aria-label=\"Worked answer: Problem Practice 3\" data-plan='[&quot;What could it look like?&quot;, &quot;Each case: first, and then&quot;, &quot;Either, or: add&quot;, &quot;Check a tiny case&quot;]'><div class=\"wbody\"><div class=\"plan-side\" aria-hidden=\"true\"><ol><li data-s=\"1\">What structures might we consider? Make cases where decisions behave differently (like a first digit, which can&#x27;t be 0).<\/li><li data-s=\"2\">Inside each case, break it into steps: first ___, and then ___. Multiply.<\/li><li data-s=\"3\">If the cases are disjoint (non-overlapping), count them separately and add.<\/li><li data-s=\"4\">Check a tiny case you can list.<\/li><\/ol><\/div><div class=\"wmain\"><div class=\"plan-strip\" aria-hidden=\"true\"><span data-s=\"1\">1<\/span><span data-s=\"2\">2<\/span><span data-s=\"3\">3<\/span><span data-s=\"4\">4<\/span><span class=\"stepname\"><\/span><\/div><figure class=\"frame\" data-step=\"1\"><p class=\"ftitle\">1. What could it look like?<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 420 108\" role=\"img\" aria-label=\"structure\" style=\"max-width:609px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"4\" y=\"4\" width=\"412\" height=\"100\" rx=\"10\" class=\"wcard \"/><text x=\"210.0\" y=\"32\" class=\"cardt\" text-anchor=\"middle\">every 3 she writes sits in one place:<\/text><text x=\"210.0\" y=\"58\" class=\"cardt\" text-anchor=\"middle\">the hundreds, the tens, or the ones place<\/text><text x=\"210.0\" y=\"84\" class=\"cardt\" text-anchor=\"middle\">\u2192 three disjoint cases<\/text><\/svg><\/div><figcaption><p>Count the 3s by where they sit. A 3 in the tens place and a 3 in the ones place are different 3s on the paper (33 has two of them), so the three places are disjoint cases.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 122 272\" role=\"img\" aria-label=\"tiles\" style=\"max-width:177px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p2\"/><text x=\"25.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">3<\/text><rect x=\"44\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"59.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">0<\/text><rect x=\"78\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"93.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">0<\/text><rect x=\"10\" y=\"48\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p2\"/><text x=\"25.0\" y=\"69.0\" class=\"tilet\" text-anchor=\"middle\">3<\/text><rect x=\"44\" y=\"48\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"59.0\" y=\"69.0\" class=\"tilet\" text-anchor=\"middle\">0<\/text><rect x=\"78\" y=\"48\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"93.0\" y=\"69.0\" class=\"tilet\" text-anchor=\"middle\">1<\/text><rect x=\"10\" y=\"88\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p2\"/><text x=\"25.0\" y=\"109.0\" class=\"tilet\" text-anchor=\"middle\">3<\/text><rect x=\"44\" y=\"88\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"59.0\" y=\"109.0\" class=\"tilet\" text-anchor=\"middle\">0<\/text><rect x=\"78\" y=\"88\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"93.0\" y=\"109.0\" class=\"tilet\" text-anchor=\"middle\">2<\/text><rect x=\"10\" y=\"128\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p2\"/><text x=\"25.0\" y=\"149.0\" class=\"tilet\" text-anchor=\"middle\">3<\/text><rect x=\"44\" y=\"128\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"59.0\" y=\"149.0\" class=\"tilet\" text-anchor=\"middle\">0<\/text><rect x=\"78\" y=\"128\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"93.0\" y=\"149.0\" class=\"tilet\" text-anchor=\"middle\">3<\/text><rect x=\"10\" y=\"168\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"25.0\" y=\"189.0\" class=\"tilet\" text-anchor=\"middle\">\u22ee<\/text><rect x=\"44\" y=\"168\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"59.0\" y=\"189.0\" class=\"tilet\" text-anchor=\"middle\"><\/text><rect x=\"78\" y=\"168\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"93.0\" y=\"189.0\" class=\"tilet\" text-anchor=\"middle\"><\/text><rect x=\"10\" y=\"208\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p2\"/><text x=\"25.0\" y=\"229.0\" class=\"tilet\" text-anchor=\"middle\">3<\/text><rect x=\"44\" y=\"208\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"59.0\" y=\"229.0\" class=\"tilet\" text-anchor=\"middle\">9<\/text><rect x=\"78\" y=\"208\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"93.0\" y=\"229.0\" class=\"tilet\" text-anchor=\"middle\">9<\/text><text x=\"61.0\" y=\"266\" class=\"cap\" text-anchor=\"middle\">100 of these<\/text><\/svg><\/div><figcaption><p>Case 1, the 3 is written in the hundreds place: 300, 301, 302, 303, \u2026, 399. 100 of these.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><div class=\"vstack\"><svg class=\"pic \" viewBox=\"0 0 302 134\" role=\"img\" aria-label=\"slots\" style=\"max-width:438px\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"47.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">hundreds: 0\u20134<\/text><rect x=\"10\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"47.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">5<\/text><text x=\"99.0\" y=\"62\" class=\"op\" text-anchor=\"middle\"><\/text><text x=\"151.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">tens<\/text><rect x=\"114\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot fixed\"/><text x=\"151.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">3<\/text><text x=\"203.0\" y=\"62\" class=\"op\" text-anchor=\"middle\"><\/text><text x=\"255.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">ones: 0\u20139<\/text><rect x=\"218\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"255.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">10<\/text><text x=\"151.0\" y=\"128\" class=\"cap\" text-anchor=\"middle\">5 options, the 3, 10 options<\/text><\/svg><svg class=\"pic \" viewBox=\"0 0 241 70\" role=\"img\" aria-label=\"case 2\" style=\"max-width:349px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"25.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">5<\/text><text x=\"64.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">\u00b7<\/text><rect x=\"88\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"110.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">10<\/text><text x=\"155.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"179\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"201.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">50<\/text><\/svg><\/div><\/div><figcaption><p>Case 2, the 3 is written in the tens place: _ 3 _. The hundreds digit can be 0, 1, 2, 3 or 4 (5 options; 0 means a number like 35, and 4 is fine because 439 is below 444). The ones digit can be anything, 0 to 9 (10 options). 5 \u00b7 10 = 50.<\/p><div class=\"ask\"><b>Ask him:<\/b> Why can the hundreds digit be 4 here, but the numbers stop at 444?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 122 232\" role=\"img\" aria-label=\"tiles\" style=\"max-width:177px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"25.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\"> <\/text><rect x=\"44\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"59.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">0<\/text><rect x=\"78\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p2\"/><text x=\"93.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">3<\/text><rect x=\"10\" y=\"48\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"25.0\" y=\"69.0\" class=\"tilet\" text-anchor=\"middle\"> <\/text><rect x=\"44\" y=\"48\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"59.0\" y=\"69.0\" class=\"tilet\" text-anchor=\"middle\">1<\/text><rect x=\"78\" y=\"48\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p2\"/><text x=\"93.0\" y=\"69.0\" class=\"tilet\" text-anchor=\"middle\">3<\/text><rect x=\"10\" y=\"88\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"25.0\" y=\"109.0\" class=\"tilet\" text-anchor=\"middle\"> <\/text><rect x=\"44\" y=\"88\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"59.0\" y=\"109.0\" class=\"tilet\" text-anchor=\"middle\">2<\/text><rect x=\"78\" y=\"88\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p2\"/><text x=\"93.0\" y=\"109.0\" class=\"tilet\" text-anchor=\"middle\">3<\/text><rect x=\"10\" y=\"128\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"25.0\" y=\"149.0\" class=\"tilet\" text-anchor=\"middle\"><\/text><rect x=\"44\" y=\"128\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"59.0\" y=\"149.0\" class=\"tilet\" text-anchor=\"middle\">\u22ee<\/text><rect x=\"78\" y=\"128\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"93.0\" y=\"149.0\" class=\"tilet\" text-anchor=\"middle\"><\/text><rect x=\"10\" y=\"168\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"25.0\" y=\"189.0\" class=\"tilet\" text-anchor=\"middle\">4<\/text><rect x=\"44\" y=\"168\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile \"/><text x=\"59.0\" y=\"189.0\" class=\"tilet\" text-anchor=\"middle\">4<\/text><rect x=\"78\" y=\"168\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p2\"/><text x=\"93.0\" y=\"189.0\" class=\"tilet\" text-anchor=\"middle\">3<\/text><text x=\"61.0\" y=\"226\" class=\"cap\" text-anchor=\"middle\">the part in front: 0, 1, 2, \u2026, 44 \u2192 45 numbers<\/text><\/svg><\/div><figcaption><p>Case 3, the 3 is written in the ones place: 03, 13, 23, \u2026, 443. The part in front of the 3 runs from 0 to 44, so there are 45 numbers.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>case (cases add +)<\/th><th>inside the case: first, and then (steps multiply \u00d7)<\/th><th>count<\/th><\/tr><\/thead><tbody><tr><td>3 in the hundreds place<\/td><td>300 to 399<\/td><td>100<\/td><\/tr><tr><td>3 in the tens place<\/td><td>5 \u00d7 10<\/td><td>50<\/td><\/tr><tr><td>3 in the ones place<\/td><td>0 to 44 in front<\/td><td>45<\/td><\/tr><tr class=\"hl\"><td>total (add the cases)<\/td><td>100 + 50 + 45<\/td><td>195<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>The shape of every Week 5 problem: split it into cases, multiply the steps inside each case (\u201cfirst ___, and then ___\u201d), then add the cases (\u201ceither ___ or ___\u201d). Here: 3 cases, each one a multiplication, added together.<\/p><div class=\"ask\"><b>Ask him:<\/b> Which numbers here are multiplied, and which are added? Why?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 371 70\" role=\"img\" aria-label=\"add\" style=\"max-width:538px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"38.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">100<\/text><text x=\"90.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">+<\/text><rect x=\"114\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"136.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">50<\/text><text x=\"181.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">+<\/text><rect x=\"205\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"227.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">45<\/text><text x=\"272.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"296\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"324.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">195<\/text><\/svg><\/div><figcaption><p>Disjoint cases, so add: 100 + 50 + 45 = 195.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"4\"><p class=\"ftitle\">4. Check a tiny case<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 371 70\" role=\"img\" aria-label=\"tiny case\" style=\"max-width:538px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"122\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"71.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">1 to 44:<\/text><rect x=\"140\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"162.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">10<\/text><text x=\"207.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">+<\/text><rect x=\"231\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"246.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">5<\/text><text x=\"285.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"309\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"331.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">15<\/text><\/svg><\/div><figcaption><p>Tiny case: from 1 to 44. Tens place: 30\u201339 (10). Ones place: 3, 13, 23, 33, 43 (5). 10 + 5 = 15, and writing them all out gives exactly fifteen 3s.<\/p><\/figcaption><\/figure><\/div><\/div><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><input type=\"checkbox\" class=\"showall\"> Show all steps<\/label><\/div><\/div>", "answer": "195", "check": "100 + 50 + 45 = 195; counted directly from 1 to 444.", "concept": "w5rules", "inclass": null, "above": false, "note": null, "figure": null}, {"id": "ps5_4", "label": "Problem Practice 4", "section": "Casework counting", "text": "(2007 MATHCOUNTS) How many even, three-digit positive integers have the property that exactly two of the integer's digits are equal?", "steps": [{"q": "Case 1, ABA (first and last digits equal, like 212): how many?", "type": "num", "ans": 36, "nudges": ["A is the first digit and the last digit. What two rules does it have to follow?", "Not 0 and even: which digits are left?", "And then B: anything except A."], "hint": "Make cases by structure: ABA, AAB or BAA. A is not 0 (first digit) and even (last digit): 2, 4, 6 or 8. B is any digit except A.", "reveal": "4 \u00b7 9 = 36.", "check": "Checked by testing.", "ok": "Case 1 done.", "named": {"45": "A is the first digit, so it can't be 0.", "32": "B can be 0.", "40": "B can't be equal to A."}, "ph": "number or expression", "special": null, "order": false}, {"q": "Case 2, AAB (first two digits equal, like 112): how many?", "type": "num", "ans": 41, "nudges": ["B is the last digit, so it's even. Does B = 0 behave differently from B = 2, 4, 6, 8?", "Subcases: B = 0, or B \u2260 0.", "If B = 0, A is anything but 0. If B \u2260 0, A can't be 0 or B."], "hint": "Subcase B = 0: A has 9 options. Subcase B \u2260 0: B has 4 options and A has 8. Subcases add.", "reveal": "9 + 4 \u00b7 8 = 41.", "check": "Checked by testing.", "ok": "A decision that behaves differently makes a subcase.", "named": {"45": "If B is 2, 4, 6 or 8, A can't be 0 or B: only 8 options.", "36": "Don't forget the subcase B = 0.", "32": "Don't forget the subcase B = 0.", "50": "A is the first digit, so it can't be 0."}, "ph": "number or expression", "special": null, "order": false}, {"q": "Case 3, BAA (last two digits equal, like 300): how many?", "type": "num", "ans": 41, "nudges": ["Now A is the last digit (even) and B is the first (not 0).", "Does A = 0 behave differently?", "It's the same counting as case 2, roles swapped."], "hint": "Subcase A = 0: B has 9 options. Subcase A \u2260 0: A has 4 options and B has 8.", "reveal": "9 + 4 \u00b7 8 = 41.", "check": "Checked by testing.", "ok": "Case 3 done.", "named": {"45": "If A is 2, 4, 6 or 8, B can't be 0 or A: only 8 options.", "36": "Count the subcase A = 0 too.", "32": "Count the subcase A = 0 too."}, "ph": "number or expression", "special": null, "order": false}, {"q": "How many even three-digit numbers have exactly two equal digits?", "type": "num", "ans": 118, "nudges": ["Can a number be in two of these cases?", "Disjoint cases: add.", "Use steps 1 to 3."], "hint": "Exactly two equal means the cases don't overlap: add.", "reveal": "36 + 41 + 41 = 118.", "check": "Testing all 450 even three-digit numbers finds 118.", "ok": "Cases add.", "named": {"122": "That includes numbers like 222, where all three digits are equal.", "77": "Did you include all three cases?"}, "ph": "number or expression", "special": null, "order": false}], "story": "<div class=\"story worked\" id=\"story56\" tabindex=\"0\" aria-label=\"Worked answer: Problem Practice 4\" data-plan='[&quot;What could it look like?&quot;, &quot;Each case: first, and then&quot;, &quot;Either, or: add&quot;, &quot;Check a tiny case&quot;]'><div class=\"wbody\"><div class=\"plan-side\" aria-hidden=\"true\"><ol><li data-s=\"1\">What structures might we consider? Make cases where decisions behave differently (like a first digit, which can&#x27;t be 0).<\/li><li data-s=\"2\">Inside each case, break it into steps: first ___, and then ___. Multiply.<\/li><li data-s=\"3\">If the cases are disjoint (non-overlapping), count them separately and add.<\/li><li data-s=\"4\">Check a tiny case you can list.<\/li><\/ol><\/div><div class=\"wmain\"><div class=\"plan-strip\" aria-hidden=\"true\"><span data-s=\"1\">1<\/span><span data-s=\"2\">2<\/span><span data-s=\"3\">3<\/span><span data-s=\"4\">4<\/span><span class=\"stepname\"><\/span><\/div><figure class=\"frame\" data-step=\"1\"><p class=\"ftitle\">1. What could it look like?<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 122 152\" role=\"img\" aria-label=\"tiles\" style=\"max-width:177px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p2\"/><text x=\"25.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">A<\/text><rect x=\"44\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p1\"/><text x=\"59.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">B<\/text><rect x=\"78\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p2\"/><text x=\"93.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">A<\/text><rect x=\"10\" y=\"48\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p2\"/><text x=\"25.0\" y=\"69.0\" class=\"tilet\" text-anchor=\"middle\">A<\/text><rect x=\"44\" y=\"48\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p2\"/><text x=\"59.0\" y=\"69.0\" class=\"tilet\" text-anchor=\"middle\">A<\/text><rect x=\"78\" y=\"48\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p1\"/><text x=\"93.0\" y=\"69.0\" class=\"tilet\" text-anchor=\"middle\">B<\/text><rect x=\"10\" y=\"88\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p1\"/><text x=\"25.0\" y=\"109.0\" class=\"tilet\" text-anchor=\"middle\">B<\/text><rect x=\"44\" y=\"88\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p2\"/><text x=\"59.0\" y=\"109.0\" class=\"tilet\" text-anchor=\"middle\">A<\/text><rect x=\"78\" y=\"88\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p2\"/><text x=\"93.0\" y=\"109.0\" class=\"tilet\" text-anchor=\"middle\">A<\/text><text x=\"61.0\" y=\"146\" class=\"cap\" text-anchor=\"middle\">case 1: ABA   case 2: AAB   case 3: BAA<\/text><\/svg><\/div><figcaption><p>Structures: what could these numbers look like? (The teacher&#x27;s question.) Exactly two digits equal: call the repeated digit A and the other B. Then the number is ABA, AAB or BAA. In every case the first digit is not 0 and the last digit is even. Exactly two equal means A \u2260 B, so the three cases are disjoint.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><div class=\"vstack\"><svg class=\"pic \" viewBox=\"0 0 302 134\" role=\"img\" aria-label=\"slots\" style=\"max-width:438px\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"47.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">A (first): not 0<\/text><rect x=\"10\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"47.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">4<\/text><text x=\"99.0\" y=\"62\" class=\"op\" text-anchor=\"middle\"><\/text><text x=\"151.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">B \u2260 A<\/text><rect x=\"114\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"151.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">9<\/text><text x=\"203.0\" y=\"62\" class=\"op\" text-anchor=\"middle\"><\/text><text x=\"255.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">A (last): even<\/text><rect x=\"218\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot fixed\"/><text x=\"255.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">A<\/text><text x=\"151.0\" y=\"128\" class=\"cap\" text-anchor=\"middle\">A: 2, 4, 6, 8<\/text><\/svg><svg class=\"pic \" viewBox=\"0 0 228 70\" role=\"img\" aria-label=\"case 1\" style=\"max-width:331px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"25.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">4<\/text><text x=\"64.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">\u00b7<\/text><rect x=\"88\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"103.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">9<\/text><text x=\"142.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"166\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"188.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">36<\/text><\/svg><\/div><\/div><figcaption><p>Case 1, ABA: A is both the first digit (not 0) and the last digit (even), so A is 2, 4, 6 or 8 (4 options). B is anything but A (9 options). 4 \u00b7 9 = 36.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><div class=\"vstack\"><table class=\"ptable \"><thead><tr><th>subcase<\/th><th>B (last digit, even)<\/th><th>A (first, not 0, not B)<\/th><th>ways<\/th><\/tr><\/thead><tbody><tr><td>B = 0<\/td><td>1 option<\/td><td>9 options<\/td><td>9<\/td><\/tr><tr><td>B \u2260 0<\/td><td>2, 4, 6, 8 (4 options)<\/td><td>8 options<\/td><td>4 \u00b7 8 = 32<\/td><\/tr><\/tbody><\/table><svg class=\"pic \" viewBox=\"0 0 280 70\" role=\"img\" aria-label=\"case 2\" style=\"max-width:406px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"25.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">9<\/text><text x=\"64.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">+<\/text><rect x=\"88\" y=\"16\" width=\"83\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"129.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">4 \u00b7 8<\/text><text x=\"194.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"218\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"240.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">41<\/text><\/svg><\/div><\/div><figcaption><p>Case 2, AAB: the last digit B is even and the first digit A is not 0. Does B = 0 behave differently? Yes: if B = 0, A can be any of 1 to 9 (9 options). If B is 2, 4, 6 or 8 (4 options), A can&#x27;t be 0 and can&#x27;t be B (8 options). Subcases add: 9 + 4 \u00b7 8 = 41.<\/p><div class=\"ask\"><b>Ask him:<\/b> Why does B = 0 need its own subcase?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>subcase<\/th><th>A (last two digits, even)<\/th><th>B (first, not 0, not A)<\/th><th>ways<\/th><\/tr><\/thead><tbody><tr><td>A = 0<\/td><td>1 option<\/td><td>9 options<\/td><td>9<\/td><\/tr><tr><td>A \u2260 0<\/td><td>2, 4, 6, 8 (4 options)<\/td><td>8 options<\/td><td>4 \u00b7 8 = 32<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Case 3, BAA: the same counting with the roles swapped. Now A is the even last digit and B is the first digit (not 0, not A): 9 + 4 \u00b7 8 = 41.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>case (cases add +)<\/th><th>inside the case: first, and then (steps multiply \u00d7)<\/th><th>count<\/th><\/tr><\/thead><tbody><tr><td>ABA<\/td><td>4 \u00d7 9<\/td><td>36<\/td><\/tr><tr><td>AAB (subcases B = 0, B \u2260 0)<\/td><td>9 + 4 \u00d7 8<\/td><td>41<\/td><\/tr><tr><td>BAA (subcases A = 0, A \u2260 0)<\/td><td>9 + 4 \u00d7 8<\/td><td>41<\/td><\/tr><tr class=\"hl\"><td>total (add the cases)<\/td><td>36 + 41 + 41<\/td><td>118<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>The shape of every Week 5 problem: split it into cases, multiply the steps inside each case (\u201cfirst ___, and then ___\u201d), then add the cases (\u201ceither ___ or ___\u201d). Here: 3 cases, each one a multiplication, added together.<\/p><div class=\"ask\"><b>Ask him:<\/b> Which numbers here are multiplied, and which are added? Why?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 358 70\" role=\"img\" aria-label=\"add\" style=\"max-width:519px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"32.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">36<\/text><text x=\"77.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">+<\/text><rect x=\"101\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"123.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">41<\/text><text x=\"168.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">+<\/text><rect x=\"192\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"214.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">41<\/text><text x=\"259.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"283\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"311.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">118<\/text><\/svg><\/div><figcaption><p>The three structures are disjoint cases, so add: 36 + 41 + 41 = 118.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 267 92\" role=\"img\" aria-label=\"tempting\" style=\"max-width:387px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"38.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">118<\/text><text x=\"90.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">+<\/text><rect x=\"114\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"129.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">4<\/text><text x=\"168.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"192\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"220.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">122<\/text><line x1=\"6\" y1=\"60\" x2=\"261\" y2=\"12\" class=\"strike banned big\"/><text x=\"133.5\" y=\"86\" class=\"cap\" text-anchor=\"middle\">222, 444, 666, 888 have all three digits equal<\/text><\/svg><\/div><figcaption><p>Careful: numbers like 222 have all three digits equal, not exactly two. Counting them would give 122.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"4\"><p class=\"ftitle\">4. Check a tiny case<\/p><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>case<\/th><th>counted<\/th><th>by testing all 450 even three-digit numbers<\/th><\/tr><\/thead><tbody><tr><td>ABA<\/td><td>36<\/td><td>36<\/td><\/tr><tr><td>AAB<\/td><td>9 + 32 = 41<\/td><td>41<\/td><\/tr><tr><td>BAA<\/td><td>9 + 32 = 41<\/td><td>41<\/td><\/tr><tr><td>total<\/td><td>118<\/td><td>118<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Check: testing every even three-digit number finds exactly 36, 41 and 41 in the three cases (and 9 + 32 inside each of the last two), 118 in all.<\/p><\/figcaption><\/figure><\/div><\/div><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><input type=\"checkbox\" class=\"showall\"> Show all steps<\/label><\/div><\/div>", "answer": "118", "check": "ABA 36 + AAB 41 + BAA 41 = 118; checked over all 450 even three-digit numbers.", "concept": "w5rules", "inclass": null, "above": true, "note": null, "figure": null}, {"id": "ps5_5", "label": "Problem Practice 2.1", "section": "Complementary counting", "text": "(1985 AJHSME) How many whole numbers between 100 and 400 contain the digit 2?", "steps": [{"q": "Complement: how many numbers from 100 to 399 do not contain a 2?", "type": "num", "ans": 162, "nudges": ["Which hundreds digits are allowed if there's no 2?", "And the tens and ones digits?", "First the hundreds, and then the tens, and then the ones."], "hint": "\u201cContains the digit 2\u201d means \u201cat least one 2\u201d: count the complement. Make two cases: the ones we want, and the complement. Count the Total and the complement, then subtract. Complement: hundreds 1 or 3; tens and ones anything but 2.", "reveal": "2 \u00b7 9 \u00b7 9 = 162.", "check": "Checked by testing every number from 100 to 399.", "ok": "Complement done.", "named": {"243": "The hundreds digit can't be 2 either: only 1 or 3.", "81": "Don't forget the hundreds digit's options.", "200": "The tens and ones can't be 2."}, "ph": "number or expression", "special": null, "order": false}, {"q": "Total: how many whole numbers are there from 100 to 399?", "type": "num", "ans": 300, "nudges": ["What can the hundreds digit be?", "And then the tens and the ones?", "Or just count: 100 to 399."], "hint": "Hundreds 1, 2 or 3; tens and ones anything.", "reveal": "300 numbers (3 \u00b7 10 \u00b7 10).", "check": "100 to 399 is 300 numbers.", "ok": "Total done.", "named": {"299": "From 100 to 399 includes both ends.", "400": "Stop at 399: 400 is past the end, and it has no 2 anyway."}, "ph": "number or expression", "special": null, "order": false}, {"q": "How many whole numbers between 100 and 400 contain the digit 2?", "type": "num", "ans": 138, "nudges": ["Total = the ones we want + the complement.", "So the ones we want = Total \u2212 complement.", "Use steps 1 and 2."], "hint": "Subtract the complement from the total. Inside each count, multiply; then the two cases make the total.", "reveal": "300 \u2212 162 = 138.", "check": "Checked by testing every number from 100 to 399.", "ok": "Count = Total \u2212 complement.", "named": {"162": "That's the complement: numbers with no 2.", "462": "Subtract, don't add.", "100": "That's only the numbers from 200 to 299."}, "ph": "number or expression", "special": null, "order": false}], "story": "<div class=\"story worked\" id=\"story57\" tabindex=\"0\" aria-label=\"Worked answer: Problem Practice 2.1\" data-plan='[&quot;What could it look like?&quot;, &quot;Each case: first, and then&quot;, &quot;Either, or: add&quot;, &quot;Check a tiny case&quot;]'><div class=\"wbody\"><div class=\"plan-side\" aria-hidden=\"true\"><ol><li data-s=\"1\">What structures might we consider? Make cases where decisions behave differently (like a first digit, which can&#x27;t be 0).<\/li><li data-s=\"2\">Inside each case, break it into steps: first ___, and then ___. Multiply.<\/li><li data-s=\"3\">If the cases are disjoint (non-overlapping), count them separately and add.<\/li><li data-s=\"4\">Check a tiny case you can list.<\/li><\/ol><\/div><div class=\"wmain\"><div class=\"plan-strip\" aria-hidden=\"true\"><span data-s=\"1\">1<\/span><span data-s=\"2\">2<\/span><span data-s=\"3\">3<\/span><span data-s=\"4\">4<\/span><span class=\"stepname\"><\/span><\/div><figure class=\"frame\" data-step=\"1\"><p class=\"ftitle\">1. What could it look like?<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 360 212\" role=\"img\" aria-label=\"the word chain\" style=\"max-width:522px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"4\" y=\"4\" width=\"352\" height=\"204\" rx=\"10\" class=\"wcard \"/><text x=\"180.0\" y=\"32\" class=\"cardt\" text-anchor=\"middle\">\u201ccontain the digit 2\u201d<\/text><text x=\"180.0\" y=\"58\" class=\"cardt\" text-anchor=\"middle\">\u2193  means<\/text><text x=\"180.0\" y=\"84\" class=\"cardt\" text-anchor=\"middle\">\u201cat least one 2\u201d<\/text><text x=\"180.0\" y=\"110\" class=\"cardt\" text-anchor=\"middle\">\u2193  so count the complement<\/text><text x=\"180.0\" y=\"136\" class=\"cardt\" text-anchor=\"middle\">\u201cno 2 at all\u201d<\/text><text x=\"180.0\" y=\"162\" class=\"cardt\" text-anchor=\"middle\">\u2193<\/text><text x=\"180.0\" y=\"188\" class=\"cardt\" text-anchor=\"middle\">Total \u2212 complement<\/text><\/svg><\/div><figcaption><p>The teacher&#x27;s arrow: \u201ccontain the digit 2\u201d means \u201cat least one\u201d 2. And \u201cat least one\u201d is the signal for complementary counting: its opposite is \u201cno 2 at all\u201d, which is one easy multiplication. Count you want = Total \u2212 complement.<\/p><div class=\"ask\"><b>Ask him:<\/b> What other words in a problem mean \u201cat least one\u201d?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"1\"><p class=\"ftitle\">1. What could it look like?<\/p><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>what we want: contains a 2<\/th><th>the complement: no 2 at all<\/th><\/tr><\/thead><tbody><tr><td>123<\/td><td>135<\/td><\/tr><tr><td>202<\/td><td>399<\/td><\/tr><tr><td>342<\/td><td>101<\/td><\/tr><tr><td>\u2026 every number with a 2 somewhere<\/td><td>\u2026 every number with no 2<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>\u201cContains the digit 2\u201d means at least one 2. Its complement is \u201cno 2 at all\u201d. Every number from 100 to 399 is in exactly one column. (100 and 400 have no 2, so it doesn&#x27;t matter whether \u201cbetween\u201d includes them.)<\/p><div class=\"ask\"><b>Ask him:<\/b> Is 222 in the left column or the right one?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 416 134\" role=\"img\" aria-label=\"slots\" style=\"max-width:603px\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"47.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">1, 3<\/text><rect x=\"10\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"47.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">2<\/text><text x=\"99.0\" y=\"62\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><text x=\"151.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">not 2<\/text><rect x=\"114\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"151.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">9<\/text><text x=\"203.0\" y=\"62\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><text x=\"255.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">not 2<\/text><rect x=\"218\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"255.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">9<\/text><text x=\"307.0\" y=\"62\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"322\" y=\"28\" width=\"84\" height=\"50\" rx=\"8\" class=\"result\"/><text x=\"364.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">162<\/text><text x=\"208.0\" y=\"128\" class=\"cap\" text-anchor=\"middle\">hundreds 1 or 3; tens and ones not 2<\/text><\/svg><\/div><figcaption><p>Complement first (the teacher&#x27;s order): numbers between 100 and 399 which do not contain 2. The teacher crosses out 400 and writes 399: \u201cwe can adjust the total as long as we are looking at a total containing the desired count.\u201d (400 has no 2, so leaving it out loses nothing we want.) Hundreds digit 1 or 3 (2 options), tens not 2 (9 options), ones not 2 (9 options): 2 \u00b7 9 \u00b7 9 = 162.<\/p><div class=\"ask\"><b>Ask him:<\/b> Why only 2 options for the hundreds digit?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 436 70\" role=\"img\" aria-label=\"total\" style=\"max-width:632px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"200\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"110.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">Total: 100\u2013399<\/text><text x=\"233.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"257\" y=\"16\" width=\"161\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"337.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">300 numbers<\/text><\/svg><\/div><figcaption><p>Total: 100 to 399, which is 300 numbers (3 \u00b7 10 \u00b7 10 = 300).<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>case (they add up to the Total)<\/th><th>count<\/th><\/tr><\/thead><tbody><tr><td>the ones we want (contain a 2)<\/td><td>?<\/td><\/tr><tr><td>the complement (no 2)<\/td><td>162<\/td><\/tr><tr class=\"hl\"><td>Total<\/td><td>300<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Two disjoint cases make up the Total, so the one we want is the Total minus the complement.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><div class=\"vstack\"><svg class=\"pic \" viewBox=\"0 0 460 200\" role=\"img\" aria-label=\"complement\" style=\"max-width:667px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"30\" width=\"440\" height=\"130\" rx=\"6\" class=\"wcard\"/><text x=\"60\" y=\"22\" class=\"slotlab\" text-anchor=\"start\">Total = 300<\/text><rect x=\"24\" y=\"42\" width=\"270\" height=\"106\" rx=\"6\" style=\"fill:#E1ECFC;stroke:var(--p1);stroke-width:2\"/><circle cx=\"115\" cy=\"65\" r=\"2\" class=\"dot\"/><circle cx=\"197\" cy=\"58\" r=\"2\" class=\"dot\"/><circle cx=\"168\" cy=\"83\" r=\"2\" class=\"dot\"/><circle cx=\"48\" cy=\"96\" r=\"2\" class=\"dot\"/><circle cx=\"43\" cy=\"89\" r=\"2\" class=\"dot\"/><circle cx=\"51\" cy=\"60\" r=\"2\" class=\"dot\"/><circle cx=\"140\" cy=\"123\" r=\"2\" class=\"dot\"/><circle cx=\"65\" cy=\"71\" r=\"2\" class=\"dot\"/><circle cx=\"191\" cy=\"134\" r=\"2\" class=\"dot\"/><circle cx=\"178\" cy=\"86\" r=\"2\" class=\"dot\"/><circle cx=\"278\" cy=\"56\" r=\"2\" class=\"dot\"/><circle cx=\"249\" cy=\"77\" r=\"2\" class=\"dot\"/><circle cx=\"70\" cy=\"62\" r=\"2\" class=\"dot\"/><circle cx=\"111\" cy=\"122\" r=\"2\" class=\"dot\"/><circle cx=\"79\" cy=\"102\" r=\"2\" class=\"dot\"/><circle cx=\"194\" cy=\"84\" r=\"2\" class=\"dot\"/><circle cx=\"171\" cy=\"57\" r=\"2\" class=\"dot\"/><circle cx=\"49\" cy=\"70\" r=\"2\" class=\"dot\"/><circle cx=\"204\" cy=\"89\" r=\"2\" class=\"dot\"/><circle cx=\"113\" cy=\"102\" r=\"2\" class=\"dot\"/><circle cx=\"147\" cy=\"78\" r=\"2\" class=\"dot\"/><circle cx=\"233\" cy=\"112\" r=\"2\" class=\"dot\"/><circle cx=\"95\" cy=\"101\" r=\"2\" class=\"dot\"/><circle cx=\"165\" cy=\"127\" r=\"2\" class=\"dot\"/><circle cx=\"216\" cy=\"77\" r=\"2\" class=\"dot\"/><circle cx=\"279\" cy=\"62\" r=\"2\" class=\"dot\"/><rect x=\"308\" y=\"42\" width=\"128\" height=\"106\" rx=\"6\" style=\"fill:#DEF1E7;stroke:var(--p4);stroke-width:2\"/><rect x=\"322\" y=\"50\" width=\"40\" height=\"24\" r .5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">9,000<\/text><\/svg><\/div><figcaption><p>Total: all four-digit numbers, 9,000.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>case (they add up to the Total)<\/th><th>count<\/th><\/tr><\/thead><tbody><tr><td>at least one 2 or 3 (what we want)<\/td><td>?<\/td><\/tr><tr><td>no 2 and no 3 (complement)<\/td><td>3,584<\/td><\/tr><tr class=\"hl\"><td>Total<\/td><td>9,000<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Two disjoint cases make up the Total.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 371 70\" role=\"img\" aria-label=\"count\" style=\"max-width:538px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"83\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"51.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">9,000<\/text><text x=\"116.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">\u2212<\/text><rect x=\"140\" y=\"16\" width=\"83\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"181.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">3,584<\/text><text x=\"246.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"270\" y=\"16\" width=\"83\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"311.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">5,416<\/text><\/svg><\/div><figcaption><p>Count = 9,000 \u2212 3,584 = 5,416.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"4\"><p class=\"ftitle\">4. Check a tiny case<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 293 70\" role=\"img\" aria-label=\"tiny case\" style=\"max-width:425px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"32.0\" y=\"43\" class=\"calcn b7 4 \u00b7 8 \u00b7 7 = 448.", "check": "Checked by testing.", "ok": "Case 1 done.", "named": {"560": "The last digit can't be the same even digit as the first.", "640": "The middle digits must be different from each other too."}, "ph": "number or expression", "special": null, "order": false}, {"q": "Case 2: the first digit is 5. How many such numbers?", "type": "num", "ans": 280, "nudges": ["Now how many even digits can go last?", "And then the middle two digits?", "Multiply."], "hint": "First digit 5 (1 option), last digit any even digit (5 options), then 8 \u00b7 7 for the middle.", "reveal": "1 \u00b7 5 \u00b7 8 \u00b7 7 = 280.", "check": "Checked by testing.", "ok": "Case 2 done.", "named": {"224": "With 5 first, all 5 even digits can go last."}, "ph": "number or expression", "special": null, "order": false}, {"q": "How many even integers between 4000 and 7000 have four different digits?", "type": "num", "ans": 728, "nudges": ["Disjoint cases: add.", "Use steps 1 and 2.", "Add the two case counts."], "hint": "Add the cases.", "reveal": "448 + 280 = 728.", "check": "Checked by testing every number from 4000 to 7000.", "ok": "Cases add.", "named": {"840": "Check case 1: the last digit can't repeat the first digit.", "1008": "There are only 3 possible first digits: 4, 5, 6."}, "ph": "number or expression", "special": null, "order": false}], "story": "<div class=\"story worked\" id=\"story60\" tabindex=\"0\" aria-label=\"Worked answer: Problem Problem 8\" data-plan='[&quot;What could it look like?&quot;, &quot;Each case: first, and then&quot;, &quot;Either, or: add&quot;, &quot;Check a tiny case&quot;]'><div class=\"wbody\"><div class=\"plan-side\" aria-hidden=\"true\"><ol><li data-s=\"1\">What structures might we consider? Make cases where decisions behave differently (like a first digit, which can&#x27;t be 0).<\/li><li data-s=\"2\">Inside each case, break it into steps: first ___, and then ___. Multiply.<\/li><li data-s=\"3\">If the cases are disjoint (non-overlapping), count them separately and add.<\/li><li data-s=\"4\">Check a tiny case you can list.<\/li><\/ol><\/div><div class=\"wmain\"><div class=\"plan-strip\" aria-hidden=\"true\"><span data-s=\"1\">1<\/span><span data-s=\"2\">2<\/span><span data-s=\"3\">3<\/span><span data-s=\"4\">4<\/span><span class=\"stepname\"><\/span><\/div><figure class=\"frame\" data-step=\"1\"><p class=\"ftitle\">1. What could it look like?<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 366 134\" role=\"img\" aria-label=\"structure\" style=\"max-width:531px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"4\" y=\"4\" width=\"358\" height=\"126\" rx=\"10\" class=\"wcard \"/><text x=\"183.0\" y=\"32\" class=\"cardt\" text-anchor=\"middle\">first digit: 4, 5 or 6<\/text><text x=\"183.0\" y=\"58\" class=\"cardt\" text-anchor=\"middle\">last digit: even<\/text><text x=\"183.0\" y=\"84\" class=\"cardt\" text-anchor=\"middle\">all four digits different<\/text><text x=\"183.0\" y=\"110\" class=\"cardt\" text-anchor=\"middle\">4 and 6 are even, 5 is odd \u2192 two cases<\/text><\/svg><\/div><figcaption><p>What could these numbers look like? The first digit is 4, 5 or 6, and the last digit is even. If the first digit is even, it uses up one of the even digits, so 4 and 6 behave differently from 5: two cases. (4000 and 7000 repeat digits, so the endpoints don&#x27;t matter.)<\/p><div class=\"ask\"><b>Ask him:<\/b> Why do 4 and 6 behave differently from 5?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 520 134\" role=\"img\" aria-label=\"slots\" style=\"max-width:754px\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"47.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">first<\/text><rect x=\"10\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"47.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">2<\/text><text x=\"99.0\" y=\"62\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><text x=\"151.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">last<\/text><rect x=\"114\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"151.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">4<\/text><text x=\"203.0\" y=\"62\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><text x=\"255.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">2nd<\/text><rect x=\"218\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"255.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">8<\/text><text x=\"307.0\" y=\"62\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><text x=\"359.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">3rd<\/text><rect x=\"322\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"359.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">7<\/text><text x=\"411.0\" y=\"62\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"426\" y=\"28\" width=\"84\" height=\"50\" rx=\"8\" class=\"result\"/><text x=\"468.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">448<\/text><text x=\"260.0\" y=\"128\" class=\"cap\" text-anchor=\"middle\">first 4 or 6; last even, not the first<\/text><\/svg><\/div><figcaption><p>Case 1, first digit 4 or 6: 2 options. Then the last digit: even and not the first digit, 4 options. Then the middle two from the 8 digits left: 8 \u00b7 7. 2 \u00b7 4 \u00b7 8 \u00b7 7 = 448.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Each case: first, and then<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 520 134\" role=\"img\" aria-label=\"slots\" style=\"max-width:754px\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"47.0\" y=\"20\" class=\"slotlab\" text-anchor=\"middle\">first<\/text><rect x=\"10\" y=\"28\" width=\"74\" height=\"50\" rx=\"8\" class=\"slot \"/><text x=\"47.0\" y=\"63\" class=\"slotn\" text-anchor=\"middle\">1<\/text><text x=\"9 roblem has the same shape: split into cases, multiply inside each case, add the cases.<\/p><div class=\"ask\"><b>Ask him:<\/b> Which numbers are multiplied, and which are added? Why?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Either, or: add<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 293 70\" role=\"img\" aria-label=\"add\" style=\"max-width:425px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"38.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">448<\/text><text x=\"90.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">+<\/text><rect x=\"114\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"142.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">280<\/text><text x=\"194.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"218\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"246.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">728<\/text><\/svg><\/div><figcaption><p>Disjoint cases, so add: 448 + 280 = 728.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"4\"><p class=\"ftitle\">4. Check a tiny case<\/p><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>case<\/th><th>counted<\/th><th>by testing<\/th><\/tr><\/thead><tbody><tr><td>first digit 4 or 6<\/td><td>448<\/td><td>448<\/td><\/tr><tr><td>first digit 5<\/td><td>280<\/td><td>280<\/td><\/tr><tr><td>total<\/td><td>728<\/td><td>728<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Check: testing every number from 4000 to 7000 matches both cases.<\/p><\/figcaption><\/figure><\/div><\/div><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><labe
